services:
  - type: web
    name: appachi-stocks
    runtime: node
    buildCommand: npm install --omit=dev && npm run build:billing && node icons/make-icons.js
    startCommand: node server.js
    envVars:
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VAPID_EMAIL
        value: mailto:admin@appachijewellery.com
      - key: PAYROLL_PGHOST
        sync: false
      - key: PAYROLL_PGPORT
        sync: false
      - key: PAYROLL_PGDATABASE
        sync: false
      - key: PAYROLL_PGUSER
        sync: false
      - key: PAYROLL_PGPASSWORD
        sync: false
