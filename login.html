<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script>
document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';
if (localStorage.getItem('aj_lang') === 'ta') document.documentElement.dataset.lang = 'ta';
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title data-i18n="pageTitle">Sign In · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  .theme-btn{position:fixed;top:calc(20px + env(safe-area-inset-top, 0px));right:20px;background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--text-dim);cursor:pointer;transition:all .15s}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent)}
  .lang-btn{position:fixed;top:calc(20px + env(safe-area-inset-top, 0px));right:64px;background:none;border:1px solid var(--border);border-radius:8px;height:36px;padding:0 10px;display:grid;place-items:center;color:var(--text-dim);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.03em}
  .lang-btn:hover{border-color:var(--accent);color:var(--accent)}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px 24px; gap: 20px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 36px 32px 32px; width: 100%; max-width: 400px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #9c7c1a);
    display: grid; place-items: center;
    font-family: 'Fraunces', serif; font-weight: 800; font-size: 18px; color: #0d1117;
  }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; }
  .brand-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Tabs */
  .tabs { display: flex; background: var(--panel-elev); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
  .tab {
    flex: 1; padding: 9px 12px; border: none; border-radius: 7px; background: transparent;
    color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

  /* Forms */
  .form { display: none; } .form.active { display: block; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; padding: 11px 14px; background: var(--panel-elev); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 15px;
    outline: none; transition: border-color 0.15s; -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-dim); opacity: 0.5; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }

  .btn {
    width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), #9c7c1a);
    border: none; border-radius: 8px; color: #0d1117; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: opacity 0.15s; margin-top: 4px;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    display: none; background: rgba(255,93,93,0.12); border: 1px solid rgba(255,93,93,0.3);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #ff5d5d; margin-bottom: 16px;
  }
  .error.show { display: block; }

  .links { display: flex; justify-content: center; gap: 20px; font-size: 12px; }
  .links a { color: var(--text-dim); text-decoration: none; transition: color 0.15s; }
  .links a:hover { color: var(--accent); }

  .footer { font-size: 11px; color: var(--text-dim); text-align: center; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">TA</button>
  <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" data-i18n-attr="title:toggleTheme;aria-label:toggleTheme" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-name">Stocks</div>
        <div class="brand-sub">APPACHI JEWELLERY</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab" onclick="switchTab('email')" data-i18n="tabEmail">Email &amp; Password</button>
      <button class="tab active" onclick="switchTab('pin')" data-i18n="tabPin">ID &amp; PIN</button>
    </div>

    <!-- Error -->
    <div class="error" id="errMsg"></div>

    <!-- Email + Password form -->
    <form class="form" id="emailForm" onsubmit="handleLogin(event,'email')">
      <div class="field">
        <label data-i18n="emailLabel">Email</label>
        <input id="email" type="email" placeholder="your@email.com" autocomplete="email" required/>
      </div>
      <div class="field">
        <label data-i18n="passwordLabel">Password</label>
        <input id="password" type="password" placeholder="Your password" data-i18n-attr="placeholder:passwordPh" autocomplete="current-password" required/>
      </div>
      <button class="btn" type="submit" id="emailBtn" data-i18n="signInBtn">Sign In</button>
    </form>

    <!-- ID + PIN form -->
    <form class="form active" id="pinForm" onsubmit="handleLogin(event,'pin')">
      <div class="field">
        <label data-i18n="empIdLabel">Employee ID</label>
        <input id="empId" type="text" inputmode="numeric" placeholder="e.g. 55" data-i18n-attr="placeholder:empIdPh" autocomplete="username"/>
      </div>
      <div class="field">
        <label data-i18n="pinLabel">PIN</label>
        <input id="pin" type="password" inputmode="numeric" placeholder="Your PIN" data-i18n-attr="placeholder:pinPh" autocomplete="current-password"/>
      </div>
      <button class="btn" type="submit" id="pinBtn" data-i18n="signInBtn">Sign In</button>
    </form>
  </div>

  <div class="links">
    <a href="/signup.html" data-i18n="signupLink">New employee? Sign up</a>
    <a href="/reset.html" data-i18n="resetLink">Forgot password? Reset</a>
  </div>

  <div class="footer" data-i18n="footer">Contact your admin for signup codes &amp; resets</div>

<script>
const PAGE_DICT = {
  en: {
    pageTitle: 'Sign In · APPACHI',
    toggleTheme: 'Toggle theme',
    tabEmail: 'Email & Password',
    tabPin: 'ID & PIN',
    emailLabel: 'Email',
    passwordLabel: 'Password', passwordPh: 'Your password',
    empIdLabel: 'Employee ID', empIdPh: 'e.g. 55',
    pinLabel: 'PIN', pinPh: 'Your PIN',
    signInBtn: 'Sign In',
    signInBtnBusy: 'Signing in…',
    signupLink: 'New employee? Sign up',
    resetLink: 'Forgot password? Reset',
    footer: 'Contact your admin for signup codes & resets',
    errInvalid: 'Invalid credentials. Try again.',
    errNetwork: 'Network error. Please try again.',
  },
  ta: {
    pageTitle: 'உள்நுழைவு · APPACHI',
    toggleTheme: 'தீம் மாற்று',
    tabEmail: 'மின்னஞ்சல் & கடவுச்சொல்',
    tabPin: 'ஐடி & பின்',
    emailLabel: 'மின்னஞ்சல்',
    passwordLabel: 'கடவுச்சொல்', passwordPh: 'உங்கள் கடவுச்சொல்',
    empIdLabel: 'பணியாளர் ஐடி', empIdPh: 'எ.கா. 55',
    pinLabel: 'பின்', pinPh: 'உங்கள் பின்',
    signInBtn: 'உள்நுழையவும்',
    signInBtnBusy: 'உள்நுழைகிறது…',
    signupLink: 'புதிய பணியாளரா? பதிவு செய்யவும்',
    resetLink: 'கடவுச்சொல் மறந்துவிட்டதா? மீட்டமைக்கவும்',
    footer: 'பதிவு குறியீடுகள் & மீட்டமைப்புகளுக்கு உங்கள் நிர்வாகியைத் தொடர்பு கொள்ளவும்',
    errInvalid: 'தவறான தகவல்கள். மீண்டும் முயற்சிக்கவும்.',
    errNetwork: 'நெட்வொர்க் பிழை. மீண்டும் முயற்சிக்கவும்.',
  },
};

fetch('/api/me').then(r => {
  if (r.ok) r.json().then(me => {
    window.location.replace(me.role === 'COMPUTER' ? '/entry.html' : '/');
  });
}).catch(() => {});

function roleRedirect(role) {
  window.location.replace(role === 'COMPUTER' ? '/entry.html' : '/');
}

let activeTab = 'pin';
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'email') || (i === 1 && tab === 'pin')));
  document.getElementById('emailForm').classList.toggle('active', tab === 'email');
  document.getElementById('pinForm').classList.toggle('active', tab === 'pin');
  document.getElementById('errMsg').classList.remove('show');
}

async function handleLogin(e, mode) {
  e.preventDefault();
  const err = document.getElementById('errMsg');
  const btn = document.getElementById(mode === 'email' ? 'emailBtn' : 'pinBtn');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = t('signInBtnBusy');

  const body = mode === 'email'
    ? { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }
    : { employee_id: document.getElementById('empId').value.trim(), pin: document.getElementById('pin').value };

  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      err.textContent = d.error || t('errInvalid');
      err.classList.add('show');
    } else {
      // Request notification permission during login tap (user gesture context)
      if ('Notification' in window && 'PushManager' in window && Notification.permission === 'default') {
        try { await Notification.requestPermission(); } catch {}
      }
      roleRedirect(d.role);
    }
  } catch {
    err.textContent = t('errNetwork');
    err.classList.add('show');
  }
  btn.disabled = false; btn.textContent = t('signInBtn');
}
</script>
<script src="/theme.js"></script>
<script src="/lang.js"></script>
</body>
</html>
