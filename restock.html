<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Restocking · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }

  /* ── Page tokens (dark default, light below) ── */
  :root {
    --need: #ff6b63; --ok: #3fcf6e; --warn: #f0b429;
    --gold-hi: #f6dd8b; --gold: #d4af37; --gold-lo: #a8822a;
    --surface: rgba(19, 25, 34, .78); --surface-2: #161d29; --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.12);
    --head-bg: #0f141d; --head-fg: #c9b77a; --row-alt: rgba(255,255,255,.018); --row-hover: rgba(212,175,55,.06);
    --glow: 0 0 0 1px var(--line), 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -18px rgba(0,0,0,.6);
    --ctrl-h: 40px; --r: 14px; --r-sm: 10px;
  }
  [data-theme="light"] {
    --need: #d6453c; --ok: #1f9d55; --warn: #b7791f;
    --gold-hi: #e8c869; --gold: #b8973a; --gold-lo: #8c6d1f;
    --surface: rgba(255,255,255,.92); --surface-2: #ffffff; --line: rgba(22,35,61,.08); --line-strong: rgba(22,35,61,.14);
    --head-bg: #f6f1e4; --head-fg: #7a5f17; --row-alt: rgba(22,35,61,.018); --row-hover: rgba(184,151,58,.08);
    --glow: 0 0 0 1px var(--line), 0 1px 2px rgba(22,35,61,.05), 0 14px 32px -16px rgba(22,35,61,.18);
  }
  body {
    background:
      radial-gradient(1100px 520px at 100% -10%, color-mix(in srgb, var(--gold) 9%, transparent), transparent 60%),
      radial-gradient(900px 480px at -10% 0%, color-mix(in srgb, #3d6be9 7%, transparent), transparent 60%),
      var(--bg);
  }

  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── Top bar ── */
  .topbar { min-height: calc(68px + env(safe-area-inset-top, 0px)); flex-shrink: 0; padding: env(safe-area-inset-top, 0px) 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); position: relative; }
  .topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gold) 55%, transparent), transparent); }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .title-wrap { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); }
  .page-title { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; letter-spacing: -.01em;
    background: linear-gradient(100deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .theme-btn, .back-btn { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px; width: var(--ctrl-h); height: var(--ctrl-h); display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .18s; flex-shrink: 0; text-decoration: none; font-size: 16px; }
  .theme-btn:hover, .back-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }

  .body { flex: 1; overflow-y: auto; padding: 24px 32px 48px; }
  .wrap { max-width: 1480px; margin: 0 auto; }

  /* ── Controls: one height everywhere so rows line up ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--ctrl-h); padding: 0 16px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-sm); font: 600 13px 'Inter', sans-serif; color: var(--text); cursor: pointer; transition: border-color .18s, color .18s, background .18s, transform .18s, box-shadow .18s; white-space: nowrap; text-decoration: none; }
  .btn svg { flex-shrink: 0; opacity: .85; }
  .btn:hover { border-color: color-mix(in srgb, var(--gold) 70%, transparent); color: var(--gold); transform: translateY(-1px); }
  .btn:active { transform: none; }
  .btn:disabled { opacity: .5; cursor: wait; transform: none; }
  .btn.primary { background: linear-gradient(135deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo)); border-color: transparent; color: #1a1408; box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--gold) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.primary:hover { color: #1a1408; filter: brightness(1.06); box-shadow: 0 12px 26px -10px color-mix(in srgb, var(--gold) 90%, transparent), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn.primary svg { opacity: 1; }
  .btn[hidden] { display: none; }
  .spacer { flex: 1; }
  select.inp, input.inp { height: var(--ctrl-h); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 12px; font: 500 13px 'Inter', sans-serif; color: var(--text); outline: none; transition: border-color .18s, box-shadow .18s; }
  select.inp:focus, input.inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }

  /* ── Counter tabs (KOLUSU / SL) ── */
  .ctabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .ctab { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 22px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px; font: 700 15px 'Inter', sans-serif; letter-spacing: .08em; color: var(--text-dim); cursor: pointer; transition: all .18s; }
  .ctab:hover { border-color: color-mix(in srgb, var(--gold) 70%, transparent); color: var(--gold); }
  .ctab.on { background: linear-gradient(135deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo)); border-color: transparent; color: #1a1408; box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--gold) 80%, transparent); }
  .ctab .ct-n { min-width: 26px; padding: 2px 8px; border-radius: 999px; font: 700 13px 'JetBrains Mono', monospace; letter-spacing: 0; background: color-mix(in srgb, var(--need) 16%, transparent); color: var(--need); }
  .ctab.on .ct-n { background: rgba(0,0,0,.18); color: #1a1408; }
  .ctab .ct-n.zero { background: var(--line); color: var(--text-dim); }
  .ctab.on .ct-n.zero { background: rgba(0,0,0,.12); color: #1a1408; }

  /* ── Hero: last import + import button ── */
  .hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 22px; margin-bottom: 14px; border-radius: var(--r);
    background: linear-gradient(120deg, color-mix(in srgb, var(--gold) 10%, var(--surface-2)), var(--surface-2) 55%); box-shadow: var(--glow); position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo)); }
  .stock-asof { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; }
  .stock-asof::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 6%, transparent); } }
  .stock-asof .li-lbl { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .12em; }
  .stock-asof .li-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .stock-asof .li-old { font-size: 12px; font-weight: 600; color: var(--warn); padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 13%, transparent); }

  /* ── Filter bar ── */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; margin-bottom: 14px; border-radius: var(--r); background: var(--surface); box-shadow: var(--glow); backdrop-filter: blur(8px); }
  .tb-sep { width: 1px; height: 24px; background: var(--line-strong); margin: 0 2px; }

  /* ── Multi-select dropdowns (toolbar + column filters) ── */
  .ms-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; height: var(--ctrl-h); min-width: 170px; max-width: 260px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 12px; font: 500 13px 'Inter', sans-serif; color: var(--text); cursor: pointer; text-align: left; transition: border-color .18s, background .18s; }
  .ms-btn .ms-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-btn .caret { font-size: 9px; opacity: .55; flex-shrink: 0; }
  .ms-btn:hover, .ms-btn.open { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
  .ms-btn.active { border-color: var(--gold); color: var(--gold); font-weight: 700; background: color-mix(in srgb, var(--gold) 9%, var(--surface-2)); }
  .clear-f[hidden] { display: none; }
  .clear-f { color: var(--need); border-color: color-mix(in srgb, var(--need) 45%, transparent); }
  .clear-f:hover { color: var(--need); border-color: var(--need); }
  .ms-pop { position: fixed; z-index: 1000; width: 310px; display: flex; flex-direction: column; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 24px 48px -12px rgba(0,0,0,.5); overflow: hidden; }
  .ms-pop .ms-q { margin: 10px 10px 8px; width: calc(100% - 20px); }
  .ms-acts { display: flex; gap: 6px; padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  .ms-acts button { flex: 1; height: 30px; background: none; border: 1px solid var(--line-strong); border-radius: 8px; font: 600 12px 'Inter', sans-serif; color: var(--text-dim); cursor: pointer; }
  .ms-acts button:hover { border-color: var(--gold); color: var(--gold); }
  .ms-list { overflow-y: auto; padding: 4px 0; }
  .ms-opt { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .ms-opt:hover { background: var(--row-hover); }
  .ms-opt input { accent-color: var(--gold); width: 15px; height: 15px; flex-shrink: 0; }
  .ms-opt .ms-lbl { min-width: 0; overflow-wrap: anywhere; }
  .ms-opt .ms-sub { display: block; font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .ms-opt .cnt { margin-left: auto; padding: 1px 8px; border-radius: 999px; background: var(--line); font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); }
  .ms-empty { padding: 14px; color: var(--text-dim); font-size: 13px; text-align: center; }

  .status { font-size: 13px; font-weight: 600; min-height: 18px; margin-bottom: 8px; }
  .status:empty { display: none; }
  .status.ok { color: var(--gold); }
  .status.err { color: var(--need); }

  /* ── Summary tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .tile { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r); padding: 16px 18px 14px; box-shadow: var(--glow); transition: transform .2s; }
  .tile:hover { transform: translateY(-2px); }
  .tile::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--tc, var(--gold)), transparent); opacity: .8; }
  .tile-lbl { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .12em; }
  .tile-val { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; line-height: 1.1; }
  .tile.need { --tc: var(--need); background: linear-gradient(140deg, color-mix(in srgb, var(--need) 12%, var(--surface-2)), var(--surface-2) 70%); }
  .tile.need .tile-val { color: var(--need); }
  .tile.short { --tc: var(--warn); }
  .tile.short .tile-val { color: var(--warn); }
  .tile.muted { --tc: var(--text-dim); }
  .tile.muted .tile-val { color: var(--text-dim); }

  /* ── Table ── */
  .tbl-wrap { overflow-x: auto; border-radius: var(--r); background: var(--surface-2); box-shadow: var(--glow); }
  table.rs { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 940px; }
  table.rs thead th { background: var(--head-bg); color: var(--head-fg); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 13px 14px; text-align: left; white-space: nowrap; user-select: none; border-bottom: 1px solid var(--line); }
  table.rs thead th[data-sort] { cursor: pointer; transition: color .15s, background .15s; }
  table.rs thead th[data-sort]:hover { color: var(--gold); background: color-mix(in srgb, var(--gold) 6%, var(--head-bg)); }
  table.rs thead th.on { color: var(--gold); }
  /* Column filter row (above the headings) */
  table.rs thead tr.colf th { background: var(--surface-2); padding: 10px 8px; text-transform: none; letter-spacing: 0; }
  .cf-btn { width: 100%; height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; font: 600 12px 'Inter', sans-serif; color: var(--text-dim); cursor: pointer; white-space: nowrap; transition: border-color .15s; }
  .cf-btn:hover, .cf-btn.open { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
  .cf-btn.active { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg)); }
  .cf-btn .cf-n { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11.5px; }
  /* Totals row (below the headings) */
  table.rs thead tr.tot th { background: color-mix(in srgb, var(--gold) 9%, var(--surface-2)); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; letter-spacing: -.01em; text-transform: none; padding: 12px 14px; border-bottom: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); }
  table.rs thead tr.tot th.tot-lbl { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--head-fg); text-transform: uppercase; letter-spacing: .12em; }
  table.rs thead tr.tot th.tot-need { color: var(--need); }
  .pname-row { display: flex; align-items: flex-start; gap: 6px; }
  .copy-btn { flex-shrink: 0; width: 26px; height: 26px; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 7px; color: var(--text-dim); cursor: pointer; margin-top: -3px; opacity: 0; transition: opacity .15s, color .15s, border-color .15s; }
  tr:hover .copy-btn, .copy-btn:focus-visible, .copy-btn.done { opacity: 1; }
  @media (hover: none) { .copy-btn { opacity: .7; } }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
  .copy-btn.done { color: var(--ok); border-color: var(--ok); }
  table.rs thead th .arr { margin-left: 6px; font-size: 9px; opacity: 0.45; }
  table.rs thead th.on .arr { opacity: 1; }
  table.rs th.num, table.rs td.num { text-align: right; }
  table.rs th.ctr, table.rs td.ctr { text-align: center; }
  table.rs td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; transition: background .12s; }
  table.rs tbody tr:nth-child(even) td { background: var(--row-alt); }
  table.rs tbody tr:hover td { background: var(--row-hover); }
  .grp-cell { color: var(--text-dim); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .pname { font-weight: 600; font-size: 13.5px; }
  .pcode { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .range { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .n { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }
  .need-big { display: inline-block; min-width: 40px; padding: 3px 10px; border-radius: 8px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--need); background: color-mix(in srgb, var(--need) 13%, transparent); }
  .need-ok { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: 15px; font-weight: 800; color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .over { color: var(--warn); }
  .stepper { display: inline-flex; align-items: center; height: 36px; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--bg); vertical-align: middle; }
  .stepper button { width: 34px; height: 100%; border: 0; background: none; color: var(--text-dim); font: 700 17px 'Inter', sans-serif; cursor: pointer; transition: background .15s, color .15s; }
  .stepper button:hover:not(:disabled) { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold); }
  .stepper button:disabled { opacity: .25; cursor: default; }
  .stepper .q { min-width: 40px; height: 100%; display: grid; place-items: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
  .stepper.saving .q { color: var(--gold); }

  /* Unfixed products (listed first) */
  tr.no-target td:first-child { box-shadow: inset 3px 0 0 var(--need); }
  tr.no-target td, tr.no-target .pname, tr.no-target .pcode, tr.no-target .grp-cell, tr.no-target .n { color: var(--need); }
  table.rs tbody tr.no-target td { background: color-mix(in srgb, var(--need) 6%, transparent); }
  table.rs tbody tr.no-target:hover td { background: color-mix(in srgb, var(--need) 10%, transparent); }
  tr.no-target .range { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .fix-btn, .skip-btn { height: 32px; padding: 0 14px; font-size: 12px; }
  .fix-btn { color: var(--need); border-color: color-mix(in srgb, var(--need) 55%, transparent); background: color-mix(in srgb, var(--need) 8%, var(--surface-2)); }
  .fix-btn:hover { color: #fff; background: var(--need); border-color: var(--need); }
  .skip-btn { color: var(--text-dim); margin-left: 6px; }
  /* Marked "Not needed": greyed, never in the Unfixed list */
  tr.skipped td:first-child { box-shadow: inset 3px 0 0 var(--line-strong); }
  tr.skipped td, tr.skipped .pname, tr.skipped .n { color: var(--text-dim); }
  tr.skipped .range { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; }
  .restore-btn { margin-left: 0; color: var(--gold); }
  /* Fix in progress: ranges detected from stock, editable until Save */
  tr.no-target.draft td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  table.rs tbody tr.no-target.draft td { background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .wt-inp { width: 90px; height: 36px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; font: 700 15px 'JetBrains Mono', monospace; color: var(--text); text-align: right; outline: none; transition: border-color .15s, box-shadow .15s; }
  .wt-inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
  .wt-inp.bad { border-color: var(--need); }
  .wt-inp.sz-inp { width: 80px; text-align: center; }
  .size { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .unfixed-tag { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); font: 700 10px 'Inter', sans-serif; letter-spacing: .1em; }
  .draft-acts { display: flex; gap: 6px; margin-top: 8px; }
  .draft-acts .btn { height: 32px; padding: 0 14px; font-size: 12px; }
  .draft-acts .btn.clear { color: var(--need); border-color: color-mix(in srgb, var(--need) 50%, transparent); }
  .rm-range { margin-left: 6px; width: 30px; height: 30px; background: none; border: 1px solid var(--line-strong); border-radius: 8px; color: var(--text-dim); cursor: pointer; vertical-align: middle; }
  .rm-range:hover { border-color: var(--need); color: var(--need); }
  tr.draft .n { color: var(--text); }

  /* ── Merge suppliers dialog ── */
  dialog.mg { width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px); margin: auto; background: var(--surface-2); color: var(--text); border: 1px solid var(--line-strong); border-radius: 18px; padding: 0; box-shadow: 0 40px 80px -20px rgba(0,0,0,.6); }
  dialog.mg[open] { animation: dlgIn .2s ease-out; }
  @keyframes dlgIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  dialog.mg::backdrop { background: rgba(5,8,12,.6); backdrop-filter: blur(3px); }
  .mg-inner { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
  .mg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); background: linear-gradient(120deg, color-mix(in srgb, var(--gold) 9%, transparent), transparent 60%); }
  .mg-head h2 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  /* Not .theme-btn — theme.js overwrites those with the sun/moon icon */
  .mg-x { width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text-dim); font-size: 15px; cursor: pointer; flex-shrink: 0; transition: all .15s; }
  .mg-x:hover { border-color: var(--need); color: var(--need); }
  /* Toasts sit under the modal, so results are shown inside it */
  .mg-msg { margin: 12px 20px 0; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .mg-msg.err { background: color-mix(in srgb, var(--need) 14%, transparent); color: var(--need); }
  .mg-msg[hidden] { display: none; }
  .mg-body { overflow-y: auto; padding: 16px 20px 20px; }
  .mg-sec { font-size: 11px; font-weight: 700; color: var(--head-fg); text-transform: uppercase; letter-spacing: .12em; margin: 2px 0 10px; }
  .mg-hint { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.55; }
  .mg-group { border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg); }
  .mg-main { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .mg-alias { display: inline-flex; align-items: center; gap: 6px; margin: 0 6px 6px 0; padding: 3px 4px 3px 11px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; color: var(--text-dim); background: var(--surface-2); }
  .mg-alias button { width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; color: var(--text-dim); cursor: pointer; }
  .mg-alias button:hover { background: color-mix(in srgb, var(--need) 18%, transparent); color: var(--need); }
  .mg-none { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .mg-new { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
  .mg-new select.inp, .mg-new input.inp { width: 100%; margin-bottom: 10px; }
  .mg-new .btn.primary { width: 100%; }
  .mg-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--line-strong); border-radius: 10px; margin-bottom: 12px; background: var(--bg); }
  .mg-list .ms-opt { border-bottom: 1px solid var(--line); }
  .mg-list .ms-opt:last-child { border-bottom: 0; }
  .mg-list [hidden] { display: none; }

  .placeholder { margin: 70px auto; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.7; max-width: 480px; }

  #printArea { display: none; }

  @media (max-width: 900px) {
    .topbar { padding: env(safe-area-inset-top, 0px) 16px 0; }
    .topbar .btn .lbl { display: none; }
    .topbar .btn { width: var(--ctrl-h); padding: 0; }
    .page-title { font-size: 20px; }
    .body { padding: 16px; }
    .hero { padding: 16px 18px; }
    .hero .btn.primary { width: 100%; }
    .stock-asof .li-val { font-size: 17px; }
    .toolbar .ms-btn { flex: 1 1 150px; max-width: none; min-width: 0; }
    .toolbar .btn:not(.clear-f) { flex: 1 1 auto; }
    .tb-sep, .spacer { display: none; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tile-val { font-size: 26px; }
    .ms-pop { width: calc(100vw - 32px); }
  }

  @media print {
    @page { margin: 12mm; }
    html, body { height: auto; overflow: visible; background: #fff; color: #000; }
    .main, #toast { display: none !important; }
    #printArea { display: block; font-family: 'Inter', sans-serif; color: #000; }
    #printArea h1 { font-size: 18px; margin-bottom: 2px; }
    #printArea .pa-sub { font-size: 11px; color: #444; margin-bottom: 12px; }
    #printArea table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #printArea th, #printArea td { border: 1px solid #999; padding: 5px 7px; text-align: left; }
    #printArea th { background: #eee; }
    #printArea td.num, #printArea th.num { text-align: right; }
    #printArea td.need { font-weight: 700; font-size: 14px; }
    #printArea tr { break-inside: avoid; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/restock-core.js"></script>
<script>
(function () {
  var C = window.RestockCore;
  var esc = C.esc, norm = C.norm, fmtG = C.fmtG, fmtInt = C.fmtInt, fmtWhen = C.fmtWhen, byNatural = C.byNatural, rangeLabel = C.rangeLabel;

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), statusEl = $('status');
  var groupBtn = $('groupSel'), productBtn = $('productSel'), targetBtn = $('targetSel'), supBtn = $('supSel');

  // All counters as loaded; stockGroups/targets/products are the selected counter's only
  var allGroups = [], allTargets = [], stockGroups = [], targets = [], products = {};
  var counter = 'KOLUSU', sized = false;
  try { var savedC = localStorage.getItem('restockCounter'); if (C.COUNTERS.indexOf(savedC) !== -1) counter = savedC; } catch (_) {}
  function counterOf(x) { return x.counter || 'KOLUSU'; }
  // Toolbar filters — every one is a multi-select; empty = all
  var fGroup = new Set(), fProduct = new Set(), fTarget = new Set(), fSup = new Set();
  var TARGET_OPTS = [['need', 'Needs stock'], ['full', 'Fully stocked'], ['over', 'Over stock'], ['none', 'Unfixed items'], ['skip', 'Not needed']];
  // Fix in progress (not saved yet): { [product]: [{ min_wt, max_wt, qty }] }
  var drafts = {};
  // Unfixed products marked "Not needed" — listed only under that Target choice
  var skipped = new Set();
  // Supplier merges: { [supplier name in the Tagging file]: name it counts as }
  var supplierMerge = {};

  // Table columns. val = what the column filter matches on; num = numeric sort key
  // Blank cell value: '' for a product with no target, SKIP_V for one marked "Not needed"
  var SKIP_V = 'Not needed';
  function blank(o) { return o.skip ? SKIP_V : ''; }
  function blankLabel(v) { return v === '' ? 'No target' : v; }
  function numVal(v) { return v === '' ? -1 : v === SKIP_V ? -2 : parseFloat(String(v).replace(/,/g, '')); }
  // SL (sized counters) only: Product Size column after the name
  var NO_SIZE = '(no size)';
  var SIZE_COL = { k: 'size', label: 'Size', val: function (o) { return o.none ? blank(o) : o.r.size || NO_SIZE; } };
  var ALL_COLS = [
    { k: 'group', label: 'Product Group', val: function (o) { return o.p.group; } },
    { k: 'product', label: 'Product Name', val: function (o) { return o.p.key; } },
    SIZE_COL,
    { k: 'from', label: 'From (g)', cls: 'num', val: function (o) { return o.none ? blank(o) : fmtG(o.r.min_wt); }, num: function (o) { return o.none ? -1 : o.r.min_wt; } },
    { k: 'to', label: 'To (g)', cls: 'num', val: function (o) { return o.none ? blank(o) : fmtG(o.r.max_wt); }, num: function (o) { return o.none ? -1 : o.r.max_wt; } },
    { k: 'target', label: 'Target', cls: 'ctr', val: function (o) { return o.none ? blank(o) : String(o.r.qty); }, num: function (o) { return o.none ? -1 : o.r.qty; } },
    { k: 'have', label: 'Availability', cls: 'num', val: function (o) { return String(o.have); }, num: function (o) { return o.have; } },
    { k: 'need', label: 'Need', cls: 'num', val: function (o) { return o.none ? blank(o) : String(o.need); }, num: function (o) { return o.none ? -1 : o.need; } }
  ];
  var COLS, COL, colF;
  function setCols() {
    COLS = ALL_COLS.filter(function (c) { return c !== SIZE_COL || sized; });
    COL = {}; colF = {};
    COLS.forEach(function (c) { COL[c.k] = c; colF[c.k] = new Set(); });
  }
  function colIndex(k) { return COLS.findIndex(function (c) { return c.k === k; }); }

  // Default order (always on page open): biggest Need first, then lowest Availability
  var DEFAULT_SORT = { col: 'need', dir: 'desc' };
  var sortBy = DEFAULT_SORT;

  function setStatus(msg, ok) { statusEl.textContent = msg || ''; statusEl.className = 'status ' + (ok ? 'ok' : 'err'); }
  function toast(msg, type) {
    if (typeof window.toast === 'function') return window.toast(msg, type || 'success');
    setStatus(msg, type !== 'error');
  }
  function codesOf(p) { return Object.keys(p.printNames).sort(byNatural).join(', '); }

  // ── Rows: one per target weight range ──
  function stateOf(o) { return o.have < o.r.qty ? 'need' : o.have === o.r.qty ? 'full' : 'over'; }
  // Products with nothing in stock have no supplier in the file → the "No supplier" filter
  var NO_SUP = '__none__';
  function hasSupplier(p) { for (var s in p.suppliers) return true; return false; }
  function inGroup(p) { return !fGroup.size || fGroup.has(p.group); }
  function inSup(p) {
    if (!fSup.size) return true;
    if (fSup.has(NO_SUP) && !hasSupplier(p)) return true;
    for (var s in p.suppliers) if (fSup.has(s)) return true;
    return false;
  }
  function inScope(p) { return inGroup(p) && inSup(p) && (!fProduct.size || fProduct.has(p.key)); }
  // Rows after the toolbar filters (products with no target range included as `none` rows)
  function baseRows() {
    var out = [], wantNone = !fTarget.size || fTarget.has('none');
    Object.keys(products).forEach(function (k) {
      var p = products[k];
      if (!inScope(p)) return;
      if (!p.ranges.length) {
        if (skipped.has(p.key)) {
          if (fTarget.has('skip')) out.push({ p: p, r: null, have: p.stock.length, need: 0, none: true, skip: true });
          return;
        }
        if (!wantNone) return;
        var d = drafts[p.key];
        if (!d) { out.push({ p: p, r: null, have: p.stock.length, need: 0, none: true }); return; }
        // Being fixed: one row per detected range (still unfixed, so not counted in the totals)
        var hv = draftHave(p, d);
        d.forEach(function (r, i) { out.push({ p: p, r: null, dr: r, di: i, have: hv[i], need: 0, none: true }); });
        return;
      }
      p.rangeStats.forEach(function (x) {
        var o = { p: p, r: x.r, have: x.have, need: x.need };
        if (!fTarget.size || fTarget.has(stateOf(o))) out.push(o);
      });
    });
    return out;
  }
  // In-stock pieces per draft range (each piece fills the first range its weight falls in)
  function draftHave(p, d) {
    var have = d.map(function () { return 0; });
    p.stock.forEach(function (s) {
      var i = d.findIndex(function (r) { return C.fits(p, s, r); });
      if (i !== -1) have[i]++;
    });
    return have;
  }
  // One row per product for print/export (a product being fixed is still one unfixed row)
  function outRows() {
    return visibleRows().filter(function (o) { return !o.di; }).map(function (o) {
      return o.dr ? { p: o.p, r: null, have: o.p.stock.length, need: 0, none: true } : o;
    });
  }
  // Column filters; `skip` leaves one column out (to list that column's own choices)
  function passCols(o, skip) {
    for (var k in colF) if (k !== skip && colF[k].size && !colF[k].has(COL[k].val(o))) return false;
    return true;
  }
  function byDefault(a, b) {
    return b.need - a.need || a.have - b.have || byNatural(a.p.group, b.p.group) || byNatural(a.p.key, b.p.key) ||
      byNatural(String(a.r.size || ''), String(b.r.size || '')) || a.r.min_wt - b.r.min_wt;
  }
  // Products with no target range are always listed first, in red
  function visibleRows(base) {
    var rows = (base || baseRows()).filter(function (o) { return passCols(o); });
    var none = rows.filter(function (o) { return o.none; })
      .sort(function (a, b) { return byNatural(a.p.group, b.p.group) || byNatural(a.p.key, b.p.key) || (a.di || 0) - (b.di || 0); });
    var out = rows.filter(function (o) { return !o.none; });
    var dir = sortBy.dir === 'asc' ? 1 : -1, c = COL[sortBy.col];
    out.sort(c.num ? function (a, b) { return (c.num(a) - c.num(b)) * dir || byDefault(a, b); }
                   : function (a, b) { return byNatural(c.val(a), c.val(b)) * dir || byDefault(a, b); });
    return none.concat(out);
  }
  function anyFilter() {
    return fGroup.size || fProduct.size || fTarget.size || fSup.size || COLS.some(function (c) { return colF[c.k].size; });
  }

  // ── Multi-select dropdown with type-to-filter ──
  // cfg: { sel: Set, options: () => [{ v, label, sub?, n? }], onChange, col? }
  var pop = null;
  function closePicker() {
    if (!pop) return;
    pop.el.remove();
    pop.anchor.classList.remove('open');
    pop = null;
  }
  function placePicker() {
    var r = pop.anchor.getBoundingClientRect(), el = pop.el, w = el.offsetWidth;
    var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
    var below = window.innerHeight - r.bottom - 12, above = r.top - 12;
    el.style.left = left + 'px';
    if (below >= 260 || below >= above) { el.style.top = (r.bottom + 4) + 'px'; el.style.bottom = ''; el.style.maxHeight = Math.min(400, below) + 'px'; }
    else { el.style.top = ''; el.style.bottom = (window.innerHeight - r.top + 4) + 'px'; el.style.maxHeight = Math.min(400, above) + 'px'; }
  }
  function openPicker(anchor, cfg) {
    if (pop && pop.anchor === anchor) return closePicker();
    closePicker();
    var el = document.createElement('div');
    el.className = 'ms-pop';
    el.innerHTML = '<input class="inp ms-q" type="search" placeholder="Type to filter…" autocomplete="off" />' +
      '<div class="ms-acts"><button type="button" data-act="all">Select shown</button><button type="button" data-act="clear">Clear</button></div>' +
      '<div class="ms-list"></div>';
    document.body.appendChild(el);
    pop = { el: el, anchor: anchor, cfg: cfg };
    anchor.classList.add('open');
    var q = el.querySelector('.ms-q'), list = el.querySelector('.ms-list'), opts = cfg.options(), shown = [];
    function draw() {
      var s = norm(q.value);
      shown = opts.filter(function (o) { return !s || norm(o.label + ' ' + (o.sub || '')).indexOf(s) !== -1; });
      list.innerHTML = shown.length ? shown.map(function (o, i) {
        return '<label class="ms-opt"><input type="checkbox" data-i="' + i + '"' + (cfg.sel.has(o.v) ? ' checked' : '') + ' />' +
          '<span class="ms-lbl">' + esc(o.label) + (o.sub ? '<span class="ms-sub">' + esc(o.sub) + '</span>' : '') + '</span>' +
          (o.n != null ? '<span class="cnt">' + fmtInt(o.n) + '</span>' : '') + '</label>';
      }).join('') : '<div class="ms-empty">No matches</div>';
    }
    draw();
    placePicker();
    q.addEventListener('input', draw);
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); shown.forEach(function (o) { cfg.sel.add(o.v); }); draw(); cfg.onChange(); }
    });
    list.addEventListener('change', function (e) {
      var o = shown[Number(e.target.dataset.i)];
      if (!o) return;
      if (e.target.checked) cfg.sel.add(o.v); else cfg.sel.delete(o.v);
      cfg.onChange();
    });
    el.querySelector('.ms-acts').addEventListener('click', function (e) {
      var act = e.target.dataset.act;
      if (!act) return;
      if (act === 'all') shown.forEach(function (o) { cfg.sel.add(o.v); });
      else cfg.sel.clear();
      draw();
      cfg.onChange();
    });
    if (window.matchMedia('(hover: hover)').matches) q.focus();
  }
  document.addEventListener('mousedown', function (e) {
    if (pop && !pop.el.contains(e.target) && !pop.anchor.contains(e.target)) closePicker();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePicker(); });
  document.addEventListener('scroll', function (e) { if (pop && !pop.el.contains(e.target)) closePicker(); }, true);
  window.addEventListener('resize', function () { if (pop) placePicker(); });

  // ── Toolbar filters ──
  function groupOptions() {
    var count = {};
    Object.keys(products).forEach(function (k) { var g = products[k].group; count[g] = (count[g] || 0) + 1; });
    return Object.keys(count).sort(byNatural).map(function (g) { return { v: g, label: g, n: count[g] }; });
  }
  // Supplier and product lists follow the chosen groups
  function supplierOptions() {
    var count = {}, noSup = 0;
    Object.keys(products).forEach(function (k) {
      var p = products[k];
      if (!inGroup(p)) return;
      if (!hasSupplier(p)) noSup++;
      Object.keys(p.suppliers).forEach(function (s) { count[s] = (count[s] || 0) + 1; });
    });
    var out = Object.keys(count).sort(byNatural).map(function (s) { return { v: s, label: s, n: count[s] }; });
    if (noSup) out.push({ v: NO_SUP, label: 'No supplier', n: noSup });
    return out;
  }
  function productOptions() {
    return Object.keys(products).map(function (k) { return products[k]; })
      .filter(function (p) { return inGroup(p) && inSup(p); })
      .sort(function (a, b) { return byNatural(a.key, b.key); })

      await C.api('/api/restock/product-targets', C.jsonOpts('PUT', { group_name: p.group, product: p.key, counter: p.counter, ranges: ranges }));
      delete drafts[key];
      toast('Target fixed: ' + p.key + ' — ' + ranges.length + (ranges.length === 1 ? ' range' : ' ranges'));
      await load();
    } catch (err) {
      btn.disabled = false;
      toast('Could not save: ' + err.message, 'error');
    }
  }

  async function setSkipped(key, on, btn) {
    btn.disabled = true;
    try {
      if (on) await C.api('/api/restock/skip', C.jsonOpts('POST', { product: key }));
      else await C.api('/api/restock/skip?product=' + encodeURIComponent(key), { method: 'DELETE' });
      if (on) skipped.add(key); else skipped.delete(key);
      toast((on ? 'Marked Not needed: ' : 'Moved back to Unfixed: ') + key);
      render();
    } catch (err) {
      btn.disabled = false;
      toast('Could not save: ' + err.message, 'error');
    }
  }

  async function saveQty(id) {
    var t = targets.find(function (x) { return x.id === id; }), pd = pending[id];
    delete pending[id];
    if (!t || !pd || pd.from === t.qty) return;
    var tr = listEl.querySelector('tr[data-id="' + id + '"]'), stp = tr && tr.querySelector('.stepper');
    if (stp) stp.classList.add('saving');
    try {
      await C.api('/api/restock/targets/' + id, C.jsonOpts('PUT', { group_name: t.group_name, product: t.product, min_wt: t.min_wt, max_wt: t.max_wt, qty: t.qty, counter: t.counter, size: t.size }));
      toast('Target saved: ' + t.product + ' ' + rangeLabel(t) + ' → ' + t.qty);
    } catch (err) {
      t.qty = pd.from;
      toast('Could not save target: ' + err.message, 'error');
    }
    tr = listEl.querySelector('tr[data-id="' + id + '"]');
    if (tr) { refreshRow(tr, t); var s2 = tr.querySelector('.stepper'); if (s2) s2.classList.remove('saving'); }
  }

  // Update one row in place (keeps scroll; the row stays even if it no longer matches the Target filter until the next filter change)
  function refreshRow(tr, t) {
    var p = products[t.product];
    C.compute(p);
    var x = p.rangeStats.find(function (s) { return s.r === t; });
    var tmp = document.createElement('tbody');
    tmp.innerHTML = rowHtml({ p: p, r: t, have: x.have, need: x.need });
    var nr = tmp.firstChild;
    if (pending[t.id]) nr.querySelector('.stepper').classList.add('saving');
    tr.replaceWith(nr);
    var rows = visibleRows(), tot = listEl.querySelector('tr.tot');
    counterNeed[counter] = Object.keys(products).reduce(function (s, k) { return s + products[k].need; }, 0);
    renderTabs();
    renderTiles(rows);
    if (tot) tot.outerHTML = totalsHtml(rows);
  }

  // ── Import today's stock ──
  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', async function () {
    var file = this.files[0];
    this.value = '';
    if (!file) return;
    var btn = $('importBtn');
    btn.disabled = true;
    try {
      var res = await C.importTagging(file, setStatus);
      if (res) {
        // Open a counter that was in the file, then show the products that still have no target fixed
        if (res.counters.indexOf(counter) === -1) setCounter(res.counters[0]);
        fTarget.clear();
        fTarget.add('none');
        await load();
      }
    } finally { btn.disabled = false; }
  });

  // ── Print + Excel (the rows shown) ──
  $('printBtn').addEventListener('click', function () {
    var rows = outRows();
    if (!rows.length) return toast('Nothing to print for the current filter.', 'error');
    var t = sums(rows);
    var nNone = rows.filter(function (o) { return o.none && !o.skip; }).length, nSkip = rows.filter(function (o) { return o.skip; }).length;
    var sz = function (o) { return sized ? '<td>' + (o.none ? '' : esc(o.r.size || NO_SIZE)) + '</td>' : ''; };
    var html = '<h1>Restocking · ' + esc(counter) + ' counter</h1><div class="pa-sub">' + esc(filterLabel()) + ' · ' +
      esc(new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })) +
      ' · ' + (rows.length - nNone - nSkip) + ' ranges · Need: <b>' + t.need + ' pcs</b>' + (nNone ? ' · <span style="color:#c00000">' + nNone + ' with no target fixed</span>' : '') +
      (nSkip ? ' · ' + nSkip + ' not needed' : '') + '</div>' +
      '<table><thead><tr><th>Product Group</th><th>Product Name</th>' + (sized ? '<th>Size</th>' : '') + '<th class="num">From (g)</th><th class="num">To (g)</th><th class="num">Target</th><th class="num">Availability</th><th class="num">Need</th></tr>' +
      '<tr style="font-weight:700"><td>Total</td><td>' + rows.length + ' rows</td>' + (sized ? '<td></td>' : '') + '<td class="num">' + fmtG(t.from) + '</td><td class="num">' + fmtG(t.to) + '</td>' +
      '<td class="num">' + t.target + '</td><td class="num">' + t.have + '</td><td class="num need">' + t.need + '</td></tr></thead><tbody>' +
      rows.map(function (o) {
        if (o.none) return '<tr style="color:' + (o.skip ? '#666' : '#c00000') + ';font-weight:600"><td>' + esc(o.p.group) + '</td><td>' + esc(o.p.key) + '</td><td colspan="' + blankSpan() + '">' + (o.skip ? 'Not needed' : 'No target fixed') + '</td>' +
          '<td class="num"></td><td class="num">' + o.have + '</td><td class="num"></td></tr>';
        return '<tr><td>' + esc(o.p.group) + '</td><td>' + esc(o.p.key) + '</td>' + sz(o) + '<td class="num">' + fmtG(o.r.min_wt) + '</td><td class="num">' + fmtG(o.r.max_wt) + '</td>' +
          '<td class="num">' + o.r.qty + '</td><td class="num">' + o.have + '</td><td class="num need">' + (o.need || '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    $('printArea').innerHTML = html;
    window.print();
  });

  // ExcelJS (real Excel Tables) is loaded only when exporting
  var excelJsReady = null;
  function loadExcelJs() {
    return excelJsReady || (excelJsReady = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = function () { resolve(window.ExcelJS); };
      s.onerror = function () { excelJsReady = null; reject(new Error('Could not load the Excel library — check the internet connection.')); };
      document.head.appendChild(s);
    }));
  }

  $('exportBtn').addEventListener('click', async function () {
    var rows = outRows();
    if (!rows.length) return toast('Nothing to export for the current filter.', 'error');
    var btn = this;
    btn.disabled = true;
    try {
      var ExcelJS = await loadExcelJs();
      // One sheet per supplier. A product goes under the supplier it was last tagged from
      // (or one of the chosen suppliers when the Supplier filter is set), so each piece is ordered once.
      var bySup = {};
      rows.forEach(function (o) {
        var s = o.p.lastSupplier;
        if (fSup.size && !fSup.has(s)) s = Object.keys(o.p.suppliers).sort(byNatural).find(function (x) { return fSup.has(x); }) || '';
        s = s || 'No supplier';
        (bySup[s] = bySup[s] || []).push(o);
      });
      var wb = new ExcelJS.Workbook(), used = {};
      wb.creator = 'APPACHI Restocking';
      Object.keys(bySup).sort(byNatural).forEach(function (s, si) {
        var list = bySup[s], need = list.reduce(function (t, o) { return t + o.need; }, 0);
        var nNone = list.filter(function (o) { return o.none && !o.skip; }).length, nSkip = list.filter(function (o) { return o.skip; }).length;
        // Excel sheet names: max 31 chars, no : \ / ? * [ ], unique
        var base = s.replace(/[:\\\/?*\[\]]/g, ' ').trim().slice(0, 31) || 'Supplier', name = base, n = 2;
        while (used[name.toLowerCase()]) { var sfx = ' (' + n++ + ')'; name = base.slice(0, 31 - sfx.length) + sfx; }
        used[name.toLowerCase()] = 1;

        var ws = wb.addWorksheet(name, {
          views: [{ state: 'frozen', ySplit: 3 }],
          pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '3:3' }
        });
        ws.columns = (sized ? [16, 48, 16, 10, 10, 10, 9, 13, 9] : [16, 48, 16, 10, 10, 9, 13, 9]).map(function (w) { return { width: w }; });
        ws.getCell('A1').value = s + ' · ' + counter + ' counter';
        ws.getCell('A1').font = { bold: true, size: 14 };
        ws.getCell('A2').value = (list.length - nNone - nSkip) + ' ranges · Need ' + need + ' pcs' + (nNone ? ' · ' + nNone + ' with no target fixed (red)' : '') +
          (nSkip ? ' · ' + nSkip + ' not needed (grey)' : '') + ' · Stock as of ' + lastImportText();
        ws.getCell('A2').font = { italic: true, color: { argb: 'FF555555' } };

        ws.addTable({
          name: 'Restock' + (si + 1),
          ref: 'A3',
          headerRow: true,
          totalsRow: true,
          style: { theme: 'TableStyleMedium2', showRowStripes: true },
          columns: [
            { name: 'Product Group', totalsRowLabel: 'Total', filterButton: true },
            { name: 'Product Name', filterButton: true },
            { name: 'Code', filterButton: true }
          ].concat(sized ? [{ name: 'Size', filterButton: true }] : [], [
            { name: 'From (g)', filterButton: true },
            { name: 'To (g)', filterButton: true },
            { name: 'Target', totalsRowFunction: 'sum', filterButton: true },
            { name: 'Availability', totalsRowFunction: 'sum', filterButton: true },
            { name: 'Need', totalsRowFunction: 'sum', filterButton: true }
          ]),
          rows: list.map(function (o) {
            var head = [o.p.group, o.p.key, Object.keys(o.p.printNames).join(', ')];
            if (o.none) return head.concat(sized ? [null] : [], [o.skip ? 'Not needed' : 'No target fixed', null, null, o.have, null]);
            return head.concat(sized ? [o.r.size || NO_SIZE] : [], [o.r.min_wt, o.r.max_wt, o.r.qty, o.have, o.need]);
          })
        });
        // No-target products (listed first) in bold red, "Not needed" ones in grey
        list.forEach(function (o, i) {
          if (!o.none) return;
          var font = o.skip ? { color: { argb: 'FF808080' } } : { bold: true, color: { argb: 'FFC00000' } };
          ws.getRow(4 + i).eachCell({ includeEmpty: true }, function (cell) { cell.font = font; });
        });
        // Need column bold red when something must be ordered
        var last = 3 + list.length, numCols = sized ? ['E', 'F', 'G', 'H', 'I'] : ['D', 'E', 'F', 'G', 'H'], needCol = numCols[4];
        ws.addConditionalFormatting({
          ref: needCol + '4:' + needCol + last,
          rules: [{ type: 'cellIs', operator: 'greaterThan', formulae: [0], priority: 1,
                    style: { font: { bold: true, color: { argb: 'FFC00000' } } } }]
        });
        for (var r = 4; r <= last + 1; r++) {
          numCols.forEach(function (c) { ws.getCell(c + r).alignment = { horizontal: 'right' }; });
          if (sized) ws.getCell('D' + r).alignment = { horizontal: 'center' };
        }
        ws.getRow(last + 1).font = { bold: true };
      });

      var buf = await wb.xlsx.writeBuffer();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      a.download = 'Restocking-' + counter + '-' + (fGroup.size === 1 ? Array.from(fGroup)[0].replace(/[^\w.-]+/g, '_') + '-' : '') + C.dateStamp() + '.xlsx';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (err) {
      toast('Export failed: ' + err.message, 'error');
    } finally { btn.disabled = false; }
  });

  // ── Merge suppliers ──
  var mergeDlg = $('mergeDlg'), mergeBody = $('mergeBody'), mgMain = '', mgPick = new Set(), mgQ = '';
  // Every supplier name as written in the uploaded Tagging files (all counters), with its piece count
  function rawSuppliers() {
    var cnt = {};
    allGroups.forEach(function (g) {
      g.items.forEach(function (it) { var s = it[8]; if (s) cnt[s] = (cnt[s] || 0) + (it[3] || 1); });
    });
    return cnt;
  }
  function drawMerge() {
    var cnt = rawSuppliers(), byMain = {};
    Object.keys(supplierMerge).forEach(function (a) { (byMain[supplierMerge[a]] = byMain[supplierMerge[a]] || []).push(a); });
    var mains = Object.keys(byMain).sort(byNatural);
    // Names you can keep: anything not already merged into another name
    var keepable = Object.keys(cnt).concat(mains).filter(function (s, i, arr) { return arr.indexOf(s) === i && !supplierMerge[s]; }).sort(byNatural);
    if (mgMain && keepable.indexOf(mgMain) === -1) mgMain = '';
    var others = Object.keys(cnt).filter(function (s) { return s !== mgMain && !supplierMerge[s]; }).sort(byNatural);
    var total = function (m) { return (cnt[m] || 0) + byMain[m].reduce(function (t, a) { return t + (cnt[a] || 0); }, 0); };

    mergeBody.innerHTML =
      '<div class="mg-sec">Merged suppliers</div>' +
      (mains.length ? mains.map(function (m) {
        return '<div class="mg-group"><div class="mg-main">' + esc(m) + ' <span class="pcode">' + fmtInt(total(m)) + ' pcs</span></div>' +
          byMain[m].sort(byNatural).map(function (a) {
            return '<span class="mg-alias">' + esc(a) + '<button type="button" data-unmerge="' + esc(a) + '" title="Un-merge ' + esc(a) + '" aria-label="Un-merge">✕</button></span>';
          }).join('') + '</div>';
      }).join('') : '<div class="mg-none">No suppliers merged yet.</div>') +
      '<div class="mg-new"><div class="mg-sec">New merge</div>' +
      '<div class="mg-hint">The names you tick are shown as the name you keep — in the Supplier filter, the totals and the Excel export (one sheet per supplier). Stock uploaded later follows the same merge.</div>' +
      '<select class="inp" id="mgMain"><option value="">1. Keep this supplier name…</option>' +
        keepable.map(function (s) { return '<option value="' + esc(s) + '"' + (s === mgMain ? ' selected' : '') + '>' + esc(s) + (cnt[s] ? ' (' + fmtInt(cnt[s]) + ')' : '') + '</option>'; }).join('') + '</select>' +
      (mgMain
        ? '<input class="inp" id="mgQ" type="search" placeholder="2. Find the names to merge into it…" autocomplete="off" value="' + esc(mgQ) + '" />' +
          '<div class="mg-list">' + others.map(function (s) {
            return '<label class="ms-opt" data-name="' + esc(norm(s)) + '"><input type="checkbox" data-mg="' + esc(s) + '"' + (mgPick.has(s) ? ' checked' : '') + ' /><span class="ms-lbl">' + esc(s) + '</span><span class="cnt">' + fmtInt(cnt[s]) + '</span></label>';
          }).join('') + '<div class="ms-empty" id="mgEmpty"' + (others.length ? ' hidden' : '') + '>' + (others.length ? 'No matches' : 'No other suppliers to merge') + '</div></div>' +
          '<button type="button" class="btn primary" id="mgDo"' + (mgPick.size ? '' : ' disabled') + '>Merge ' + (mgPick.size || '') + ' into ' + esc(mgMain) + '</button>'
        : '') + '</div>';
    filterMerge();
  }
  // Search hides rows in place (re-drawing on every key would lose the cursor/typing)
  function filterMerge() {
    var q = norm(mgQ), n = 0, empty = $('mgEmpty');
    mergeBody.querySelectorAll('.mg-list .ms-opt').forEach(function (el) {
      var on = !q || el.dataset.name.indexOf(q) !== -1;
      el.hidden = !on;
      if (on) n++;
    });
    if (empty && mergeBody.querySelector('.mg-list .ms-opt')) empty.hidden = n > 0;
  }
  function mergeMsg(text, err) {
    var m = $('mergeMsg');
    m.textContent = text || '';
    m.className = 'mg-msg' + (err ? ' err' : '');
    m.hidden = !text;
  }
  $('mergeBtn').addEventListener('click', function () {
    closePicker();
    mgMain = ''; mgPick.clear(); mgQ = '';
    mergeMsg('');
    drawMerge();
    mergeDlg.showModal();
  });
  $('mergeClose').addEventListener('click', function () { mergeDlg.close(); });
  // Click on the dark backdrop closes too
  mergeDlg.addEventListener('click', function (e) { if (e.target === mergeDlg) mergeDlg.close(); });
  mergeBody.addEventListener('change', function (e) {
    if (e.target.id === 'mgMain') { mgMain = e.target.value; mgPick.clear(); mgQ = ''; mergeMsg(''); drawMerge(); return; }
    var s = e.target.dataset.mg;
    if (s == null) return;
    if (e.target.checked) mgPick.add(s); else mgPick.delete(s);
    var b = $('mgDo');
    b.disabled = !mgPick.size;
    b.textContent = 'Merge ' + (mgPick.size || '') + ' into ' + mgMain;
  });
  mergeBody.addEventListener('input', function (e) {
    if (e.target.id !== 'mgQ') return;
    mgQ = e.target.value;
    filterMerge();
  });
  mergeBody.addEventListener('click', async function (e) {
    var un = e.target.closest('button[data-unmerge]'), go = e.target.closest('#mgDo');
    if (!un && !go) return;
    (un || go).disabled = true;
    try {
      if (un) {
        await C.api('/api/restock/supplier-merge?alias=' + encodeURIComponent(un.dataset.unmerge), { method: 'DELETE' });
        var msg = 'Un-merged: ' + un.dataset.unmerge;
      } else {
        var n = mgPick.size;
        await C.api('/api/restock/supplier-merge', C.jsonOpts('POST', { main: mgMain, aliases: Array.from(mgPick) }));
        msg = 'Merged ' + n + (n === 1 ? ' supplier' : ' suppliers') + ' into ' + mgMain;
        mgPick.clear(); mgQ = '';
      }
      fSup.clear();
      await load();
      drawMerge();
      mergeMsg(msg + ' ✓');
    } catch (err) {
      (un || go).disabled = false;
      mergeMsg('Could not save: ' + err.message, true);
    }
  });

  // ── Load ──
  async function load() {
    var body = document.querySelector('.body'), top = body.scrollTop;
    try {
      var d = await C.api('/api/restock');
      allGroups = d.groups; allTargets = d.targets; skipped = new Set(d.skipped || []); supplierMerge = d.supplierMerge || {};
    } catch (err) {
      listEl.innerHTML = '<div class="placeholder">Could not load: ' + esc(err.message) + '</div>';
      return;
    }
    // Pieces to order per counter, for the tab badges
    C.COUNTERS.forEach(function (c) {
      if (c === counter) return;
      var ps = C.build(allGroups.filter(function (g) { return counterOf(g) === c; }), allTargets.filter(function (t) { return counterOf(t) === c; }), supplierMerge);
      counterNeed[c] = Object.keys(ps).reduce(function (s, k) { return s + ps[k].need; }, 0);
    });
    buildCounter();
    body.scrollTop = top;
  }
  // The selected counter's stock + targets → products. Targets are fixed; new products stay without a target (red) until fixed.
  function buildCounter() {
    stockGroups = allGroups.filter(function (g) { return counterOf(g) === counter; });
    targets = allTargets.filter(function (t) { return counterOf(t) === counter; });
    products = C.build(stockGroups, targets, supplierMerge);
    counterNeed[counter] = Object.keys(products).reduce(function (s, k) { return s + products[k].need; }, 0);
    pruneScoped();
    render();
  }

  // ── Counter tabs ── switching clears the filters, sort and unsaved Fix drafts
  function setCounter(c) {
    counter = c;
    sized = C.isSized(c);
    try { localStorage.setItem('restockCounter', c); } catch (_) {}
    setCols();
    [fGroup, fProduct, fTarget, fSup].forEach(function (s) { s.clear(); });
    sortBy = DEFAULT_SORT;
    drafts = {};
    closePicker();
  }
  $('ctabs').addEventListener('click', function (e) {
    var b = e.target.closest('.ctab');
    if (!b || b.dataset.counter === counter) return;
    setCounter(b.dataset.counter);
    buildCounter();
    document.querySelector('.body').scrollTop = 0;
  });

  setCounter(counter);
  load();
})();
</script>

<script src="/pwa.js" defer></script>
<script src="/push-native.js" defer></script>
<script src="/auth.js"></script>
<script src="/theme.js"></script>
<script src="/notify.js"></script>
</body>
</html>
