<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Restocking · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  :root { --grp-head: #3d9be9; --need: #e5534b; --ok: #3fb950; --warn: #d29922; }

  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { min-height: calc(64px + env(safe-area-inset-top, 0px)); height: auto; flex-shrink: 0; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top, 0px) 28px 0; display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .page-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .theme-btn, .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .15s; flex-shrink: 0; text-decoration: none; }
  .theme-btn:hover, .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }

  .body { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }

  /* ── Toolbar ── */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font: 600 13px 'Inter', sans-serif; color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  .btn.primary:hover { filter: brightness(1.08); color: #111; }
  .spacer { flex: 1; }
  select.inp, input.inp { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: 500 13px 'Inter', sans-serif; color: var(--text); outline: none; }
  select.inp:focus, input.inp:focus { border-color: var(--accent); }

  /* ── Multi-select dropdowns (toolbar + column filters) ── */
  .ms-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 150px; max-width: 260px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: 500 13px 'Inter', sans-serif; color: var(--text); cursor: pointer; text-align: left; }
  .ms-btn .ms-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-btn .caret { font-size: 10px; opacity: .6; flex-shrink: 0; }
  .ms-btn:hover, .ms-btn.open { border-color: var(--accent); }
  .ms-btn.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .clear-f[hidden] { display: none; }
  .clear-f { color: var(--need); border-color: color-mix(in srgb, var(--need) 50%, var(--border)); }
  .ms-pop { position: fixed; z-index: 1000; width: 300px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.35); overflow: hidden; }
  .ms-pop .ms-q { margin: 8px 8px 6px; width: calc(100% - 16px); }
  .ms-acts { display: flex; gap: 6px; padding: 0 8px 6px; border-bottom: 1px solid var(--border); }
  .ms-acts button { flex: 1; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px; font: 600 12px 'Inter', sans-serif; color: var(--text-dim); cursor: pointer; }
  .ms-acts button:hover { border-color: var(--accent); color: var(--accent); }
  .ms-list { overflow-y: auto; padding: 4px 0; }
  .ms-opt { display: flex; align-items: center; gap: 9px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .ms-opt:hover { background: var(--panel-elev); }
  .ms-opt input { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
  .ms-opt .ms-lbl { min-width: 0; overflow-wrap: anywhere; }
  .ms-opt .ms-sub { display: block; font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .ms-opt .cnt { margin-left: auto; padding-left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); }
  .ms-empty { padding: 12px; color: var(--text-dim); font-size: 13px; text-align: center; }

  .status { font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--need); }
  .stock-asof { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .stock-asof .li-lbl { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .stock-asof .li-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--text); }
  .stock-asof .li-old { font-size: 12px; color: var(--warn); }

  /* ── Summary tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile-lbl { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .tile-val { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; margin-top: 4px; }
  .tile.need .tile-val { color: var(--need); }

  /* ── Table ── */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  table.rs { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 920px; }
  table.rs thead th { background: var(--grp-head); color: #fff; font-weight: 600; padding: 10px; text-align: left; white-space: nowrap; user-select: none; }
  table.rs thead th[data-sort] { cursor: pointer; }
  table.rs thead th[data-sort]:hover { background: color-mix(in srgb, var(--grp-head) 82%, #000); }
  /* Column filter row (above the headings) */
  table.rs thead tr.colf th { background: var(--panel-elev); padding: 6px; }
  .cf-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: 600 12px 'Inter', sans-serif; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
  .cf-btn:hover, .cf-btn.open { border-color: var(--accent); }
  .cf-btn.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .cf-btn .cf-n { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  /* Totals row (below the headings) */
  table.rs thead tr.tot th { background: color-mix(in srgb, var(--grp-head) 16%, var(--panel)); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; border-bottom: 2px solid var(--grp-head); }
  table.rs thead tr.tot th.tot-lbl { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  table.rs thead tr.tot th.tot-need { color: var(--need); }
  .pname-row { display: flex; align-items: flex-start; gap: 6px; }
  .copy-btn { flex-shrink: 0; width: 26px; height: 26px; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text-dim); cursor: pointer; margin-top: -3px; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.done { color: var(--ok); border-color: var(--ok); }
  table.rs thead th .arr { margin-left: 5px; font-size: 10px; opacity: 0.55; }
  table.rs thead th.on .arr { opacity: 1; }
  table.rs th.num, table.rs td.num { text-align: right; }
  table.rs th.ctr, table.rs td.ctr { text-align: center; }
  table.rs td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
  table.rs tbody tr:hover td { background: var(--panel-elev); }
  .grp-cell { color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  .pname { font-weight: 600; }
  .pcode { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .range { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .n { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }
  .need-big { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--need); }
  .need-ok { font-size: 18px; font-weight: 700; color: var(--ok); }
  .over { color: var(--warn); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .stepper button { width: 34px; height: 34px; border: 0; background: none; color: var(--text); font: 700 18px 'Inter', sans-serif; cursor: pointer; }
  .stepper button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper .q { min-width: 38px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }
  .stepper.saving .q { color: var(--accent); }

  tr.no-target td, tr.no-target .pname, tr.no-target .pcode, tr.no-target .grp-cell, tr.no-target .n { color: var(--need); }
  tr.no-target td { background: color-mix(in srgb, var(--need) 7%, transparent); }
  tr.no-target .range { font-family: 'Inter', sans-serif; font-weight: 700; }
  .fix-btn { padding: 5px 12px; font-size: 12px; color: var(--need); border-color: var(--need); }
  /* Fix in progress: ranges detected from stock, editable until Save */
  tr.no-target.draft td { background: color-mix(in srgb, var(--warn) 9%, transparent); }
  .wt-inp { width: 84px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: 700 15px 'JetBrains Mono', monospace; color: var(--text); text-align: right; outline: none; }
  .wt-inp:focus { border-color: var(--accent); }
  .wt-inp.bad { border-color: var(--need); }
  .unfixed-tag { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--warn); color: #111; font: 700 10px 'Inter', sans-serif; letter-spacing: .06em; }
  .draft-acts { display: flex; gap: 6px; margin-top: 8px; }
  .draft-acts .btn { padding: 5px 12px; font-size: 12px; }
  .draft-acts .btn.clear { color: var(--need); border-color: color-mix(in srgb, var(--need) 50%, var(--border)); }
  .rm-range { margin-left: 6px; width: 26px; height: 26px; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); cursor: pointer; vertical-align: middle; }
  .rm-range:hover { border-color: var(--need); color: var(--need); }
  tr.draft .n { color: var(--text); }

  .placeholder { margin: 70px auto; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.7; max-width: 480px; }

  #printArea { display: none; }

  @media (max-width: 900px) {
    .topbar { padding: 0 16px; }
    .body { padding: 16px; }
    .toolbar .ms-btn { flex: 1 1 140px; max-width: none; }
    .ms-pop { width: calc(100vw - 32px); }
    .spacer { display: none; }
  }

  @media print {
    @page { margin: 12mm; }
    html, body { height: auto; overflow: visible; background: #fff; color: #000; }
    .main, #toast { display: none !important; }
    #printArea { display: block; font-family: 'Inter', sans-serif; color: #000; }
    #printArea h1 { font-size: 18px; margin-bottom: 2px; }
    #printArea .pa-sub { font-size: 11px; color: #444; margin-bottom: 12px; }
    #printArea table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #printArea th, #printArea td { border: 1px solid #999; padding: 5px 7px; text-align: left; }
    #printArea th { background: #eee; }
    #printArea td.num, #printArea th.num { text-align: right; }
    #printArea td.need { font-weight: 700; font-size: 14px; }
    #printArea tr { break-inside: avoid; }
  }
</style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/reorder.html" class="back-btn" title="Back to Reorder" aria-label="Back to Reorder">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="page-title">Restocking</div>
      </div>
      <div class="topbar-right">
        <a class="btn" href="/restock-setup.html" title="Upload history, weight ranges and target calculation">⚙ Setup targets</a>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
      </div>
    </header>

    <div class="body">
      <div class="stock-asof" id="asOf"></div>
      <div class="toolbar">
        <button class="btn primary" id="importBtn" type="button" title="Import today's Tagging export — updates availability">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import today's stock
        </button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
      </div>
      <div class="toolbar">
        <button class="ms-btn" id="groupSel" type="button" title="Product group"></button>
        <button class="ms-btn" id="productSel" type="button" title="Product name or code"></button>
        <button class="ms-btn" id="targetSel" type="button" title="Target"></button>
        <button class="ms-btn" id="supSel" type="button" title="Supplier"></button>
        <button class="btn clear-f" id="clearF" type="button" hidden>✕ Clear filters</button>
        <div class="spacer"></div>
        <button class="btn" id="exportBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export Excel
        </button>
        <button class="btn" id="printBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>
      </div>
      <div class="status" id="status"></div>
      <div class="tiles" id="tiles"></div>
      <div id="list"><div class="placeholder">Loading…</div></div>
    </div>
  </main>

  <div id="printArea"></div>
  <div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/restock-core.js"></script>
<script>
(function () {
  var C = window.RestockCore;
  var esc = C.esc, norm = C.norm, fmtG = C.fmtG, fmtInt = C.fmtInt, fmtWhen = C.fmtWhen, byNatural = C.byNatural, rangeLabel = C.rangeLabel;

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), statusEl = $('status');
  var groupBtn = $('groupSel'), productBtn = $('productSel'), targetBtn = $('targetSel'), supBtn = $('supSel');

  var stockGroups = [], targets = [], products = {};
  // Toolbar filters — every one is a multi-select; empty = all
  var fGroup = new Set(), fProduct = new Set(), fTarget = new Set(), fSup = new Set();
  var TARGET_OPTS = [['need', 'Needs stock'], ['full', 'Fully stocked'], ['over', 'Over stock'], ['none', 'Unfixed items']];
  // Fix in progress (not saved yet): { [product]: [{ min_wt, max_wt, qty }] }
  var drafts = {};

  // Table columns. val = what the column filter matches on; num = numeric sort key
  function numVal(v) { return v === '' ? -1 : parseFloat(String(v).replace(/,/g, '')); }
  var COLS = [
    { k: 'group', label: 'Product Group', val: function (o) { return o.p.group; } },
    { k: 'product', label: 'Product Name', val: function (o) { return o.p.key; } },
    { k: 'from', label: 'From (g)', cls: 'num', val: function (o) { return o.none ? '' : fmtG(o.r.min_wt); }, num: function (o) { return o.none ? -1 : o.r.min_wt; } },
    { k: 'to', label: 'To (g)', cls: 'num', val: function (o) { return o.none ? '' : fmtG(o.r.max_wt); }, num: function (o) { return o.none ? -1 : o.r.max_wt; } },
    { k: 'target', label: 'Target', cls: 'ctr', val: function (o) { return o.none ? '' : String(o.r.qty); }, num: function (o) { return o.none ? -1 : o.r.qty; } },
    { k: 'have', label: 'Availability', cls: 'num', val: function (o) { return String(o.have); }, num: function (o) { return o.have; } },
    { k: 'need', label: 'Need', cls: 'num', val: function (o) { return o.none ? '' : String(o.need); }, num: function (o) { return o.none ? -1 : o.need; } }
  ];
  var COL = {}, colF = {};
  COLS.forEach(function (c) { COL[c.k] = c; colF[c.k] = new Set(); });

  // Default order (always on page open): biggest Need first, then lowest Availability
  var DEFAULT_SORT = { col: 'need', dir: 'desc' };
  var sortBy = DEFAULT_SORT;

  function setStatus(msg, ok) { statusEl.textContent = msg || ''; statusEl.className = 'status ' + (ok ? 'ok' : 'err'); }
  function toast(msg, type) {
    if (typeof window.toast === 'function') return window.toast(msg, type || 'success');
    setStatus(msg, type !== 'error');
  }
  function codesOf(p) { return Object.keys(p.printNames).sort(byNatural).join(', '); }

  // ── Rows: one per target weight range ──
  function stateOf(o) { return o.have < o.r.qty ? 'need' : o.have === o.r.qty ? 'full' : 'over'; }
  // Products with nothing in stock have no supplier in the file → the "No supplier" filter
  var NO_SUP = '__none__';
  function hasSupplier(p) { for (var s in p.suppliers) return true; return false; }
  function inGroup(p) { return !fGroup.size || fGroup.has(p.group); }
  function inSup(p) {
    if (!fSup.size) return true;
    if (fSup.has(NO_SUP) && !hasSupplier(p)) return true;
    for (var s in p.suppliers) if (fSup.has(s)) return true;
    return false;
  }
  function inScope(p) { return inGroup(p) && inSup(p) && (!fProduct.size || fProduct.has(p.key)); }
  // Rows after the toolbar filters (products with no target range included as `none` rows)
  function baseRows() {
    var out = [], wantNone = !fTarget.size || fTarget.has('none');
    Object.keys(products).forEach(function (k) {
      var p = products[k];
      if (!inScope(p)) return;
      if (!p.ranges.length) {
        if (!wantNone) return;
        var d = drafts[p.key];
        if (!d) { out.push({ p: p, r: null, have: p.stock.length, need: 0, none: true }); return; }
        // Being fixed: one row per detected range (still unfixed, so not counted in the totals)
        var hv = draftHave(p, d);
        d.forEach(function (r, i) { out.push({ p: p, r: null, dr: r, di: i, have: hv[i], need: 0, none: true }); });
        return;
      }
      p.rangeStats.forEach(function (x) {
        var o = { p: p, r: x.r, have: x.have, need: x.need };
        if (!fTarget.size || fTarget.has(stateOf(o))) out.push(o);
      });
    });
    return out;
  }
  // In-stock pieces per draft range (each piece fills the first range its weight falls in)
  function draftHave(p, d) {
    var have = d.map(function () { return 0; });
    p.stock.forEach(function (s) {
      var w = Math.round(s.wt * 1000) / 1000;
      var i = d.findIndex(function (r) { return w >= Number(r.min_wt) && w <= Number(r.max_wt); });
      if (i !== -1) have[i]++;
    });
    return have;
  }
  // One row per product for print/export (a product being fixed is still one unfixed row)
  function outRows() {
    return visibleRows().filter(function (o) { return !o.di; }).map(function (o) {
      return o.dr ? { p: o.p, r: null, have: o.p.stock.length, need: 0, none: true } : o;
    });
  }
  // Column filters; `skip` leaves one column out (to list that column's own choices)
  function passCols(o, skip) {
    for (var k in colF) if (k !== skip && colF[k].size && !colF[k].has(COL[k].val(o))) return false;
    return true;
  }
  function byDefault(a, b) {
    return b.need - a.need || a.have - b.have || byNatural(a.p.group, b.p.group) || byNatural(a.p.key, b.p.key) || a.r.min_wt - b.r.min_wt;
  }

    if (dr) dr[inp.dataset.f] = inp.value.replace(/,/g, '').trim();
  });
  // Updated in place (a full re-draw here would swallow a click on Save made right after typing)
  listEl.addEventListener('change', function (e) {
    var tr = e.target.closest('.wt-inp') && e.target.closest('tr[data-dkey]');
    var key = tr && tr.dataset.dkey, d = key && drafts[key];
    if (!d) return;
    var hv = draftHave(products[key], d);
    listEl.querySelectorAll('tr[data-dkey]').forEach(function (row) {
      if (row.dataset.dkey !== key) return;
      var i = Number(row.dataset.di), r = d[i];
      if (!r) return;
      var bad = !(r.min_wt !== '' && r.max_wt !== '' && Number(r.min_wt) >= 0 && Number(r.max_wt) > 0 && Number(r.min_wt) <= Number(r.max_wt));
      row.querySelectorAll('.wt-inp').forEach(function (x) { x.classList.toggle('bad', bad); });
      var need = Math.max(0, Number(r.qty) - hv[i]), cells = row.children;
      cells[5].innerHTML = '<span class="n">' + hv[i] + '</span>';
      cells[6].innerHTML = need ? '<span class="need-big">' + need + '</span>' : '<span class="need-ok">✓</span>';
    });
  });
  listEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.closest('.wt-inp')) e.target.blur(); });

  async function saveDraft(key, btn) {
    var p = products[key], d = drafts[key];
    if (!p || !d) return;
    var ranges = d.map(function (r) { return { min_wt: Number(r.min_wt), max_wt: Number(r.max_wt), qty: Number(r.qty) }; });
    var bad = d.some(function (r) { return r.min_wt === '' || r.max_wt === ''; }) || ranges.some(function (r) {
      return !isFinite(r.min_wt) || !isFinite(r.max_wt) || r.min_wt < 0 || r.max_wt <= 0 || r.min_wt > r.max_wt;
    });
    if (bad) return toast('Enter a valid From and To weight for every range (From not more than To).', 'error');
    ranges.sort(function (a, b) { return a.min_wt - b.min_wt; });
    for (var i = 1; i < ranges.length; i++) {
      if (ranges[i].min_wt <= ranges[i - 1].max_wt) return toast('Ranges overlap: ' + rangeLabel(ranges[i - 1]) + ' and ' + rangeLabel(ranges[i]) + '.', 'error');
    }
    btn.disabled = true;
    try {
      await C.api('/api/restock/product-targets', C.jsonOpts('PUT', { group_name: p.group, product: p.key, ranges: ranges }));
      delete drafts[key];
      toast('Target fixed: ' + p.key + ' — ' + ranges.length + (ranges.length === 1 ? ' range' : ' ranges'));
      await load();
    } catch (err) {
      btn.disabled = false;
      toast('Could not save: ' + err.message, 'error');
    }
  }

  async function saveQty(id) {
    var t = targets.find(function (x) { return x.id === id; }), pd = pending[id];
    delete pending[id];
    if (!t || !pd || pd.from === t.qty) return;
    var tr = listEl.querySelector('tr[data-id="' + id + '"]'), stp = tr && tr.querySelector('.stepper');
    if (stp) stp.classList.add('saving');
    try {
      await C.api('/api/restock/targets/' + id, C.jsonOpts('PUT', { group_name: t.group_name, product: t.product, min_wt: t.min_wt, max_wt: t.max_wt, qty: t.qty }));
      toast('Target saved: ' + t.product + ' ' + rangeLabel(t) + ' → ' + t.qty);
    } catch (err) {
      t.qty = pd.from;
      toast('Could not save target: ' + err.message, 'error');
    }
    tr = listEl.querySelector('tr[data-id="' + id + '"]');
    if (tr) { refreshRow(tr, t); var s2 = tr.querySelector('.stepper'); if (s2) s2.classList.remove('saving'); }
  }

  // Update one row in place (keeps scroll; the row stays even if it no longer matches the Target filter until the next filter change)
  function refreshRow(tr, t) {
    var p = products[t.product];
    C.compute(p);
    var x = p.rangeStats.find(function (s) { return s.r === t; });
    var tmp = document.createElement('tbody');
    tmp.innerHTML = rowHtml({ p: p, r: t, have: x.have, need: x.need });
    var nr = tmp.firstChild;
    if (pending[t.id]) nr.querySelector('.stepper').classList.add('saving');
    tr.replaceWith(nr);
    var rows = visibleRows(), tot = listEl.querySelector('tr.tot');
    renderTiles(rows);
    if (tot) tot.outerHTML = totalsHtml(rows);
  }

  // ── Import today's stock ──
  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', async function () {
    var file = this.files[0];
    this.value = '';
    if (!file) return;
    var btn = $('importBtn');
    btn.disabled = true;
    try {
      var names = await C.importTagging(file, setStatus);
      if (names) {
        // After an import, show the products that still have no target fixed
        fTarget.clear();
        fTarget.add('none');
        await load();
      }
    } finally { btn.disabled = false; }
  });

  // ── Print + Excel (the rows shown) ──
  $('printBtn').addEventListener('click', function () {
    var rows = outRows();
    if (!rows.length) return toast('Nothing to print for the current filter.', 'error');
    var t = sums(rows);
    var nNone = rows.filter(function (o) { return o.none; }).length;
    var html = '<h1>Restocking</h1><div class="pa-sub">' + esc(filterLabel()) + ' · ' +
      esc(new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })) +
      ' · ' + (rows.length - nNone) + ' ranges · Need: <b>' + t.need + ' pcs</b>' + (nNone ? ' · <span style="color:#c00000">' + nNone + ' with no target fixed</span>' : '') + '</div>' +
      '<table><thead><tr><th>Product Group</th><th>Product Name</th><th class="num">From (g)</th><th class="num">To (g)</th><th class="num">Target</th><th class="num">Availability</th><th class="num">Need</th></tr>' +
      '<tr style="font-weight:700"><td>Total</td><td>' + rows.length + ' rows</td><td class="num">' + fmtG(t.from) + '</td><td class="num">' + fmtG(t.to) + '</td>' +
      '<td class="num">' + t.target + '</td><td class="num">' + t.have + '</td><td class="num need">' + t.need + '</td></tr></thead><tbody>' +
      rows.map(function (o) {
        if (o.none) return '<tr style="color:#c00000;font-weight:600"><td>' + esc(o.p.group) + '</td><td>' + esc(o.p.key) + '</td><td colspan="2">No target fixed</td>' +
          '<td class="num"></td><td class="num">' + o.have + '</td><td class="num"></td></tr>';
        return '<tr><td>' + esc(o.p.group) + '</td><td>' + esc(o.p.key) + '</td><td class="num">' + fmtG(o.r.min_wt) + '</td><td class="num">' + fmtG(o.r.max_wt) + '</td>' +
          '<td class="num">' + o.r.qty + '</td><td class="num">' + o.have + '</td><td class="num need">' + (o.need || '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    $('printArea').innerHTML = html;
    window.print();
  });

  // ExcelJS (real Excel Tables) is loaded only when exporting
  var excelJsReady = null;
  function loadExcelJs() {
    return excelJsReady || (excelJsReady = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = function () { resolve(window.ExcelJS); };
      s.onerror = function () { excelJsReady = null; reject(new Error('Could not load the Excel library — check the internet connection.')); };
      document.head.appendChild(s);
    }));
  }

  $('exportBtn').addEventListener('click', async function () {
    var rows = outRows();
    if (!rows.length) return toast('Nothing to export for the current filter.', 'error');
    var btn = this;
    btn.disabled = true;
    try {
      var ExcelJS = await loadExcelJs();
      // One sheet per supplier. A product goes under the supplier it was last tagged from
      // (or one of the chosen suppliers when the Supplier filter is set), so each piece is ordered once.
      var bySup = {};
      rows.forEach(function (o) {
        var s = o.p.lastSupplier;
        if (fSup.size && !fSup.has(s)) s = Object.keys(o.p.suppliers).sort(byNatural).find(function (x) { return fSup.has(x); }) || '';
        s = s || 'No supplier';
        (bySup[s] = bySup[s] || []).push(o);
      });
      var wb = new ExcelJS.Workbook(), used = {};
      wb.creator = 'APPACHI Restocking';
      Object.keys(bySup).sort(byNatural).forEach(function (s, si) {
        var list = bySup[s], need = list.reduce(function (t, o) { return t + o.need; }, 0);
        var nNone = list.filter(function (o) { return o.none; }).length;
        // Excel sheet names: max 31 chars, no : \ / ? * [ ], unique
        var base = s.replace(/[:\\\/?*\[\]]/g, ' ').trim().slice(0, 31) || 'Supplier', name = base, n = 2;
        while (used[name.toLowerCase()]) { var sfx = ' (' + n++ + ')'; name = base.slice(0, 31 - sfx.length) + sfx; }
        used[name.toLowerCase()] = 1;

        var ws = wb.addWorksheet(name, {
          views: [{ state: 'frozen', ySplit: 3 }],
          pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '3:3' }
        });
        ws.columns = [16, 48, 16, 10, 10, 9, 13, 9].map(function (w) { return { width: w }; });
        ws.getCell('A1').value = s;
        ws.getCell('A1').font = { bold: true, size: 14 };
        ws.getCell('A2').value = (list.length - nNone) + ' ranges · Need ' + need + ' pcs' + (nNone ? ' · ' + nNone + ' with no target fixed (red)' : '') + ' · Stock as of ' + lastImportText();
        ws.getCell('A2').font = { italic: true, color: { argb: 'FF555555' } };

        ws.addTable({
          name: 'Restock' + (si + 1),
          ref: 'A3',
          headerRow: true,
          totalsRow: true,
          style: { theme: 'TableStyleMedium2', showRowStripes: true },
          columns: [
            { name: 'Product Group', totalsRowLabel: 'Total', filterButton: true },
            { name: 'Product Name', filterButton: true },
            { name: 'Code', filterButton: true },
            { name: 'From (g)', filterButton: true },
            { name: 'To (g)', filterButton: true },
            { name: 'Target', totalsRowFunction: 'sum', filterButton: true },
            { name: 'Availability', totalsRowFunction: 'sum', filterButton: true },
            { name: 'Need', totalsRowFunction: 'sum', filterButton: true }
          ],
          rows: list.map(function (o) {
            if (o.none) return [o.p.group, o.p.key, Object.keys(o.p.printNames).join(', '), 'No target fixed', null, null, o.have, null];
            return [o.p.group, o.p.key, Object.keys(o.p.printNames).join(', '), o.r.min_wt, o.r.max_wt, o.r.qty, o.have, o.need];
          })
        });
        // No-target products (listed first) in bold red
        for (var nr = 4; nr < 4 + nNone; nr++) ws.getRow(nr).eachCell({ includeEmpty: true }, function (cell) { cell.font = { bold: true, color: { argb: 'FFC00000' } }; });
        // Need column bold red when something must be ordered
        var last = 3 + list.length;
        ws.addConditionalFormatting({
          ref: 'H4:H' + last,
          rules: [{ type: 'cellIs', operator: 'greaterThan', formulae: [0], priority: 1,
                    style: { font: { bold: true, color: { argb: 'FFC00000' } } } }]
        });
        for (var r = 4; r <= last + 1; r++) {
          ['D', 'E', 'F', 'G', 'H'].forEach(function (c) { ws.getCell(c + r).alignment = { horizontal: 'right' }; });
        }
        ws.getRow(last + 1).font = { bold: true };
      });

      var buf = await wb.xlsx.writeBuffer();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      a.download = 'Restocking-' + (fGroup.size === 1 ? Array.from(fGroup)[0].replace(/[^\w.-]+/g, '_') + '-' : '') + C.dateStamp() + '.xlsx';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (err) {
      toast('Export failed: ' + err.message, 'error');
    } finally { btn.disabled = false; }
  });

  // ── Load ──
  async function load() {
    var body = document.querySelector('.body'), top = body.scrollTop;
    try {
      var d = await C.api('/api/restock');
      stockGroups = d.groups; targets = d.targets;
    } catch (err) {
      listEl.innerHTML = '<div class="placeholder">Could not load: ' + esc(err.message) + '</div>';
      return;
    }
    // Targets are fixed; new products stay without a target (red) until set in Setup
    products = C.build(stockGroups, targets);
    pruneScoped();
    render();
    body.scrollTop = top;
  }

  load();
})();
</script>

<script src="/pwa.js" defer></script>
<script src="/push-native.js" defer></script>
<script src="/auth.js"></script>
<script src="/theme.js"></script>
<script src="/notify.js"></script>
</body>
