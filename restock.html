<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Restocking · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  :root { --grp-head: #3d9be9; --need: #e5534b; --ok: #3fb950; --warn: #d29922; }

  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { min-height: calc(64px + env(safe-area-inset-top, 0px)); height: auto; flex-shrink: 0; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top, 0px) 28px 0; display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .page-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .theme-btn, .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .15s; flex-shrink: 0; text-decoration: none; }
  .theme-btn:hover, .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }

  .body { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }

  /* ── Toolbar ── */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font: 600 13px 'Inter', sans-serif; color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  .btn.primary:hover { filter: brightness(1.08); color: #111; }
  .spacer { flex: 1; }
  select.inp, input.inp { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: 500 13px 'Inter', sans-serif; color: var(--text); outline: none; }
  select.inp:focus, input.inp:focus { border-color: var(--accent); }
  #productQ { width: 240px; }
  .status { font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--need); }
  .stock-asof { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .stock-asof .li-lbl { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .stock-asof .li-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--text); }
  .stock-asof .li-old { font-size: 12px; color: var(--warn); }

  /* ── Summary tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile-lbl { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .tile-val { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; margin-top: 4px; }
  .tile.need .tile-val { color: var(--need); }

  /* ── Table ── */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  table.rs { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  table.rs thead th { position: sticky; top: 0; z-index: 1; background: var(--grp-head); color: #fff; font-weight: 600; padding: 10px; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; }
  table.rs thead th:hover { background: color-mix(in srgb, var(--grp-head) 82%, #000); }
  table.rs thead th .arr { margin-left: 5px; font-size: 10px; opacity: 0.55; }
  table.rs thead th.on .arr { opacity: 1; }
  table.rs th.num, table.rs td.num { text-align: right; }
  table.rs th.ctr, table.rs td.ctr { text-align: center; }
  table.rs td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
  table.rs tbody tr:hover td { background: var(--panel-elev); }
  .grp-cell { color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  .pname { font-weight: 600; }
  .pcode { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .range { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .n { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }
  .need-big { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--need); }
  .need-ok { font-size: 18px; font-weight: 700; color: var(--ok); }
  .over { color: var(--warn); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .stepper button { width: 34px; height: 34px; border: 0; background: none; color: var(--text); font: 700 18px 'Inter', sans-serif; cursor: pointer; }
  .stepper button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper .q { min-width: 38px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }
  .stepper.saving .q { color: var(--accent); }

  tr.no-target td, tr.no-target .pname, tr.no-target .pcode, tr.no-target .grp-cell, tr.no-target .n { color: var(--need); }
  tr.no-target td { background: color-mix(in srgb, var(--need) 7%, transparent); }
  tr.no-target .range { font-family: 'Inter', sans-serif; font-weight: 700; }
  .fix-btn { padding: 5px 12px; font-size: 12px; color: var(--need); border-color: var(--need); }

  .placeholder { margin: 70px auto; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.7; max-width: 480px; }

  #printArea { display: none; }

  @media (max-width: 900px) {
    .topbar { padding: 0 16px; }
    .body { padding: 16px; }
    #productQ { width: 100%; }
    .spacer { display: none; }
  }

  @media print {
    @page { margin: 12mm; }
    html, body { height: auto; overflow: visible; background: #fff; color: #000; }
    .main, #toast { display: none !important; }
    #printArea { display: block; font-family: 'Inter', sans-serif; color: #000; }
    #printArea h1 { font-size: 18px; margin-bottom: 2px; }
    #printArea .pa-sub { font-size: 11px; color: #444; margin-bottom: 12px; }
    #printArea table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #printArea th, #printArea td { border: 1px solid #999; padding: 5px 7px; text-align: left; }
    #printArea th { background: #eee; }
    #printArea td.num, #printArea th.num { text-align: right; }
    #printArea td.need { font-weight: 700; font-size: 14px; }
    #printArea tr { break-inside: avoid; }
  }
</style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/reorder.html" class="back-btn" title="Back to Reorder" aria-label="Back to Reorder">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="page-title">Restocking</div>
      </div>
      <div class="topbar-right">
        <a class="btn" href="/restock-setup.html" title="Upload history, weight ranges and target calculation">⚙ Setup targets</a>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
      </div>
    </header>

    <div class="body">
      <div class="stock-asof" id="asOf"></div>
      <div class="toolbar">
        <button class="btn primary" id="importBtn" type="button" title="Import today's Tagging export — updates availability">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import today's stock
        </button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
      </div>
      <div class="toolbar">
        <select class="inp" id="groupSel" title="Product group"></select>
        <input class="inp" id="productQ" type="search" list="productList" placeholder="Product…" title="Product name or code" />
        <datalist id="productList"></datalist>
        <select class="inp" id="targetSel" title="Target">
          <option value="all">All targets</option>
          <option value="need">Needs stock</option>
          <option value="full">Fully stocked</option>
          <option value="over">Over stock</option>
          <option value="none">No target fixed</option>
        </select>
        <select class="inp" id="supSel" title="Supplier"></select>
        <div class="spacer"></div>
        <button class="btn" id="exportBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export Excel
        </button>
        <button class="btn" id="printBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>
      </div>
      <div class="status" id="status"></div>
      <div class="tiles" id="tiles"></div>
      <div id="list"><div class="placeholder">Loading…</div></div>
    </div>
  </main>

  <div id="printArea"></div>
  <div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/restock-core.js"></script>
<script>
(function () {
  var C = window.RestockCore;
  var esc = C.esc, norm = C.norm, fmtInt = C.fmtInt, fmtWhen = C.fmtWhen, byNatural = C.byNatural, rangeLabel = C.rangeLabel;

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), statusEl = $('status');
  var groupSel = $('groupSel'), productQ = $('productQ'), targetSel = $('targetSel'), supSel = $('supSel');

  var stockGroups = [], targets = [], products = {};
  // Sort: empty col = Group → Product → Range
  var SORTS = {
    group: null, product: null,
    range: function (o) { return o.r.min_wt; },
    target: function (o) { return o.r.qty; },
    have: function (o) { return o.have; },
    need: function (o) { return o.need; }
  };
  var sortBy = { col: '', dir: '' };
  try { var savedSort = JSON.parse(localStorage.getItem('restockMainSort') || 'null'); if (savedSort && savedSort.col in SORTS) sortBy = savedSort; } catch (_) {}

  function setStatus(msg, ok) { statusEl.textContent = msg || ''; statusEl.className = 'status ' + (ok ? 'ok' : 'err'); }
  function toast(msg, type) {
    if (typeof window.toast === 'function') return window.toast(msg, type || 'success');
    setStatus(msg, type !== 'error');
  }

  // ── Rows: one per target weight range ──
  function stateOf(o) { return o.have < o.r.qty ? 'need' : o.have === o.r.qty ? 'full' : 'over'; }
  // Products with nothing in stock have no supplier in the file → the "No supplier" filter
  var NO_SUP = '__none__';
  function hasSupplier(p) { for (var s in p.suppliers) return true; return false; }
  function inScope(p) {
    var g = groupSel.value, sup = supSel.value, q = norm(productQ.value);
    if (g && p.group !== g) return false;
    if (sup === NO_SUP ? hasSupplier(p) : sup && !p.suppliers[sup]) return false;
    if (q && norm(p.key).indexOf(q) === -1 && norm(Object.keys(p.printNames).join(' ')).indexOf(q) === -1) return false;
    return true;
  }
  // Products with no target range — always listed first, in red
  function noTargetRows() {
    var t = targetSel.value;
    if (t !== 'all' && t !== 'none') return [];
    return Object.keys(products).map(function (k) { return products[k]; })
      .filter(function (p) { return !p.ranges.length && inScope(p); })
      .sort(function (a, b) { return byNatural(a.group, b.group) || byNatural(a.key, b.key); })
      .map(function (p) { return { p: p, r: null, have: p.stock.length, need: 0, none: true }; });
  }
  function visibleRows() {
    var t = targetSel.value, out = [];
    if (t === 'none') return noTargetRows();
    Object.keys(products).forEach(function (k) {
      var p = products[k];
      if (!inScope(p)) return;
      p.rangeStats.forEach(function (x) {
        var o = { p: p, r: x.r, have: x.have, need: x.need };
        if (t === 'all' || stateOf(o) === t) out.push(o);
      });
    });
    var dir = sortBy.dir === 'asc' ? 1 : -1, val = SORTS[sortBy.col];
    var base = function (a, b) { return byNatural(a.p.group, b.p.group) || byNatural(a.p.key, b.p.key) || a.r.min_wt - b.r.min_wt; };
    out.sort(sortBy.col === 'group' ? function (a, b) { return byNatural(a.p.group, b.p.group) * dir || base(a, b); }
           : sortBy.col === 'product' ? function (a, b) { return byNatural(a.p.key, b.p.key) * dir || base(a, b); }
           : val ? function (a, b) { return (val(a) - val(b)) * dir || base(a, b); }
           : base);
    return noTargetRows().concat(out);
  }

  // ── Filters ──
  function fillFilters() {
    var gCur = groupSel.value, groups = {};
    Object.keys(products).forEach(function (k) { groups[products[k].group] = 1; });
    var gl = Object.keys(groups).sort(byNatural);
    groupSel.innerHTML = '<option value="">All groups (' + gl.length + ')</option>' +
      gl.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    if (gl.indexOf(gCur) !== -1) groupSel.value = gCur;
    fillScoped();
  }
  // Supplier and product lists follow the chosen group
  function fillScoped() {
    var g = groupSel.value, sCur = supSel.value, count = {}, names = [], noSup = 0;
    Object.keys(products).forEach(function (k) {
      var p = products[k];
      if (g && p.group !== g) return;
      names.push(p.key);
      if (!hasSupplier(p)) noSup++;
      Object.keys(p.suppliers).forEach(function (s) { count[s] = (count[s] || 0) + 1; });
    });
    var sl = Object.keys(count).sort(byNatural);
    supSel.innerHTML = '<option value="">All suppliers (' + sl.length + ')</option>' +
      sl.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + ' (' + count[s] + ')</option>'; }).join('') +
      (noSup ? '<option value="' + NO_SUP + '">No supplier (' + noSup + ')</option>' : '');
    if (sl.indexOf(sCur) !== -1 || (sCur === NO_SUP && noSup)) supSel.value = sCur;
    $('productList').innerHTML = names.sort(byNatural).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  }
  function filterLabel() {
    var parts = [groupSel.value || 'All groups'];
    if (productQ.value.trim()) parts.push('product "' + productQ.value.trim() + '"');
    if (targetSel.value !== 'all') parts.push(targetSel.options[targetSel.selectedIndex].text);
    if (supSel.value) parts.push(supSel.value === NO_SUP ? 'No supplier' : supSel.value);
    return parts.join(' · ');
  }

  // ── Render ──
  function lastImportText() {
    var t = stockGroups.map(function (g) { return g.uploaded_at; }).sort().pop();
    return t ? fmtWhen(t) : 'never';
  }
  function render() {
    var times = stockGroups.map(function (g) { return g.uploaded_at; }).sort();
    $('asOf').innerHTML = times.length
      ? '<span class="li-lbl">Last imported</span><span class="li-val">' + esc(lastImportText()) + '</span>' +
        (fmtWhen(times[0]) !== fmtWhen(times[times.length - 1]) ? '<span class="li-old">Oldest group import: ' + esc(fmtWhen(times[0])) + '</span>' : '')
      : '<span class="li-lbl">Last imported</span><span class="li-val">Never</span>';

    var rows = visibleRows();
    renderTiles(rows);

    if (!targets.length && !rows.length) {
      listEl.innerHTML = '<div class="placeholder">No targets yet.<br>Set target weight ranges in <b>⚙ Setup targets</b>,<br>then click <b>Import today\'s stock</b>.</div>';
      return;
    }
    if (!rows.length) { listEl.innerHTML = '<div class="placeholder">No ranges match these filters.</div>'; return; }

    function th(col, label, cls) {
      var on = sortBy.col === col;
      return '<th class="' + (cls || '') + (on ? ' on' : '') + '" data-sort="' + col + '" title="Sort by ' + label + '">' + label +
        '<span class="arr">' + (on ? (sortBy.dir === 'asc' ? '▲' : '▼') : '⇅') + '</span></th>';
    }
    listEl.innerHTML = '<div class="tbl-wrap"><table class="rs"><thead><tr>' +
      th('group', 'Product Group') + th('product', 'Product Name') + th('range', 'Range') +
      th('target', 'Target', 'ctr') + th('have', 'Availability', 'num') + th('need', 'Need', 'num') +
      '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>';
  }
  function renderTiles(rows) {
    var need = 0, short = 0, prods = {}, ranges = 0, none = 0;
    rows.forEach(function (o) { prods[o.p.key] = 1; if (o.none) { none++; return; } ranges++; need += o.need; if (o.need) short++; });
    $('tiles').innerHTML = tile('Products', fmtInt(Object.keys(prods).length)) + tile('Ranges', fmtInt(ranges)) +
      tile('Ranges short', fmtInt(short)) + tile('Pieces to order', fmtInt(need), 'need') +
      (none ? tile('No target fixed', fmtInt(none), 'need') : '');
  }
  function tile(lbl, val, cls) {
    return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="tile-lbl">' + lbl + '</div><div class="tile-val">' + val + '</div></div>';
  }
  function rowHtml(o) {
    var codes = Object.keys(o.p.printNames).sort(byNatural).join(', ');
    if (o.none) {
      return '<tr class="no-target" title="No target weight range fixed — set it in Setup targets">' +
        '<td class="grp-cell">' + esc(o.p.group) + '</td>' +
        '<td><div class="pname">' + esc(o.p.key) + '</div>' + (codes ? '<div class="pcode">' + esc(codes) + '</div>' : '') + '</td>' +
        '<td><span class="range">No target fixed</span></td>' +
        '<td class="ctr"><a class="btn fix-btn" href="/restock-setup.html">Fix</a></td>' +
        '<td class="num"><span class="n">' + o.have + '</span></td><td class="num">—</td></tr>';
    }
    var st = stateOf(o);
    return '<tr data-id="' + o.r.id + '">' +
      '<td class="grp-cell">' + esc(o.p.group) + '</td>' +
      '<td><div class="pname">' + esc(o.p.key) + '</div>' + (codes ? '<div class="pcode">' + esc(codes) + '</div>' : '') + '</td>' +
      '<td><span class="range">' + esc(rangeLabel(o.r)) + '</span></td>' +
      '<td class="ctr"><span class="stepper"><button type="button" data-step="-1" title="Target −1" aria-label="Decrease target"' + (o.r.qty <= 1 ? ' disabled' : '') + '>−</button>' +
        '<span class="q">' + o.r.qty + '</span>' +
        '<button type="button" data-step="1" title="Target +1" aria-label="Increase target"' + (o.r.qty >= 999 ? ' disabled' : '') + '>+</button></span></td>' +
      '<td class="num"><span class="n' + (st === 'over' ? ' over' : '') + '" title="' + (st === 'over' ? 'More than target' : '') + '">' + o.have + '</span></td>' +
      '<td class="num">' + (o.need ? '<span class="need-big">' + o.need + '</span>' : '<span class="need-ok">✓</span>') + '</td></tr>';
  }

  // ── Target −/+ ── saved after a short pause so quick taps make one save
  var pending = {};
  listEl.addEventListener('click', function (e) {
    var sh = e.target.closest('th[data-sort]');
    if (sh) {
      var col = sh.dataset.sort, first = col === 'group' || col === 'product' || col === 'range' ? 'asc' : 'desc';
      if (sortBy.col !== col) sortBy = { col: col, dir: first };
      else if (sortBy.dir === first) sortBy = { col: col, dir: first === 'asc' ? 'desc' : 'asc' };
      else sortBy = { col: '', dir: '' };
      try { localStorage.setItem('restockMainSort', JSON.stringify(sortBy)); } catch (_) {}
      render();
      return;
    }
    var b = e.target.closest('button[data-step]');
    if (!b) return;
    var tr = b.closest('tr'), id = Number(tr.dataset.id);
    var t = targets.find(function (x) { return x.id === id; });
    if (!t) return;
    var q = Math.min(999, Math.max(1, t.qty + Number(b.dataset.step)));
    if (q === t.qty) return;
    if (!pending[id]) pending[id] = { from: t.qty };
    t.qty = q;
    refreshRow(tr, t);
    clearTimeout(pending[id].timer);
    pending[id].timer = setTimeout(function () { saveQty(id); }, 600);
  });

  async function saveQty(id) {
    var t = targets.find(function (x) { return x.id === id; }), pd = pending[id];
    delete pending[id];
    if (!t || !pd || pd.from === t.qty) return;
    var tr = listEl.querySelector('tr[data-id="' + id + '"]'), stp = tr && tr.querySelector('.stepper');
    if (stp) stp.classList.add('saving');
    try {
      await C.api('/api/restock/targets/' + id, C.jsonOpts('PUT', { group_name: t.group_name, product: t.product, min_wt: t.min_wt, max_wt: t.max_wt, qty: t.qty }));
      toast('Target saved: ' + t.product + ' ' + rangeLabel(t) + ' → ' + t.qty);
    } catch (err) {
      t.qty = pd.from;
      toast('Could not save target: ' + err.message, 'error');
    }
    tr = listEl.querySelector('tr[data-id="' + id + '"]');
    if (tr) { refreshRow(tr, t); var s2 = tr.querySelector('.stepper'); if (s2) s2.classList.remove('saving'); }
  }

  // Update one row in place (keeps scroll; the row stays even if it no longer matches the Target filter until the next filter change)
  function refreshRow(tr, t) {
    var p = products[t.product];
    C.compute(p);
    var x = p.rangeStats.find(function (s) { return s.r === t; });
    var tmp = document.createElement('tbody');
    tmp.innerHTML = rowHtml({ p: p, r: t, have: x.have, need: x.need });
    var nr = tmp.firstChild;
    if (pending[t.id]) nr.querySelector('.stepper').classList.add('saving');
    tr.replaceWith(nr);
    renderTiles(visibleRows());
  }

  groupSel.addEventListener('change', function () { fillScoped(); render(); });
  supSel.addEventListener('change', render);
  targetSel.addEventListener('change', render);
  productQ.addEventListener('input', function () { clearTimeout(productQ._t); productQ._t = setTimeout(render, 150); });

  // ── Import today's stock ──
  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', async function () {
    var file = this.files[0];
    this.value = '';
    if (!file) return;
    var btn = $('importBtn');
    btn.disabled = true;
    try {
      var names = await C.importTagging(file, setStatus);
      if (names) await load();
    } finally { btn.disabled = false; }
  });

  // ── Print + Excel (the rows shown) ──
  $('printBtn').addEventListener('click', function () {
    var rows = visibleRows();
    if (!rows.length) return toast('Nothing to print for the current filter.', 'error');
    var need = rows.reduce(function (s, o) { return s + o.need; }, 0);
    var nNone = rows.filter(function (o) { return o.none; }).length;
    var html = '<h1>Restocking</h1><div class="pa-sub">' + esc(filterLabel()) + ' · ' +
      esc(new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })) +
      ' · ' + (rows.length - nNone) + ' ranges · Need: <b>' + need + ' pcs</b>' + (nNone ? ' · <span style="color:#c00000">' + nNone + ' with no target fixed</span>' : '') + '</div>' +
      '<table><thead><tr><th>Product Group</th><th>Product Name</th><th>Range</th><th class="num">Target</th><th class="num">Availability</th><th class="num">Need</th></tr></thead><tbody>' +
      rows.map(function (o) {
        if (o.none) return '<tr style="color:#c00000;font-weight:600"><td>' + esc(o.p.group) + '</td><td>' + esc(o.p.key) + '</td><td>No target fixed</td>' +
          '<td class="num"></td><td class="num">' + o.have + '</td><td class="num"></td></tr>';
        return '<tr><td>' + esc(o.p.group) + '</td><td>' + esc(o.p.key) + '</td><td>' + esc(rangeLabel(o.r)) + '</td>' +
          '<td class="num">' + o.r.qty + '</td><td class="num">' + o.have + '</td><td class="num need">' + (o.need || '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    $('printArea').innerHTML = html;
    window.print();
  });

  // ExcelJS (real Excel Tables) is loaded only when exporting
  var excelJsReady = null;
  function loadExcelJs() {
    return excelJsReady || (excelJsReady = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = function () { resolve(window.ExcelJS); };
      s.onerror = function () { excelJsReady = null; reject(new Error('Could not load the Excel library — check the internet connection.')); };
      document.head.appendChild(s);
    }));
  }

  $('exportBtn').addEventListener('click', async function () {
    var rows = visibleRows();
    if (!rows.length) return toast('Nothing to export for the current filter.', 'error');
    var btn = this;
    btn.disabled = true;
    try {
      var ExcelJS = await loadExcelJs();
      // One sheet per supplier. A product goes under the supplier it was last tagged from
      // (or the chosen supplier when the Supplier filter is set), so each piece is ordered once.
      var bySup = {};
      rows.forEach(function (o) {
        var s = (supSel.value !== NO_SUP && supSel.value) || o.p.lastSupplier || 'No supplier';
        (bySup[s] = bySup[s] || []).push(o);
      });
      var wb = new ExcelJS.Workbook(), used = {};
      wb.creator = 'APPACHI Restocking';
      Object.keys(bySup).sort(byNatural).forEach(function (s, si) {
        var list = bySup[s], need = list.reduce(function (t, o) { return t + o.need; }, 0);
        var nNone = list.filter(function (o) { return o.none; }).length;
        // Excel sheet names: max 31 chars, no : \ / ? * [ ], unique
        var base = s.replace(/[:\\\/?*\[\]]/g, ' ').trim().slice(0, 31) || 'Supplier', name = base, n = 2;
        while (used[name.toLowerCase()]) { var sfx = ' (' + n++ + ')'; name = base.slice(0, 31 - sfx.length) + sfx; }
        used[name.toLowerCase()] = 1;

        var ws = wb.addWorksheet(name, {
          views: [{ state: 'frozen', ySplit: 3 }],
          pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '3:3' }
        });
        ws.columns = [16, 48, 16, 10, 10, 9, 13, 9].map(function (w) { return { width: w }; });
        ws.getCell('A1').value = s;
        ws.getCell('A1').font = { bold: true, size: 14 };
        ws.getCell('A2').value = (list.length - nNone) + ' ranges · Need ' + need + ' pcs' + (nNone ? ' · ' + nNone + ' with no target fixed (red)' : '') + ' · Stock as of ' + lastImportText();
        ws.getCell('A2').font = { italic: true, color: { argb: 'FF555555' } };

        ws.addTable({
          name: 'Restock' + (si + 1),
          ref: 'A3',
          headerRow: true,
          totalsRow: true,
          style: { theme: 'TableStyleMedium2', showRowStripes: true },
          columns: [
            { name: 'Product Group', totalsRowLabel: 'Total', filterButton: true },
            { name: 'Product Name', filterButton: true },
            { name: 'Code', filterButton: true },
            { name: 'From (g)', filterButton: true },
            { name: 'To (g)', filterButton: true },
            { name: 'Target', totalsRowFunction: 'sum', filterButton: true },
            { name: 'Availability', totalsRowFunction: 'sum', filterButton: true },
            { name: 'Need', totalsRowFunction: 'sum', filterButton: true }
          ],
          rows: list.map(function (o) {
            if (o.none) return [o.p.group, o.p.key, Object.keys(o.p.printNames).join(', '), 'No target fixed', null, null, o.have, null];
            return [o.p.group, o.p.key, Object.keys(o.p.printNames).join(', '), o.r.min_wt, o.r.max_wt, o.r.qty, o.have, o.need];
          })
        });
        // No-target products (listed first) in bold red
        for (var nr = 4; nr < 4 + nNone; nr++) ws.getRow(nr).eachCell({ includeEmpty: true }, function (cell) { cell.font = { bold: true, color: { argb: 'FFC00000' } }; });
        // Need column bold red when something must be ordered
        var last = 3 + list.length;
        ws.addConditionalFormatting({
          ref: 'H4:H' + last,
          rules: [{ type: 'cellIs', operator: 'greaterThan', formulae: [0], priority: 1,
                    style: { font: { bold: true, color: { argb: 'FFC00000' } } } }]
        });
        for (var r = 4; r <= last + 1; r++) {
          ['D', 'E', 'F', 'G', 'H'].forEach(function (c) { ws.getCell(c + r).alignment = { horizontal: 'right' }; });
        }
        ws.getRow(last + 1).font = { bold: true };
      });

      var buf = await wb.xlsx.writeBuffer();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      a.download = 'Restocking-' + (groupSel.value ? groupSel.value.replace(/[^\w.-]+/g, '_') + '-' : '') + C.dateStamp() + '.xlsx';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (err) {
      toast('Export failed: ' + err.message, 'error');
    } finally { btn.disabled = false; }
  });

  // ── Load ──
  async function load() {
    var body = document.querySelector('.body'), top = body.scrollTop;
    try {
      var d = await C.api('/api/restock');
      stockGroups = d.groups; targets = d.targets;
    } catch (err) {
      listEl.innerHTML = '<div class="placeholder">Could not load: ' + esc(err.message) + '</div>';
      return;
    }
    // Targets are fixed; new products stay without a target (red) until set in Setup
    products = C.build(stockGroups, targets);
    fillFilters();
    render();
    body.scrollTop = top;
  }

  load();
})();
</script>

<script src="/pwa.js" defer></script>
<script src="/push-native.js" defer></script>
<script src="/auth.js"></script>
<script src="/theme.js"></script>
<script src="/notify.js"></script>
</body>
