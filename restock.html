<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Restocking · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  :root { --grp-head: #3d9be9; --need: #e5534b; --ok: #3fb950; --warn: #d29922; }

  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { min-height: calc(64px + env(safe-area-inset-top, 0px)); height: auto; flex-shrink: 0; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top, 0px) 28px 0; display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .page-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .theme-btn, .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .15s; flex-shrink: 0; text-decoration: none; }
  .theme-btn:hover, .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-left { display: flex; align-items: center; gap: 12px; }

  .body { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }

  /* ── Toolbar ── */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font: 600 13px 'Inter', sans-serif; color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  .btn.primary:hover { filter: brightness(1.08); color: #111; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .spacer { flex: 1; }
  select.inp, input.inp { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: 500 13px 'Inter', sans-serif; color: var(--text); outline: none; }
  select.inp:focus, input.inp:focus { border-color: var(--accent); }
  #search { width: 240px; }
  .status { font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--need); }
  .data-info { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.6; }
  .data-info b { color: var(--text); font-weight: 600; }

  /* ── Summary tiles ── */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile-lbl { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .tile-val { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; margin-top: 4px; }
  .tile.need .tile-val { color: var(--need); }

  /* ── Group + product table ── */
  .grp { margin-bottom: 22px; }
  .grp-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .grp-title .grp-meta { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; color: var(--text-dim); }
  .grp-title .grp-need { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; color: var(--need); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  table.pt { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.pt > thead th { background: var(--grp-head); color: #fff; font-weight: 600; padding: 9px 10px; text-align: left; white-space: nowrap; }
  table.pt th.num, table.pt td.num { text-align: right; }
  .prow > td { padding: 10px; border-top: 1px solid var(--border); vertical-align: middle; cursor: pointer; }
  .prow:hover > td { background: var(--panel-elev); }
  .prod.open .prow > td { background: var(--panel-elev); }
  .tog { width: 34px; text-align: center; font-size: 17px; font-weight: 600; color: var(--text-dim); user-select: none; }
  .pname { font-weight: 600; }
  .pcode { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .need-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .need-chip { font-size: 11px; font-weight: 700; color: var(--need); background: color-mix(in srgb, var(--need) 12%, transparent); border-radius: 5px; padding: 2px 6px; font-family: 'JetBrains Mono', monospace; }
  .n { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }
  .need-big { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--need); }
  .need-ok { font-size: 18px; font-weight: 700; color: var(--ok); }
  .need-none { font-size: 12px; color: var(--text-dim); font-style: italic; }

  /* ── Product detail ── */
  .drow > td { padding: 4px 16px 18px 44px; background: var(--panel-elev); }
  .detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; }
  .sec-title { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sec-title .sec-sum { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text); font-size: 13px; }
  table.rt { border-collapse: collapse; font-size: 13px; background: var(--panel); border: 1px solid var(--border); width: 100%; }
  table.rt th { background: var(--panel); color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  table.rt td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  table.rt tr:last-child td { border-bottom: none; }
  table.rt input { width: 78px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 7px; font: 600 14px 'JetBrains Mono', monospace; color: var(--text); outline: none; }
  table.rt input.q { width: 58px; }
  table.rt input:focus { border-color: var(--accent); }
  table.rt input.bad { border-color: var(--need); }
  table.rt tr.add-row td { background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
  .icon-btn { background: none; border: 1px solid transparent; border-radius: 6px; width: 30px; height: 30px; color: var(--text-dim); cursor: pointer; font-size: 16px; }
  .icon-btn:hover { color: var(--need); border-color: var(--need); }
  .rt-need { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--need); }
  .rt-ok { font-weight: 700; color: var(--ok); }
  .rt-tot td { font-weight: 700; background: var(--panel-elev); }
  .muted { color: var(--text-dim); font-size: 12px; }
  .calc { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin: -2px 0 8px; }
  .calc b { color: var(--text); }
  .note { font-size: 12px; color: var(--warn); margin-top: 8px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); }
  .chip.out { border-color: var(--warn); color: var(--warn); }
  .chip.sold { background: color-mix(in srgb, var(--grp-head) 12%, var(--panel)); border-color: color-mix(in srgb, var(--grp-head) 35%, var(--border)); }
  .sugg { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
  .sugg-head { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .sugg-row { font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2px 0; }
  .sugg-actions { display: flex; gap: 8px; margin-top: 10px; }

  .placeholder { margin: 70px auto; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.7; max-width: 480px; }

  #printArea { display: none; }

  @media (max-width: 900px) {
    .topbar { padding: 0 16px; }
    .body { padding: 16px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .detail { grid-template-columns: minmax(0, 1fr); }
    .drow > td { padding: 4px 10px 16px; }
    #search { width: 100%; }
    .spacer { display: none; }
  }

  @media print {
    @page { margin: 12mm; }
    html, body { height: auto; overflow: visible; background: #fff; color: #000; }
    .main, #toast { display: none !important; }
    #printArea { display: block; font-family: 'Inter', sans-serif; color: #000; }
    #printArea h1 { font-size: 18px; margin-bottom: 2px; }
    #printArea .pa-sub { font-size: 11px; color: #444; margin-bottom: 12px; }
    #printArea h2 { font-size: 14px; margin: 14px 0 6px; }
    #printArea table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #printArea th, #printArea td { border: 1px solid #999; padding: 5px 7px; text-align: left; }
    #printArea th { background: #eee; }
    #printArea td.num, #printArea th.num { text-align: right; }
    #printArea td.need { font-weight: 700; font-size: 14px; }
    #printArea tr { break-inside: avoid; }
  }
</style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/reorder.html" class="back-btn" title="Back to Reorder" aria-label="Back to Reorder">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="page-title">Restocking</div>
      </div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
    </header>

    <div class="body">
      <div class="toolbar">
        <button class="btn primary" id="uploadBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload Tagging Excel
        </button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
        <select class="inp" id="groupSel" title="Product group"></select>
        <select class="inp" id="showSel" title="Show">
          <option value="all">All products</option>
          <option value="need">Needs restock</option>
          <option value="none">No targets set</option>
          <option value="ok">Fully stocked</option>
        </select>
        <input class="inp" id="search" type="search" placeholder="Search product…" />
        <div class="spacer"></div>
        <button class="btn" id="recalcBtn" type="button" title="Recalculate target ranges of the products shown">↻ Recalculate all</button>
        <button class="btn" id="printBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print restock list
        </button>
        <button class="btn" id="exportBtn" type="button">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export Excel
        </button>
      </div>
      <div class="status" id="status"></div>
      <div class="data-info" id="dataInfo"></div>
      <div class="tiles" id="tiles"></div>
      <div id="list"><div class="placeholder">Loading…</div></div>
    </div>
  </main>

  <div id="printArea"></div>
  <div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  var MAX_BYTES = 15 * 1024 * 1024;
  // Saved item: [tagNo, product, printName, qty, weight, sold(0/1), soldOn, tagDate, supplier]
  var I = { TAG: 0, PRODUCT: 1, PRINT: 2, QTY: 3, WT: 4, SOLD: 5, SOLD_ON: 6, DATE: 7, SUPPLIER: 8 };
  var REQUIRED = ['Tag No', 'Product Group', 'Product', 'Gross Wt', 'Status'];
  var OPTIONAL = ['Tag Print Name', 'Qty', 'Sold On', 'Tag Date', 'Supplier'];

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), statusEl = $('status');
  var groupSel = $('groupSel'), showSel = $('showSel'), searchEl = $('search');

  var stockGroups = [];   // [{ group_name, file_name, uploaded_at, uploaded_by, items }]
  var targets = [];       // [{ id, group_name, product, min_wt, max_wt, qty }]
  var products = {};      // key (product name) → model
  var openKeys = {};      // products expanded in the UI
  var suggestions = {};   // product key → suggested ranges being previewed

  // ── Helpers ──
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(v) { return String(v == null ? '' : v).trim().toLowerCase(); }
  function toNum(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function fmtG(n) { return (Math.round(n * 1000) / 1000).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }
  function fmtInt(n) { return Number(n).toLocaleString('en-IN'); }
  function fmtWhen(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' +
           d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  // "dd/mm/yyyy" → sortable number
  function dmyKey(s) { var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || '')); return m ? (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0; }
  var byNatural = function (a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); };
  function rangeLabel(r) { return fmtG(r.min_wt) + '–' + fmtG(r.max_wt) + ' g'; }

  function setStatus(msg, ok) { statusEl.textContent = msg || ''; statusEl.className = 'status ' + (ok ? 'ok' : 'err'); }
  function toast(msg) {
    if (typeof window.toast === 'function') return window.toast(msg, 'success');
    setStatus(msg, true);
    clearTimeout(toast._t); toast._t = setTimeout(function () { setStatus(''); }, 2500);
  }

  async function api(url, opts) {
    var r = await fetch(url, opts);
    var body = await r.json().catch(function () { return null; });
    if (r.status === 401) { location.href = '/login.html'; throw new Error('Session expired'); }
    if (!r.ok) throw new Error((body && body.error) || 'HTTP ' + r.status);
    return body;
  }
  function jsonOpts(method, data) {
    return { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) };
  }

  // ── Excel → items per group ──
  function parseTagging(rows) {
    var hr = -1;
    for (var i = 0; i < Math.min(rows.length, 20); i++) {
      var cells = rows[i].map(norm);
      if (cells.indexOf('tag no') !== -1 && cells.indexOf('product group') !== -1) { hr = i; break; }
    }
    if (hr === -1) return { error: 'Not a Tagging file — "Tag No" and "Product Group" headings not found.' };
    var heads = rows[hr].map(norm);
    var col = {};
    REQUIRED.concat(OPTIONAL).forEach(function (h) { col[h] = heads.indexOf(norm(h)); });
    var missing = REQUIRED.filter(function (h) { return col[h] === -1; });
    if (missing.length) return { error: 'Missing column(s): ' + missing.join(', ') + '.' };
    var get = function (row, h) { return col[h] === -1 ? '' : String(row[col[h]] == null ? '' : row[col[h]]).trim(); };

    var groups = {}, count = 0;
    for (var r = hr + 1; r < rows.length; r++) {
      var row = rows[r];
      var tag = get(row, 'Tag No');
      if (!tag || tag.toLowerCase() === 'total') continue;   // skip the export's Total row
      var g = get(row, 'Product Group') || '(No group)';
      var qty = Math.max(1, Math.round(toNum(get(row, 'Qty'))) || 1);
      (groups[g] = groups[g] || []).push([
        tag,
        get(row, 'Product') || '(No product)',
        get(row, 'Tag Print Name'),
        qty,
        toNum(get(row, 'Gross Wt')),
        get(row, 'Status').toUpperCase() === 'SOLD' ? 1 : 0,
        get(row, 'Sold On'),
        get(row, 'Tag Date'),
        get(row, 'Supplier')
      ]);
      count++;
    }
    if (!count) return { error: 'No tagged items found in this file.' };
    return { groups: groups, count: count };
  }

  $('uploadBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function () {
    var input = this, file = input.files[0];
    input.value = '';
    if (!file) return;
    if (!/\.(xlsx|xls)$/i.test(file.name)) return setStatus('Only .xlsx or .xls files are allowed.');
    if (file.size > MAX_BYTES) return setStatus('File is larger than 15 MB.');
    var reader = new FileReader();
    reader.onload = async function (e) {
      var parsed;
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false, defval: '', raw: false });
        parsed = parseTagging(rows);
      } catch (ex) {
        return setStatus('Could not read this file. Make sure it is a valid Excel file.');
      }
      if (parsed.error) return setStatus(parsed.error);
      var names = Object.keys(parsed.groups).sort(byNatural);
      if (!(await window.confirmModal('This file has ' + fmtInt(parsed.count) + ' tags in ' + names.length + ' group(s):\n\n' +
                   names.join(', ') + '\n\nStock data for these groups will be replaced. Other groups stay as they are.'))) return;
      var btn = $('uploadBtn');
      btn.disabled = true;
      setStatus('Saving…', true);
      try {
        await api('/api/restock/upload', jsonOpts('POST', { file_name: file.name, groups: parsed.groups }));
        setStatus('Uploaded ' + file.name + ' — ' + names.length + ' group(s) updated.', true);
        await load();
        if (names.length === 1) { groupSel.value = names[0]; render(); }
      } catch (err) {
        setStatus('Upload failed: ' + err.message);
      } finally { btn.disabled = false; }
    };
    reader.onerror = function () { setStatus('Could not read this file.'); };
    reader.readAsArrayBuffer(file);
  });

  // ── Model ──
  function build() {
    products = {};
    function get(key, group) {
      return products[key] || (products[key] = { key: key, group: group, printNames: {}, stock: [], sold: [], ranges: [] });
    }
    stockGroups.forEach(function (sg) {
      sg.items.forEach(function (it) {
        var p = get(it[I.PRODUCT], sg.group_name);
        if (it[I.PRINT]) p.printNames[it[I.PRINT]] = 1;
        var per = it[I.WT] / (it[I.QTY] || 1);
        for (var k = 0; k < (it[I.QTY] || 1); k++) {
          var piece = { tag: it[I.TAG], wt: per, soldOn: it[I.SOLD_ON], date: it[I.DATE], supplier: it[I.SUPPLIER] };
          (it[I.SOLD] ? p.sold : p.stock).push(piece);
        }
      });
    });
    targets.forEach(function (t) { get(t.product, t.group_name).ranges.push(t); });
    Object.keys(products).forEach(function (k) { compute(products[k]); });
  }

  // Each in-stock piece fills the first range its weight falls in.
  function compute(p) {
    p.ranges.sort(function (a, b) { return a.min_wt - b.min_wt || a.max_wt - b.max_wt; });
    p.stock.sort(function (a, b) { return a.wt - b.wt; });
    p.sold.sort(function (a, b) { return a.wt - b.wt; });
    var have = p.ranges.map(function () { return 0; });
    p.outside = [];
    p.stock.forEach(function (s) {
      var w = Math.round(s.wt * 1000) / 1000;
      var i = p.ranges.findIndex(function (r) { return w >= r.min_wt && w <= r.max_wt; });
      if (i === -1) { p.outside.push(s); s.inRange = false; } else { have[i]++; s.inRange = true; }
    });
    p.rangeStats = p.ranges.map(function (r, i) { return { r: r, have: have[i], need: Math.max(0, r.qty - have[i]) }; });
    p.target = p.ranges.reduce(function (s, r) { return s + r.qty; }, 0);
    p.need = p.rangeStats.reduce(function (s, x) { return s + x.need; }, 0);
    p.state = !p.ranges.length ? 'none' : p.need > 0 ? 'need' : 'ok';
  }

  // ── Auto-calculate target ranges ──
  // How many to keep: pieces sold in the last 180 days → sales per month,
  // × COVER_MONTHS of stock, kept within 1..10.
  // Which weights: sold weights are grouped into ranges; each sale scores more
  // when it is recent (Sold On) and when it sold fast (Sold On − Tag Date),
  // and the total qty is shared across ranges by score.
  // Never sold → one piece around the in-stock weights.
  var COVER_MONTHS = 1.5, RATE_DAYS = 180, MAX_TARGET = 10;
  var DAY = 86400000;
  function dmyDate(s) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || ''));
    return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : null;
  }
  function median(a) {
    if (!a.length) return null;
    var s = a.slice().sort(function (x, y) { return x - y; }), h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  }
  function suggest(p) {
    var now = Date.now();
    var sold = p.sold.filter(function (s) { return s.wt > 0; });
    var points, total, info;
    if (sold.length) {
      var recent = 0, speeds = [];
      points = sold.map(function (s) {
        var so = dmyDate(s.soldOn), td = dmyDate(s.date);
        var age = so != null ? (now - so) / DAY : null;
        var dts = so != null && td != null ? Math.max(0, (so - td) / DAY) : null;
        if (age != null && age <= RATE_DAYS) recent++;
        if (dts != null) speeds.push(dts);
        var rec = age == null ? 0.3 : age <= 90 ? 1 : age <= 180 ? 0.6 : age <= 365 ? 0.35 : 0.15;
        var spd = dts == null ? 1 : dts <= 15 ? 1.5 : dts <= 45 ? 1.2 : dts <= 90 ? 1 : 0.7;
        return { wt: s.wt, score: rec * spd };
      });
      var perMonth = recent / (RATE_DAYS / 30);
      total = Math.min(MAX_TARGET, Math.max(1, Math.round(perMonth * COVER_MONTHS)));
      info = { basis: 'sold', sold: sold.length, recent: recent, perMonth: perMonth, medianDays: median(speeds), total: total };
    } else {
      points = p.stock.filter(function (s) { return s.wt > 0; }).map(function (s) { return { wt: s.wt, score: 1 }; });
      if (!points.length) return null;
      total = 1;
      info = { basis: 'stock', sold: 0, total: 1 };
    }
    points.sort(function (a, b) { return a.wt - b.wt; });

    // Group neighbouring weights; start a new range on a gap or when it gets too wide to order from
    var clusters = [[points[0]]];
    for (var i = 1; i < points.length; i++) {
      var prev = points[i - 1].wt, start = clusters[clusters.length - 1][0].wt, w = points[i].wt;
      if (w - prev > Math.max(6, prev * 0.07) || w - start > Math.max(10, start * 0.1)) clusters.push([]);
      clusters[clusters.length - 1].push(points[i]);
    }
    // Share `total` across ranges by score (largest remainder, so it adds up exactly)
    var cs = clusters.map(function (c) {
      return { lo: c[0].wt, hi: c[c.length - 1].wt, score: c.reduce(function (s, x) { return s + x.score; }, 0) };
    });
    var sum = cs.reduce(function (s, c) { return s + c.score; }, 0) || 1;
    cs.forEach(function (c) { var exact = c.score / sum * total; c.qty = Math.floor(exact); c.rem = exact - c.qty; });
    var left = total - cs.reduce(function (s, c) { return s + c.qty; }, 0);
    cs.slice().sort(function (a, b) { return b.rem - a.rem || b.score - a.score; }).slice(0, left).forEach(function (c) { c.qty++; });
    var out = cs.filter(function (c) { return c.qty > 0; });

    var ranges = out.map(function (c) { return { min_wt: Math.max(0, Math.floor(c.lo) - 2), max_wt: Math.ceil(c.hi) + 2, qty: c.qty, lo: c.lo, hi: c.hi }; });
    for (var k = 1; k < ranges.length; k++) {
      if (ranges[k].min_wt <= ranges[k - 1].max_wt) {
        var mid = Math.round((ranges[k - 1].hi + ranges[k].lo) / 2);
        ranges[k - 1].max_wt = mid;
        ranges[k].min_wt = mid + 1 <= ranges[k].lo ? mid + 1 : mid;
      }
    }
    return { info: info, ranges: ranges.map(function (r) { return { min_wt: r.min_wt, max_wt: r.max_wt, qty: r.qty }; }) };
  }

  function calcText(info) {
    if (!info) return 'No sold or in-stock weights to calculate from.';
    if (info.basis === 'stock') return 'Never sold in the uploaded data → keep 1 piece around the in-stock weight.';
    var t = info.recent + ' sold in last ' + RATE_DAYS + ' days → ' + (Math.round(info.perMonth * 10) / 10) + ' per month × ' +
            COVER_MONTHS + ' months = <b>' + info.total + (info.total === 1 ? ' pc' : ' pcs') + '</b>' + (info.total === MAX_TARGET ? ' (max ' + MAX_TARGET + ')' : info.total === 1 && info.perMonth * COVER_MONTHS < 1 ? ' (min 1)' : '');
    if (info.medianDays != null) t += ' · usually sells in <b>' + Math.round(info.medianDays) + ' days</b>';
    t += ' · ' + info.sold + ' sold in total';
    return t;
  }

  // Fill ranges for every product that has none (and was never auto-filled),
  // or with replace=true recalculate the given products.
  async function autoFill(list, replace) {
    var items = [];
    list.forEach(function (p) {
      if (!replace && p.ranges.length) return;
      var s = suggest(p);
      if (s && s.ranges.length) items.push({ group_name: p.group, product: p.key, ranges: s.ranges });
    });
    if (!items.length) return 0;
    var res = await api('/api/restock/auto-fill', jsonOpts('POST', { replace: !!replace, items: items }));
    return res.filled;
  }

  // ── Filters ──
  function visibleProducts() {
    var g = groupSel.value, show = showSel.value, q = norm(searchEl.value);
    return Object.keys(products).map(function (k) { return products[k]; }).filter(function (p) {
      if (g && p.group !== g) return false;
      if (show !== 'all' && p.state !== show) return false;
      if (q && norm(p.key).indexOf(q) === -1 && Object.keys(p.printNames).join(' ').toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function fillGroupSel() {
    var cur = groupSel.value;
    var names = {};
    Object.keys(products).forEach(function (k) { names[products[k].group] = 1; });
    var list = Object.keys(names).sort(byNatural);
    groupSel.innerHTML = '<option value="">All groups (' + list.length + ')</option>' +
      list.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    if (list.indexOf(cur) !== -1) groupSel.value = cur;
  }

  // ── Render ──
  function render() {
    var info = stockGroups.slice().sort(function (a, b) { return byNatural(a.group_name, b.group_name); });
    $('dataInfo').innerHTML = info.length
      ? 'Stock data: ' + info.map(function (g) { return '<b>' + esc(g.group_name) + '</b> (' + esc(fmtWhen(g.uploaded_at)) + ')'; }).join(' · ')
      : '';

    var vis = visibleProducts();
    var tNeed = 0, tShort = 0, tSet = 0;
    vis.forEach(function (p) { tNeed += p.need; if (p.need > 0) tShort++; if (p.ranges.length) tSet++; });
    $('tiles').innerHTML =
      tile('Products', fmtInt(vis.length)) +
      tile('Targets set', fmtInt(tSet)) +
      tile('Products short', fmtInt(tShort)) +
      tile('Pieces to order', fmtInt(tNeed), 'need');

    if (!stockGroups.length && !targets.length) {
      listEl.innerHTML = '<div class="placeholder">No stock data yet.<br>Click <b>Upload Tagging Excel</b> and choose the Tagging export.<br>' +
        'You can upload one group at a time or all groups in one file.</div>';
      return;
    }
    if (!vis.length) { listEl.innerHTML = '<div class="placeholder">No products match these filters.</div>'; return; }

    var byGroup = {};
    vis.forEach(function (p) { (byGroup[p.group] = byGroup[p.group] || []).push(p); });
    var order = { need: 0, none: 1, ok: 2 };
    listEl.innerHTML = Object.keys(byGroup).sort(byNatural).map(function (g) {
      var ps = byGroup[g].sort(function (a, b) { return order[a.state] - order[b.state] || b.need - a.need || byNatural(a.key, b.key); });
      var gNeed = ps.reduce(function (s, p) { return s + p.need; }, 0);
      return '<div class="grp"><div class="grp-title">' + esc(g) +
        '<span class="grp-meta">' + ps.length + ' products</span>' +
        (gNeed ? '<span class="grp-need">' + fmtInt(gNeed) + ' to order</span>' : '') + '</div>' +
        '<div class="tbl-wrap"><table class="pt"><thead><tr><th class="tog"></th><th>Product</th>' +
        '<th class="num">In stock</th><th class="num">Sold</th><th class="num">Target</th><th class="num">Need</th></tr></thead>' +
        ps.map(productBody).join('') + '</table></div></div>';
    }).join('');
  }

  function tile(lbl, val, cls) {
    return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="tile-lbl">' + lbl + '</div><div class="tile-val">' + val + '</div></div>';
  }

  function productBody(p) {
    var open = !!openKeys[p.key];
    var codes = Object.keys(p.printNames).sort(byNatural).join(', ');
    var chips = p.rangeStats.filter(function (x) { return x.need > 0; }).map(function (x) {
      return '<span class="need-chip">' + esc(rangeLabel(x.r)) + ' × ' + x.need + '</span>';
    }).join('');
    var needCell = p.state === 'none' ? '<span class="need-none">No target</span>'
                 : p.need > 0 ? '<span class="need-big">' + fmtInt(p.need) + '</span>'
                 : '<span class="need-ok">✓</span>';
    return '<tbody class="prod' + (open ? ' open' : '') + '" data-key="' + esc(p.key) + '">' +
      '<tr class="prow"><td class="tog">' + (open ? '−' : '+') + '</td>' +
      '<td><div class="pname">' + esc(p.key) + '</div>' + (codes ? '<div class="pcode">' + esc(codes) + '</div>' : '') +
        (chips ? '<div class="need-chips">' + chips + '</div>' : '') + '</td>' +
      '<td class="num"><span class="n">' + fmtInt(p.stock.length) + '</span></td>' +
      '<td class="num"><span class="n">' + fmtInt(p.sold.length) + '</span></td>' +
      '<td class="num"><span class="n">' + (p.ranges.length ? fmtInt(p.target) : '—') + '</span></td>' +
      '<td class="num">' + needCell + '</td></tr>' +
      (open ? '<tr class="drow"><td colspan="6">' + detailHtml(p) + '</td></tr>' : '') +
      '</tbody>';
  }

  function detailHtml(p) {
    var rows = p.rangeStats.map(function (x) {
      var r = x.r;
      return '<tr data-id="' + r.id + '">' +
        '<td><input data-f="min_wt" inputmode="decimal" value="' + esc(fmtPlain(r.min_wt)) + '"></td>' +
        '<td><input data-f="max_wt" inputmode="decimal" value="' + esc(fmtPlain(r.max_wt)) + '"></td>' +
        '<td><input class="q" data-f="qty" inputmode="numeric" value="' + r.qty + '"></td>' +
        '<td class="num"><span class="n">' + x.have + '</span></td>' +
        '<td class="num">' + (x.need ? '<span class="rt-need">' + x.need + '</span>' : '<span class="rt-ok">✓</span>') + '</td>' +
        '<td><button class="icon-btn" data-act="del" title="Delete range" aria-label="Delete range">🗑</button></td></tr>';
    }).join('');
    var tot = p.ranges.length
      ? '<tr class="rt-tot"><td colspan="2">Total</td><td><span class="n">' + p.target + '</span></td><td class="num"><span class="n">' +
        (p.stock.length - p.outside.length) + '</span></td><td class="num">' + (p.need ? '<span class="rt-need">' + p.need + '</span>' : '<span class="rt-ok">✓</span>') + '</td><td></td></tr>'
      : '';
    var add = '<tr class="add-row">' +
      '<td><input data-n="min_wt" inputmode="decimal" placeholder="From"></td>' +
      '<td><input data-n="max_wt" inputmode="decimal" placeholder="To"></td>' +
      '<td><input class="q" data-n="qty" inputmode="numeric" placeholder="Qty"></td>' +
      '<td colspan="3"><button class="btn small" data-act="add">+ Add range</button></td></tr>';

    var sg = suggestions[p.key];
    var suggHtml = '';
    if (sg) {
      suggHtml = '<div class="sugg"><div class="sugg-head">Recalculated from the latest data:</div>' +
        sg.ranges.map(function (r) { return '<div class="sugg-row">' + esc(rangeLabel(r)) + ' × ' + r.qty + '</div>'; }).join('') +
        '<div class="sugg-actions"><button class="btn small primary" data-act="use-sugg">Use these ranges</button>' +
        '<button class="btn small" data-act="cancel-sugg">Cancel</button></div></div>';
    }

    var soldWt = p.sold.reduce(function (s, x) { return s + x.wt; }, 0);
    var stockWt = p.stock.reduce(function (s, x) { return s + x.wt; }, 0);

    return '<div class="detail"><div>' +
        '<div class="sec-title">Target weight ranges <button class="btn small" data-act="suggest">↻ Recalculate</button></div>' +
        '<div class="calc">' + calcText((suggest(p) || {}).info) + '</div>' +
        '<table class="rt"><thead><tr><th>From (g)</th><th>To (g)</th><th>Qty</th><th class="num">Have</th><th class="num">Need</th><th></th></tr></thead>' +
        '<tbody>' + rows + tot + add + '</tbody></table>' +
        (p.ranges.length && p.outside.length ? '<div class="note">' + p.outside.length + ' in-stock piece(s) outside every range: ' +
          p.outside.map(function (s) { return fmtG(s.wt) + ' g'; }).join(', ') + '</div>' : '') +
        suggHtml +
      '</div><div>' +
        '<div class="sec-title">Sold <span class="sec-sum">' + fmtInt(p.sold.length) + ' pcs · ' + fmtG(soldWt) + ' g</span></div>' +
        (p.sold.length ? '<div class="chips">' + p.sold.map(function (s) {
          return '<span class="chip sold" title="' + esc(s.tag + (s.soldOn ? ' · sold ' + s.soldOn : '')) + '">' + fmtG(s.wt) + '</span>';
        }).join('') + '</div>' : '<div class="muted">None sold in the uploaded data.</div>') +
        '<div class="sec-title">In stock <span class="sec-sum">' + fmtInt(p.stock.length) + ' pcs · ' + fmtG(stockWt) + ' g</span></div>' +
        (p.stock.length ? '<div class="chips">' + p.stock.map(function (s) {
          return '<span class="chip' + (p.ranges.length && !s.inRange ? ' out' : '') + '" title="' + esc(s.tag + (s.date ? ' · tagged ' + s.date : '') + (s.supplier ? ' · ' + s.supplier : '')) + '">' + fmtG(s.wt) + '</span>';
        }).join('') + '</div>' : '<div class="muted">Nothing in stock.</div>') +
      '</div></div>';
  }
  function fmtPlain(n) { return String(Math.round(n * 1000) / 1000); }

  // Re-render one product (keeps the rest of the page, scroll and focus)
  function refreshProduct(key, focus) {
    var p = products[key];
    var tb = findBody(key);
    if (!p || !tb) return render();
    compute(p);
    var tmp = document.createElement('table');
    tmp.innerHTML = productBody(p);
    var nb = tmp.querySelector('tbody');
    tb.replaceWith(nb);
    if (focus) {
      var el = nb.querySelector(focus);
      if (el) { el.focus(); if (el.select) el.select(); }
    }
    refreshTotals();
  }
  function refreshTotals() {
    var vis = visibleProducts();
    var tNeed = 0, tShort = 0, tSet = 0;
    vis.forEach(function (p) { tNeed += p.need; if (p.need > 0) tShort++; if (p.ranges.length) tSet++; });
    $('tiles').innerHTML = tile('Products', fmtInt(vis.length)) + tile('Targets set', fmtInt(tSet)) +
      tile('Products short', fmtInt(tShort)) + tile('Pieces to order', fmtInt(tNeed), 'need');
    listEl.querySelectorAll('.grp').forEach(function (gEl) {
      var gNeed = 0;
      gEl.querySelectorAll('tbody.prod').forEach(function (tb) { var p = products[tb.dataset.key]; if (p) gNeed += p.need; });
      var span = gEl.querySelector('.grp-need');
      if (gNeed) {
        if (!span) { span = document.createElement('span'); span.className = 'grp-need'; gEl.querySelector('.grp-title').appendChild(span); }
        span.textContent = fmtInt(gNeed) + ' to order';
      } else if (span) span.remove();
    });
  }
  function findBody(key) {
    var all = listEl.querySelectorAll('tbody.prod');
    for (var i = 0; i < all.length; i++) if (all[i].dataset.key === key) return all[i];
    return null;
  }

  // ── Events ──
  listEl.addEventListener('click', async function (e) {
    var tb = e.target.closest('tbody.prod');
    if (!tb) return;
    var key = tb.dataset.key, p = products[key];

    if (e.target.closest('.prow')) {
      if (openKeys[key]) delete openKeys[key]; else openKeys[key] = 1;
      refreshProduct(key);
      return;
    }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    var a = act.dataset.act;

    if (a === 'del') {
      var id = Number(act.closest('tr').dataset.id);
      var r = p.ranges.find(function (x) { return x.id === id; });
      if (!(await window.confirmModal('Delete range ' + rangeLabel(r) + ' × ' + r.qty + '?'))) return;
      try {
        await api('/api/restock/targets/' + id, { method: 'DELETE' });
        targets = targets.filter(function (x) { return x.id !== id; });
        p.ranges = p.ranges.filter(function (x) { return x.id !== id; });
        refreshProduct(key);
        toast('Range deleted');
      } catch (err) { window.toast('Delete failed: ' + err.message, 'error'); }
    }

    if (a === 'add') {
      var row = act.closest('tr');
      var v = {};
      ['min_wt', 'max_wt', 'qty'].forEach(function (f) { v[f] = row.querySelector('[data-n="' + f + '"]').value.trim(); });
      var data = { group_name: p.group, product: key, min_wt: toNum(v.min_wt), max_wt: toNum(v.max_wt), qty: parseInt(v.qty, 10) };
      var err = validate(data, v);
      if (err) return window.toast(err, 'error');
      try {
        var res = await api('/api/restock/targets', jsonOpts('POST', data));
        var t = { id: res.id, group_name: p.group, product: key, min_wt: data.min_wt, max_wt: data.max_wt, qty: data.qty };
        targets.push(t); p.ranges.push(t);
        refreshProduct(key, '[data-n="min_wt"]');
        toast('Range added');
      } catch (err2) { window.toast('Could not add: ' + err2.message, 'error'); }
    }

    if (a === 'suggest') {
      var s = suggest(p);
      if (!s || !s.ranges.length) return window.toast('No sold or in-stock weights for this product yet — add ranges by hand.', 'error');
      suggestions[key] = s;
      refreshProduct(key);
    }
    if (a === 'cancel-sugg') { delete suggestions[key]; refreshProduct(key); }
    if (a === 'use-sugg') {
      var sg = suggestions[key];
      if (p.ranges.length && !(await window.confirmModal('Replace the ' + p.ranges.length + ' existing range(s) of this product with the recalculated ones?'))) return;
      try {
        await api('/api/restock/product-targets', jsonOpts('PUT', { group_name: p.group, product: key, ranges: sg.ranges }));
        delete suggestions[key];
        await load(true);
        toast('Ranges saved');
      } catch (err3) { window.toast('Could not save: ' + err3.message, 'error'); }
    }
  });

  // Enter in the add row = Add
  listEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var row = e.target.closest('tr.add-row');
    if (row) { e.preventDefault(); row.querySelector('[data-act="add"]').click(); }
    else if (e.target.matches('input[data-f]')) e.target.blur();
  });

  // Editing an existing range saves when the field is left
  listEl.addEventListener('change', async function (e) {
    var inp = e.target.closest('input[data-f]');
    if (!inp) return;
    var tr = inp.closest('tr'), tb = inp.closest('tbody.prod');
    var key = tb.dataset.key, p = products[key], id = Number(tr.dataset.id);
    var r = p.ranges.find(function (x) { return x.id === id; });
    var v = {};
    ['min_wt', 'max_wt', 'qty'].forEach(function (f) { v[f] = tr.querySelector('[data-f="' + f + '"]').value.trim(); });
    var data = { group_name: p.group, product: key, min_wt: toNum(v.min_wt), max_wt: toNum(v.max_wt), qty: parseInt(v.qty, 10) };
    var err = validate(data, v);
    if (err) { inp.classList.add('bad'); toast(err); return; }
    inp.classList.remove('bad');
    // Where focus went next (Tab), so it can be restored after the re-render
    var next = document.activeElement && document.activeElement !== inp && tb.contains(document.activeElement) ? document.activeElement : null;
    var focusSel = next && next.dataset.f ? 'tr[data-id="' + next.closest('tr').dataset.id + '"] [data-f="' + next.dataset.f + '"]'
                 : next && next.dataset.n ? '[data-n="' + next.dataset.n + '"]' : null;
    try {
      await api('/api/restock/targets/' + id, jsonOpts('PUT', data));
      r.min_wt = data.min_wt; r.max_wt = data.max_wt; r.qty = data.qty;
      refreshProduct(key, focusSel);
      toast('Saved');
    } catch (err2) { inp.classList.add('bad'); window.toast('Could not save: ' + err2.message, 'error'); }
  });

  function validate(d, raw) {
    if (raw.min_wt === '' || raw.max_wt === '' || raw.qty === '') return 'Fill From, To and Qty.';
    if (!(d.max_wt > 0) || d.min_wt < 0) return 'Enter valid weights.';
    if (d.min_wt > d.max_wt) return '"From" weight must not be more than "To" weight.';
    if (!Number.isInteger(d.qty) || d.qty < 1 || d.qty > 999) return 'Qty must be a whole number from 1 to 999.';
    return '';
  }

  groupSel.addEventListener('change', render);
  showSel.addEventListener('change', render);
  searchEl.addEventListener('input', function () { clearTimeout(searchEl._t); searchEl._t = setTimeout(render, 150); });

  // ── Restock list (print + Excel) ──
  function restockRows() {
    var out = [];
    visibleProducts().sort(function (a, b) { return byNatural(a.group, b.group) || byNatural(a.key, b.key); }).forEach(function (p) {
      p.rangeStats.forEach(function (x) {
        if (x.need > 0) out.push({ p: p, x: x });
      });
    });
    return out;
  }
  function filterLabel() {
    var parts = [groupSel.value || 'All groups'];
    if (showSel.value !== 'all') parts.push(showSel.options[showSel.selectedIndex].text);
    if (searchEl.value.trim()) parts.push('search "' + searchEl.value.trim() + '"');
    return parts.join(' · ');
  }

  $('printBtn').addEventListener('click', function () {
    var rows = restockRows();
    if (!rows.length) return window.toast('Nothing to restock for the current filter.', 'error');
    var byG = {};
    rows.forEach(function (o) { (byG[o.p.group] = byG[o.p.group] || []).push(o); });
    var total = rows.reduce(function (s, o) { return s + o.x.need; }, 0);
    var now = new Date();
    var html = '<h1>Restock List</h1><div class="pa-sub">' + esc(filterLabel()) + ' · ' +
      esc(now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })) +
      ' · Total to order: <b>' + total + ' pcs</b></div>';
    Object.keys(byG).sort(byNatural).forEach(function (g) {
      var gTot = byG[g].reduce(function (s, o) { return s + o.x.need; }, 0);
      html += '<h2>' + esc(g) + ' — ' + gTot + ' pcs</h2><table><thead><tr><th>Product</th><th>Code</th><th>Weight range</th>' +
        '<th class="num">Target</th><th class="num">In stock</th><th class="num">Order</th></tr></thead><tbody>';
      byG[g].forEach(function (o) {
        html += '<tr><td>' + esc(o.p.key) + '</td><td>' + esc(Object.keys(o.p.printNames).join(', ')) + '</td><td>' + esc(rangeLabel(o.x.r)) + '</td>' +
          '<td class="num">' + o.x.r.qty + '</td><td class="num">' + o.x.have + '</td><td class="num need">' + o.x.need + '</td></tr>';
      });
      html += '</tbody></table>';
    });
    $('printArea').innerHTML = html;
    window.print();
  });

  $('exportBtn').addEventListener('click', function () {
    var vis = visibleProducts().sort(function (a, b) { return byNatural(a.group, b.group) || byNatural(a.key, b.key); });
    if (!vis.length) return window.toast('No products to export.', 'error');
    var list = [['Group', 'Product', 'Code', 'From (g)', 'To (g)', 'Target', 'In stock', 'Order']];
    restockRows().forEach(function (o) {
      list.push([o.p.group, o.p.key, Object.keys(o.p.printNames).join(', '), o.x.r.min_wt, o.x.r.max_wt, o.x.r.qty, o.x.have, o.x.need]);
    });
    var all = [['Group', 'Product', 'Code', 'From (g)', 'To (g)', 'Target', 'In stock', 'Need']];
    var sold = [['Group', 'Product', 'Code', 'In stock', 'In-stock weights (g)', 'Sold', 'Sold weights (g)', 'Pieces outside ranges (g)']];
    vis.forEach(function (p) {
      var code = Object.keys(p.printNames).join(', ');
      if (!p.ranges.length) all.push([p.group, p.key, code, '', '', '', p.stock.length, 'No target']);
      p.rangeStats.forEach(function (x) { all.push([p.group, p.key, code, x.r.min_wt, x.r.max_wt, x.r.qty, x.have, x.need]); });
      sold.push([p.group, p.key, code, p.stock.length, p.stock.map(function (s) { return fmtPlain(s.wt); }).join(', '),
        p.sold.length, p.sold.map(function (s) { return fmtPlain(s.wt); }).join(', '),
        p.outside.map(function (s) { return fmtPlain(s.wt); }).join(', ')]);
    });
    var wb = XLSX.utils.book_new();
    [['Restock List', list, [14, 48, 16, 9, 9, 8, 9, 8]],
     ['All Targets', all, [14, 48, 16, 9, 9, 8, 9, 10]],
     ['Weights', sold, [14, 48, 16, 9, 40, 7, 60, 30]]].forEach(function (s) {
      var ws = XLSX.utils.aoa_to_sheet(s[1]);
      ws['!cols'] = s[2].map(function (w) { return { wch: w }; });
      XLSX.utils.book_append_sheet(wb, ws, s[0]);
    });
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    XLSX.writeFile(wb, 'Restock-' + (groupSel.value ? groupSel.value.replace(/[^\w.-]+/g, '_') + '-' : '') + stamp + '.xlsx');
  });

  // ── Load ──
  async function load(keepScroll, skipAuto) {
    var body = document.querySelector('.body'), top = body.scrollTop;
    try {
      var d = await api('/api/restock');
      stockGroups = d.groups; targets = d.targets;
    } catch (err) {
      listEl.innerHTML = '<div class="placeholder">Could not load: ' + esc(err.message) + '</div>';
      return;
    }
    build();
    // New products (first load, or after an upload) get their ranges calculated automatically
    if (!skipAuto) {
      try {
        var filled = await autoFill(Object.keys(products).map(function (k) { return products[k]; }), false);
        if (filled) { toast('Targets calculated for ' + filled + ' product(s)'); return load(keepScroll, true); }
      } catch (err) { setStatus('Auto-calculation failed: ' + err.message); }
    }
    fillGroupSel();
    render();
    if (keepScroll) body.scrollTop = top;
  }

  $('recalcBtn').addEventListener('click', async function () {
    var vis = visibleProducts();
    if (!vis.length) return window.toast('No products to recalculate.', 'error');
    if (!(await window.confirmModal('Recalculate the target ranges of ' + vis.length + ' product(s) shown (' + filterLabel() +
        ') from the latest sales data?\n\nTheir current ranges, including your edits, will be replaced.', { danger: true }))) return;
    var btn = this;
    btn.disabled = true;
    try {
      var n = await autoFill(vis, true);
      await load(true, true);
      toast('Recalculated ' + n + ' product(s)');
    } catch (err) { window.toast('Recalculate failed: ' + err.message, 'error'); }
    finally { btn.disabled = false; }
  });

  load();
})();
</script>

<script src="/pwa.js" defer></script>
<script src="/push-native.js" defer></script>
<script src="/auth.js"></script>
<script src="/theme.js"></script>
<script src="/notify.js"></script>
</body>
