<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Billing · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/nav.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }
  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { min-height: calc(64px + env(safe-area-inset-top, 0px)); height: auto; flex-shrink: 0; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top, 0px) 28px 0; display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .page-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .theme-btn, .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .15s; flex-shrink: 0; text-decoration: none; }
  .theme-btn:hover, .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-left { display: flex; align-items: center; gap: 12px; }

  /* ── Rate board (Billing app's live gold/silver rate) ──
     Currency figures, so legibility beats compactness: large tabular-figure
     numerals, bold weight, high-contrast color — not the small dim badge
     style used for icon buttons elsewhere on this topbar. */
  .rate-board { display: flex; align-items: stretch; gap: 16px; padding: 6px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-elev); flex-shrink: 0; }
  .rb-pair { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
  .rb-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .rb-label.rb-gold-label { color: #b8973a; }
  .rb-label.rb-silver-label { color: #6b7684; }
  .rb-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .rb-value::before { content: '₹'; font-weight: 700; opacity: .7; margin-right: 1px; }
  .rb-divider { width: 1px; align-self: stretch; background: var(--border); }

  @media (max-width: 480px) {
    .rate-board { gap: 12px; padding: 5px 12px; }
    .rb-value { font-size: 16px; }
  }

  .billing-body { flex: 1; overflow-y: auto; padding: 40px 32px; }
  .empty-state { max-width: 420px; margin: 60px auto; text-align: center; }
  .empty-state .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.6; }
  .empty-state h2 { font-family: 'Fraunces', serif; font-size: 20px; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 13px; color: var(--text-dim); line-height: 1.6; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none !important; }
    .topbar { padding: 0 16px; }
    .billing-body { padding: 24px 16px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ═══════ MAIN SIDEBAR ═══════ -->
  <aside class="sidebar" id="sidebar-mount"></aside>

  <!-- ═══════ MAIN ═══════ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/" class="back-btn" title="Back to Dashboard" aria-label="Back to Dashboard">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="page-title">Billing</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="rate-board" id="rateBoard" title="Today's rate">
          <div class="rb-pair">
            <span class="rb-label rb-gold-label">Gold</span>
            <span class="rb-value" id="rbGoldVal">—</span>
          </div>
          <div class="rb-divider"></div>
          <div class="rb-pair">
            <span class="rb-label rb-silver-label">Silver</span>
            <span class="rb-value" id="rbSilverVal">—</span>
          </div>
        </div>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
      </div>
    </header>

    <div class="billing-body">
      <div class="empty-state">
        <div class="icon">&#128179;</div>
        <h2>Billing</h2>
        <p>Billing tools will appear here.</p>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
// Today's gold/silver rate, proxied server-side from the separate Billing
// app (see /api/rate-board in server.js — that app's own API has no CORS
// headers, so the browser can't call it directly). The GOLD/SILVER labels
// stay visible with a "—" placeholder even before this resolves (or if it
// fails) so the board itself is never just blank.
async function loadRateBoard() {
  try {
    const r = await fetch('/api/rate-board');
    if (!r.ok) return;
    const d = await r.json();
    if (d.gold_rate == null && d.silver_rate == null) return;
    document.getElementById('rbGoldVal').textContent   = d.gold_rate   != null ? Number(d.gold_rate).toLocaleString('en-IN')   : '—';
    document.getElementById('rbSilverVal').textContent = d.silver_rate != null ? Number(d.silver_rate).toLocaleString('en-IN') : '—';
    document.getElementById('rateBoard').title = `Gold ₹${d.gold_rate} · Silver ₹${d.silver_rate} per gram (${d.rate_date || 'today'})`;
  } catch (_) { /* rate board is supplementary — page works fine without it */ }
}
loadRateBoard();
setInterval(loadRateBoard, 10 * 60 * 1000);
</script>

<script src="/pwa.js" defer></script>
<script src="/push-native.js" defer></script>
<script src="/nav.js"></script>
<script src="/auth.js"></script>
<script src="/theme.js"></script>
<script src="/notify.js"></script>
</body>
</html>
