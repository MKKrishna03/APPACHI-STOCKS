async function _loadAvStocks() {
  try {
    const r = await fetch('/api/stock-categories');
    _avStocks = await r.json();
    _renderAvStockList();
  } catch {}
}

function _renderAvStockList() {
  const list = document.getElementById('avStockList');
  if (!list || !_avStocks) return;
  list.innerHTML = _avStocks.map(s => `
    <div onclick="_selectAvStock('${s.id}')"
      style="padding:11px 12px;font-size:13px;color:#e6edf3;cursor:pointer;border-bottom:1px solid #222d3d">${s.label}</div>
  `).join('');
}

function _toggleAvStockList() {
  const list = document.getElementById('avStockList');
  const btn  = document.getElementById('avStockBtn');
  if (!list || !btn) return;
  const opening = list.style.display === 'none' || !list.style.display;
  if (!opening) { list.style.display = 'none'; return; }
  // Fixed positioning (computed from the button's live screen position) so the
  // dropdown floats above the modal instead of being clipped by the modal
  // card's own overflow-y:auto scroll region.
  const r = btn.getBoundingClientRect();
  list.style.left  = r.left + 'px';
  list.style.top   = (r.bottom + 4) + 'px';
  list.style.width = r.width + 'px';
  list.style.display = 'block';
}

function _closeAvStockList() {
  const list = document.getElementById('avStockList');
  if (list) list.style.display = 'none';
}

function _selectAvStock(id) {
  const stock = (_avStocks || []).find(s => s.id === id);
  if (!stock) return;
  _avStockId = id;
  const btnLabel = document.getElementById('avStockBtnLabel');
  if (btnLabel) { btnLabel.textContent = stock.label; btnLabel.style.color = '#e6edf3'; }
  _closeAvStockList();
  checkAvailability();
}

// Close the dropdown when tapping/clicking outside of it
document.addEventListener('click', e => {
  const wrap = document.getElementById('avStockWrap');
  if (wrap && !wrap.contains(e.target)) _closeAvStockList();
});
// Fixed-position dropdown won't track the button on rotate/resize — just close it
window.addEventListener('resize', () => _closeAvStockList());

function closeAvailabilityModal() {
  const o = document.getElementById('avOverlay');
  if (o) o.style.display = 'none';
  _closeAvStockList();
}

async function checkAvailability() {
  const stock = _avStockId;
  const date  = document.getElementById('avDate')?.value;
  const out   = document.getElementById('avResults');
  if (!out) return;
  if (!stock) { out.innerHTML = '<span style="color:#8b98a8">Select a stock above to see availability.</span>'; return; }
  if (!date)  { out.innerHTML = '<span style="color:#8b98a8">Select a date.</span>'; return; }

  out.innerHTML = '<span style="color:#8b98a8">Checking…</span>';
  try {
    const r = await fetch(`/api/check-availability?stock=${encodeURIComponent(stock)}&date=${encodeURIComponent(date)}`);
    const d = await r.json();
    if (!r.ok) { out.innerHTML = `<span style="color:#ff5d5d">${d.error || 'Error'}</span>`; return; }

    const fmtLast = s => s
      ? new Date(s + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
      : 'Never done';
    const row = (left, right, accent) =>
      `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#1a2230;border-radius:8px;margin-bottom:5px;border-left:3px solid ${accent}">
        <span style="color:#e6edf3;font-weight:600;font-size:13px">${left}</span>
        <span style="color:#8b98a8;font-size:11px;text-align:right;max-width:55%">${right}</span>
      </div>`;

    let html = '';

    if (d.available.length) {
      html += `<div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#2ecc71;text-transform:uppercase;margin-bottom:7px">✓ Available (${d.available.length})</div>`;
      html += d.available.map((e, i) => row(`${i + 1}. ${e.alias}`, fmtLast(e.last_done), '#2ecc71')).join('');
    } else {
      html += `<div style="color:#8b98a8;font-size:13px;margin-bottom:12px">No one available for this stock on this date.</div>`;
    }

    if (d.busy.length) {
      html += `<div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#f39c12;text-transform:uppercase;margin:14px 0 7px">⏰ Busy (${d.busy.length})</div>`;
      html += d.busy.map(e => row(e.alias, e.busy_with.join(' · '), '#f39c12')).join('');
    }

    if (d.on_leave.length) {
      html += `<div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#ff5d5d;text-transform:uppercase;margin:14px 0 7px">✗ On Leave (${d.on_leave.length})</div>`;
      html += d.on_leave.map(e => row(e.alias,
        e.leave_type === 'FULL' ? 'Full Day' : e.leave_type === 'HALF_AM' ? 'Half Day (AM)' : 'Half Day (PM)',
        '#ff5d5d')).join('');
    }

    if (d.disabled && d.disabled.length) {
      html += `<div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#6b7785;text-transform:uppercase;margin:14px 0 7px">🚫 Disabled (${d.disabled.length})</div>`;
      html += d.disabled.map(e => row(e.alias, 'Temporarily disabled', '#6b7785')).join('');
    }

    out.innerHTML = html || '<span style="color:#8b98a8">No data found for this stock.</span>';
  } catch { out.innerHTML = '<span style="color:#ff5d5d">Network error. Please try again.</span>'; }
}

async function loadChangeTask() {
  const stock = document.getElementById('ctStock')?.value;
  const date  = document.getElementById('ctDate')?.value;
  const out   = document.getElementById('ctResults');
  const saveRow = document.getElementById('ctSaveRow');
  if (!out) return;
  if (!stock || !date) {
    out.innerHTML = '<span style="color:#8b98a8">Select a stock and date above.</span>';
    if (saveRow) saveRow.style.display = 'none';
    return;
  }

  out.innerHTML = '<span style="color:#8b98a8">Loading&hellip;</span>';
  if (saveRow) saveRow.style.display = 'none';

  try {
    const [avResp, allResp] = await Promise.all([
      fetch(`/api/check-availability?stock=${encodeURIComponent(stock)}&date=${encodeURIComponent(date)}`),
      fetch(`/api/entry/all?date=${encodeURIComponent(date)}`),
    ]);
    const av  = await avResp.json();
    const all = await allResp.json();

    if (!avResp.ok) { out.innerHTML = `<span style="color:#ff5d5d">${av.error || 'Error'}</span>`; return; }

    const entry = Array.isArray(all) ? all.find(e => e.stock_id === stock) : null;
    const currentAliases = entry ? (entry.aliases || []) : [];

    const stockMeta = (_avStocks || []).find(s => s.id === stock);
    const slots = stockMeta?.slots || 1;

    const fmtLast = s => s
      ? new Date(s + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
      : 'Never done';

    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const opt = (val, label) => `<option value="${esc(val)}">${esc(label)}</option>`;

    const availOpts = (av.available || []).map(e => opt(e.alias, `${e.alias}  —  ${fmtLast(e.last_done)}`));
    const busyOpts  = (av.busy     || []).map(e => opt(e.alias, `${e.alias}  (busy: ${e.busy_with.join(', ')})  —  ${fmtLast(e.last_done)}`));
    const leaveOpts = (av.on_leave || []).map(e => opt(e.alias, `${e.alias}  (on leave)  —  ${fmtLast(e.last_done)}`));

    // check-availability only lists people currently rostered for this stock
    // (stock_assignments) — someone recorded here historically may since have
    // been moved off that roster. Without an option for them, pre-filling
    // their name below silently fails (the <select> falls back to "None"),
    // so saving looks like it replaced them instead of just adding a name.
    const knownAliases = new Set([...(av.available || []), ...(av.busy || []), ...(av.on_leave || [])].map(e => e.alias));
    const missingOpts = currentAliases.filter(a => a && !knownAliases.has(a)).map(a => opt(a, `${a}  (not on this stock's current roster)`));

    const selStyle = 'width:100%;padding:9px 12px;background:#1a2230;border:1px solid #222d3d;border-radius:8px;color:#e6edf3;font-size:13px;font-family:inherit;outline:none;cursor:pointer';
    const allOptHtml = [
      '<option value="">— None —</option>',
      availOpts.length   ? `<optgroup label="Available">${availOpts.join('')}</optgroup>` : '',
      busyOpts.length    ? `<optgroup label="Busy">${busyOpts.join('')}</optgroup>` : '',
      leaveOpts.length   ? `<optgroup label="On Leave">${leaveOpts.join('')}</optgroup>` : '',
      missingOpts.length ? `<optgroup label="Currently Recorded">${missingOpts.join('')}</optgroup>` : '',
    ].join('');

    let html = '';
    for (let i = 0; i < slots; i++) {
      const cur = currentAliases[i] || '';
      const label = slots > 1
        ? `<div style="font-size:11px;color:#8b98a8;margin-bottom:5px;font-weight:600;letter-spacing:.08em">SLOT ${i + 1}${cur ? `  —  Currently: ${esc(cur)}` : ''}</div>`
        : (cur ? `<div style="font-size:11px;color:#8b98a8;margin-bottom:5px">Currently assigned: <strong style="color:#d4af37">${esc(cur)}</strong></div>` : '');
      html += `<div style="margin-bottom:12px">${label}<select id="ctSlot${i}" style="${selStyle}">${allOptHtml}</select></div>`;
    }

    out.innerHTML = html || '<span style="color:#8b98a8">No slots defined for this stock.</span>';

    for (let i = 0; i < slots; i++) {
      const sel = document.getElementById(`ctSlot${i}`);
      if (sel && currentAliases[i]) sel.value = currentAliases[i];
    }

    if (saveRow) { saveRow.style.display = 'flex'; }
  } catch { out.innerHTML = '<span style="color:#ff5d5d">Network error. Please try again.</span>'; }
}

async function saveChangeTask() {
  const stock = document.getElementById('ctStock')?.value;
  const date  = document.getElementById('ctDate')?.value;
  if (!stock || !date) return;

  const stockMeta = (_avStocks || []).find(s => s.id === stock);
  const slots = stockMeta?.slots || 1;
  const aliases = [];
  for (let i = 0; i < slots; i++) {
    const val = document.getElementById(`ctSlot${i}`)?.value;
    if (val) aliases.push(val);
  }

  const btn = document.getElementById('ctSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  try {
    const r = await fetch(`/api/assignment/${encodeURIComponent(date)}/${encodeURIComponent(stock)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aliases }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to save.', 'error'); }
    else { closeChangeTaskModal(); loadDashboard(); }
  } catch { toast('Network error. Please try again.', 'error'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; } }
}

/* ── Fixed rules (checkbox = enabled) ── */
async function loadFixedRules() {
  const wrap = document.getElementById('arFixedList');
  if (!wrap) return;
  try {
    const r = await fetch('/api/admin/assignment-rules');
    const rows = await r.json();
    if (!r.ok) { wrap.innerHTML = `<span style="color:#ff5d5d">${rows.error || 'Failed to load'}</span>`; return; }
    if (!rows.length) { wrap.innerHTML = '<span style="color:#8b98a8">No fixed rules.</span>'; return; }
    wrap.innerHTML = rows.map(row => `
      <label style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #222d3d;cursor:pointer">

        <span style="font-size:12.5px;color:#e6edf3;line-height:1.5">${row.label}</span>
      </label>
    `).join('');

async function toggleFixedRule(id) {
  const cb = document.getElementById(`fr-${id}`);
  if (cb) cb.disabled = true;
  try {
    const r = await fetch(`/api/admin/assignment-rules/${id}/toggle`, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to update rule.', 'error'); loadFixedRules(); return; }
  } catch { toast('Network error. Please try again.', 'error'); loadFixedRules(); }
  finally { if (cb) cb.disabled = false; }
}

/* ── Stock conflict pairs (checkbox = active; unchecking removes it) ── */
async function loadConflictRules() {
  const wrap = document.getElementById('arConflictList');
  if (!wrap) return;
  try {
    const [confRes, catRes] = await Promise.all([
      fetch('/api/stock-conflicts'),
      fetch('/api/stock-categories'),
    ]);
    const conflicts = await confRes.json();
    const cats = await catRes.json();
    const labelOf = id => cats.find(c => c.id === id)?.label || id;

    // Collapse the bidirectional map into unique unordered pairs
    const seen = new Set();
    const pairs = [];
    Object.entries(conflicts).forEach(([a, list]) => {
      (list || []).forEach(b => {
        const key = [a, b].sort().join('|');
        if (seen.has(key)) return;
        seen.add(key);
        pairs.push([a, b]);
      });
    });

    if (!pairs.length) { wrap.innerHTML = '<span style="color:#8b98a8">No conflict pairs configured.</span>'; return; }
    wrap.innerHTML = pairs.map(([a, b]) => `
      <label style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #222d3d;cursor:pointer">
        <input type="checkbox" id="cf-${a}-${b}" checked onchange="removeConflictPair('${a}','${b}')" style="margin-top:2px;width:16px;height:16px;accent-color:#d4af37;cursor:pointer;flex-shrink:0"/>
        <span style="font-size:12.5px;color:#e6edf3;line-height:1.5">${labelOf(a)} &harr; ${labelOf(b)}<div style="font-size:10.5px;color:#8b98a8;margin-top:2px">Same person can never be in both on the same day</div></span>
      </label>
    `).join('');
  } catch { wrap.innerHTML = '<span style="color:#ff5d5d">Network error.</span>'; }
}

async function removeConflictPair(a, b) {
  const cb = document.getElementById(`cf-${a}-${b}`);
  if (cb) cb.disabled = true;
  try {
    const confRes = await fetch('/api/stock-conflicts');
    const conflicts = await confRes.json();
    const remaining = (conflicts[a] || []).filter(x => x !== b);
    const r = await fetch(`/api/stock/${a}/conflicts`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ conflicts: remaining }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to remove conflict.', 'error'); }
    loadConflictRules();
  } catch { toast('Network error. Please try again.', 'error'); loadConflictRules(); }
}

/* ── Active workload/pin directives (checkbox = active; unchecking cancels it) ── */
async function loadDirectiveRules() {
  const wrap = document.getElementById('arDirectiveList');
  if (!wrap) return;
  try {
    const r = await fetch('/api/admin/workload-directive');
    const rows = await r.json();
    if (!r.ok) { wrap.innerHTML = `<span style="color:#ff5d5d">${rows.error || 'Failed to load'}</span>`; return; }
    if (!rows.length) { wrap.innerHTML = '<span style="color:#8b98a8">No active directives.</span>'; return; }
    wrap.innerHTML = rows.map(row => {
      const desc = row.type === 'pin'
        ? `pinned to ${row.stock_label}`
        : `${row.direction === 'increase' ? 'more' : 'less'} work (intensity ${row.intensity}/5)`;
      return `
      <label style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #222d3d;cursor:pointer">
        <input type="checkbox" id="dr-${row.type}-${row.id}" checked onchange="cancelDirectiveRule('${row.type}',${row.id})" style="margin-top:2px;width:16px;height:16px;accent-color:#d4af37;cursor:pointer;flex-shrink:0"/>
        <span style="font-size:12.5px;color:#e6edf3;line-height:1.5"><strong>${row.emp_alias}</strong> — ${desc}<div style="font-size:10.5px;color:#8b98a8;margin-top:2px">until ${fmtRuleDate(row.expires_at)}</div></span>
      </label>
    `;
    }).join('');
  } catch { wrap.innerHTML = '<span style="color:#ff5d5d">Network error.</span>'; }
}

async function cancelDirectiveRule(type, id) {
  const cb = document.getElementById(`dr-${type}-${id}`);
  if (cb) cb.disabled = true;
  try {
    const endpoint = type === 'pin' ? `/api/admin/pin-directive/${id}` : `/api/admin/workload-directive/${id}`;
    await fetch(endpoint, { method: 'DELETE' });
    loadDirectiveRules();
  } catch { toast('Network error. Please try again.', 'error'); loadDirectiveRules(); }
}

/* ── Chat-style "Add" box — free local parser, no external API ── */
async function submitRulesDirective() {
  const input = document.getElementById('arChatInput');
  const btn   = document.getElementById('arAddBtn');
  const out   = document.getElementById('arResult');
  const text  = (input?.value || '').trim();
  if (!text) return;

  btn.disabled = true; btn.textContent = 'Adding…';
  out.innerHTML = '';
  try {
    const r = await fetch('/api/admin/workload-directive', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ text }),
    });
    const d = await r.json();
    if (!r.ok) { out.innerHTML = `<span style="color:#ff5d5d">${d.error || 'Failed to add.'}</span>`; return; }

    let html = '';
    if (d.saved && d.saved.length) {
      html += d.saved.map(s => `
        <div style="color:#2ecc71;margin-bottom:4px">
          &#10003; <strong>${s.alias}</strong> — ${s.direction === 'increase' ? 'more' : 'less'} work
          (intensity ${s.intensity}/5) until ${fmtRuleDate(s.expires_at)}
        </div>`).join('');
    }
    if (d.pinned && d.pinned.length) {
      html += d.pinned.map(p => `
        <div style="color:#2ecc71;margin-bottom:4px">
          &#10003; <strong>${p.alias}</strong> — pinned to ${p.stock_label} until ${fmtRuleDate(p.expires_at)}
        </div>`).join('');
    }
    if ((d.saved && d.saved.length) || (d.pinned && d.pinned.length)) input.value = '';
    if (d.unparsed && d.unparsed.length) {
      html += d.unparsed.map(u => `<div style="color:#8b98a8;margin-top:4px">Could not understand: "${u}"</div>`).join('');
    }
    out.innerHTML = html;
    loadDirectiveRules();
  } catch { out.innerHTML = '<span style="color:#ff5d5d">Network error. Please try again.</span>'; }
  finally { btn.disabled = false; btn.textContent = 'Add'; }
}

/* ── Admin Entry modal ── owner-only: directly records who ACTUALLY did a
   stock on a given date (writes to the dedicated stock_* entry table, not
   the assignment/plan table) — for backfilling or correcting real history. */
function openAdminEntryModal() {
  const mob = window.innerWidth <= 1024 || ('ontouchstart' in window);
  const pad = mob ? '13px 14px' : '9px 12px';
  const fs  = n => (mob ? n + 2 : n) + 'px';

  if (!document.getElementById('aeOverlay')) {
    const tIST = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
    const ov = document.createElement('div');
    ov.id = 'aeOverlay';
    ov.onclick = e => { if (e.target === ov) closeAdminEntryModal(); };
    ov.innerHTML = `
      <div style="background:#131922;border:1px solid #222d3d;border-radius:16px;padding:26px 22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.65)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <h3 style="font-family:'Fraunces',Georgia,serif;font-size:${fs(19)};color:#e6edf3;margin:0">Admin Entry</h3>
          <button onclick="closeAdminEntryModal()" style="background:none;border:none;color:#8b98a8;cursor:pointer;font-size:20px;line-height:1;padding:2px 6px">&#x2715;</button>
        </div>
        <div style="font-size:${fs(11)};color:#8b98a8;margin-bottom:16px">Records who actually did the work — this is the real entry history, not a plan.</div>
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          <select id="aeStock" onchange="loadAdminEntry()"
            style="flex:2;min-width:160px;padding:${pad};background:#1a2230;border:1px solid #222d3d;border-radius:8px;color:#e6edf3;font-size:${fs(13)};font-family:inherit;outline:none;cursor:pointer">
            <option value="">Select stock&hellip;</option>
          </select>
          <input id="aeDate" type="date" onchange="loadAdminEntry()" value="${tIST}"
            style="flex:1;min-width:130px;padding:${pad};background:#1a2230;border:1px solid #222d3d;border-radius:8px;color:#e6edf3;font-size:${fs(13)};font-family:inherit;outline:none;color-scheme:dark"/>
        </div>
        <div id="aeResults" style="font-size:${fs(13)};color:#8b98a8;min-height:40px">Select a stock and date above.</div>
        <div id="aeSaveRow" style="display:none;margin-top:16px;gap:10px">
          <button onclick="closeAdminEntryModal()" style="flex:1;padding:${pad};background:transparent;border:1px solid #222d3d;border-radius:8px;color:#8b98a8;cursor:pointer;font-family:inherit;font-size:${fs(14)}">Cancel</button>
          <button onclick="saveAdminEntry()" id="aeSaveBtn" style="flex:2;padding:${pad};background:linear-gradient(135deg,#d4af37,#9c7c1a);border:none;border-radius:8px;color:#0d1117;font-size:${fs(14)};font-weight:700;cursor:pointer;font-family:inherit">Save Entry</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    _loadAeStocks();
  }

  const dateInp = document.getElementById('aeDate');
  if (dateInp) dateInp.value = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
  const stockSel = document.getElementById('aeStock');
  if (stockSel) stockSel.value = '';
  document.getElementById('aeResults').innerHTML = '<span style="color:#8b98a8">Select a stock and date above.</span>';
  document.getElementById('aeSaveRow').style.display = 'none';

  const mob2 = window.innerWidth <= 1024 || ('ontouchstart' in window);
  document.getElementById('aeOverlay').style.cssText = mob2
    ? 'display:flex;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)'
    : 'display:flex;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;align-items:center;justify-content:center;padding:20px';
}

function _loadAeStocks() {
  const sel = document.getElementById('aeStock');
  if (!sel) return;
  if (_avStocks) {
    _avStocks.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.label; sel.appendChild(o); });
    return;
  }
  fetch('/api/stock-categories').then(r => r.json()).then(data => {
    if (!_avStocks) _avStocks = data;
    data.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.label; sel.appendChild(o); });
  }).catch(() => {});
}

function closeAdminEntryModal() {
  const o = document.getElementById('aeOverlay');
  if (o) o.style.display = 'none';
}

let _aeAllOptHtml = '';
let _aeSelStyle = '';
let _aeSlotCount = 0;

function addAdminEntrySlot() {
  const wrap = document.getElementById('aeSlotWrap');
  if (!wrap) return;
  const idx = _aeSlotCount++;
  const div = document.createElement('div');
  div.style.marginBottom = '10px';
  div.innerHTML = `<select id="aeSlot${idx}" style="${_aeSelStyle}">${_aeAllOptHtml}</select>`;
  wrap.appendChild(div);
}

// Admin Entry deliberately never pre-fills existing names into editable
// slots — that used to require the browser to perfectly round-trip every
// existing name on save (delete-then-reinsert of the whole set), which
// silently dropped anyone whose pre-fill didn't match an available option.
// Now existing entries are shown read-only with their own Remove button,
// and the slots below are always blank, used only for genuinely new names —
// saving can only ever add, never lose what's already recorded.
async function loadAdminEntry() {
  const stock = document.getElementById('aeStock')?.value;
  const date  = document.getElementById('aeDate')?.value;
  const out   = document.getElementById('aeResults');
  const saveRow = document.getElementById('aeSaveRow');
  if (!out) return;
  if (!stock || !date) {
    out.innerHTML = '<span style="color:#8b98a8">Select a stock and date above.</span>';
    if (saveRow) saveRow.style.display = 'none';
    return;
  }

  out.innerHTML = '<span style="color:#8b98a8">Loading&hellip;</span>';
  if (saveRow) saveRow.style.display = 'none';

  try {
    const [avResp, allResp] = await Promise.all([
      fetch(`/api/check-availability?stock=${encodeURIComponent(stock)}&date=${encodeURIComponent(date)}`),
      fetch(`/api/entry/all?date=${encodeURIComponent(date)}&source=ENTRY`),
    ]);
    const av  = await avResp.json();
    const all = await allResp.json();

    if (!avResp.ok) { out.innerHTML = `<span style="color:#ff5d5d">${av.error || 'Error'}</span>`; return; }

    const entry = Array.isArray(all) ? all.find(e => e.stock_id === stock) : null;
    const currentAliases = entry ? (entry.aliases || []) : [];

    const fmtLast = s => s
      ? new Date(s + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
      : 'Never done';

    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const opt = (val, label) => `<option value="${esc(val)}">${esc(label)}</option>`;

    const availOpts = (av.available || []).map(e => opt(e.alias, `${e.alias}  —  ${fmtLast(e.last_done)}`));
    const busyOpts  = (av.busy     || []).map(e => opt(e.alias, `${e.alias}  (busy: ${e.busy_with.join(', ')})  —  ${fmtLast(e.last_done)}`));
    const leaveOpts = (av.on_leave || []).map(e => opt(e.alias, `${e.alias}  (on leave)  —  ${fmtLast(e.last_done)}`));

    const selStyle = 'width:100%;padding:9px 12px;background:#1a2230;border:1px solid #222d3d;border-radius:8px;color:#e6edf3;font-size:13px;font-family:inherit;outline:none;cursor:pointer';
    const allOptHtml = [
      '<option value="">— Select a name —</option>',
      availOpts.length ? `<optgroup label="Available">${availOpts.join('')}</optgroup>` : '',
      busyOpts.length  ? `<optgroup label="Busy">${busyOpts.join('')}</optgroup>` : '',
      leaveOpts.length ? `<optgroup label="On Leave">${leaveOpts.join('')}</optgroup>` : '',
    ].join('');

    const recordedHtml = currentAliases.length
      ? `<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#8b98a8;text-transform:uppercase;margin-bottom:6px">Currently Recorded</div>
         <div style="margin-bottom:16px">
           ${currentAliases.map(a => `
             <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#1a2230;border-radius:8px;margin-bottom:5px">
               <span style="font-size:13px;font-weight:700;color:#e6edf3">${esc(a)}</span>
               <button type="button" onclick="removeAdminEntryName('${a.replace(/'/g, "\\'")}',this)" style="background:none;border:1px solid rgba(255,93,93,.3);border-radius:6px;color:#ff5d5d;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;font-family:inherit">Remove</button>
             </div>`).join('')}
         </div>`
      : '';

    out.innerHTML = `
      ${recordedHtml}
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#8b98a8;text-transform:uppercase;margin-bottom:6px">Add Names</div>
      <div id="aeSlotWrap"></div>
      <div id="aeAddRow" style="margin-bottom:12px"><button type="button" onclick="addAdminEntrySlot()" style="background:none;border:1px dashed #3a4658;border-radius:8px;color:#8b98a8;font-size:13px;font-family:inherit;padding:8px 14px;cursor:pointer;width:100%">+ Add a name</button></div>`;

    _aeAllOptHtml = allOptHtml;
    _aeSelStyle = selStyle;
    _aeSlotCount = 0;
    addAdminEntrySlot();

    if (saveRow) { saveRow.style.display = 'flex'; }
  } catch { out.innerHTML = '<span style="color:#ff5d5d">Network error. Please try again.</span>'; }
}

async function removeAdminEntryName(alias, btn) {
  const stock = document.getElementById('aeStock')?.value;
  const date  = document.getElementById('aeDate')?.value;
  if (!stock || !date) return;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const r = await fetch(`/api/entry-record/${encodeURIComponent(date)}/${encodeURIComponent(stock)}/${encodeURIComponent(alias)}`, { method: 'DELETE' });
    if (!r.ok) { const d = await r.json().catch(() => ({})); toast(d.error || 'Failed to remove.', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Remove'; } return; }
    loadAdminEntry();
    loadDashboard();
  } catch { toast('Network error. Please try again.', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Remove'; } }
}

async function saveAdminEntry() {
  const stock = document.getElementById('aeStock')?.value;
  const date  = document.getElementById('aeDate')?.value;
  if (!stock || !date) return;

  const aliases = [];
  document.querySelectorAll('#aeSlotWrap select[id^="aeSlot"]').forEach(sel => {
    if (sel.value) aliases.push(sel.value);
  });
  if (!aliases.length) return;

  const btn = document.getElementById('aeSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  try {
    const r = await fetch(`/api/entry-record/${encodeURIComponent(date)}/${encodeURIComponent(stock)}/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aliases }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to save.', 'error'); }
    else { loadAdminEntry(); loadDashboard(); }
  } catch { toast('Network error. Please try again.', 'error'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = 'Save Entry'; } }
}

/* ── Greetings modal ── */
function openGreetingsModal() {
  const mob = window.innerWidth <= 1024 || ('ontouchstart' in window);
  const pad = mob ? '14px 16px' : '10px 14px';
  const fs  = n => (mob ? n + 2 : n) + 'px';

  if (!document.getElementById('greetOverlay')) {
    const ov = document.createElement('div');
    ov.id = 'greetOverlay';
    ov.onclick = e => { if (e.target === ov) closeGreetingsModal(); };
    ov.innerHTML = `
      <div style="background:#131922;border:1px solid #222d3d;border-radius:16px;padding:26px 22px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.65)">
        <div id="greetStep1">
          <h3 style="font-family:'Fraunces',Georgia,serif;font-size:${fs(20)};color:#e6edf3;margin:0 0 6px">Send Greeting</h3>
          <p style="font-size:${fs(12)};color:#8b98a8;margin-bottom:18px;line-height:1.6">Write a message to send as a push notification to selected employees.</p>
          <textarea id="greetMsg" rows="4" placeholder="e.g. Wishing you a wonderful day!"
            style="width:100%;padding:${pad};background:#1a2230;border:1px solid #222d3d;border-radius:8px;color:#e6edf3;font-size:${fs(14)};font-family:inherit;outline:none;resize:vertical;box-sizing:border-box;line-height:1.5"></textarea>
          <div id="greetErr1" style="display:none;margin-top:10px;padding:10px 12px;background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.3);border-radius:8px;font-size:${fs(13)};color:#ff5d5d"></div>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button onclick="closeGreetingsModal()" style="flex:1;padding:${pad};background:transparent;border:1px solid #222d3d;border-radius:8px;color:#8b98a8;cursor:pointer;font-family:inherit;font-size:${fs(14)}">Cancel</button>
            <button onclick="greetingsShowRecipients()" style="flex:2;padding:${pad};background:linear-gradient(135deg,#d4af37,#9c7c1a);border:none;border-radius:8px;color:#0d1117;font-size:${fs(14)};font-weight:700;cursor:pointer;font-family:inherit">Next →</button>
          </div>
        </div>
        <div id="greetStep2" style="display:none">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
            <button onclick="greetingsBack()" style="background:none;border:1px solid #222d3d;border-radius:8px;padding:6px 12px;color:#8b98a8;cursor:pointer;font-family:inherit;font-size:${fs(13)};flex-shrink:0">← Back</button>
            <h3 style="font-family:'Fraunces',Georgia,serif;font-size:${fs(18)};color:#e6edf3;margin:0">Select Recipients</h3>
          </div>
          <div id="greetEmpList" style="display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin-bottom:14px"></div>
          <div id="greetErr2" style="display:none;margin-bottom:12px;padding:10px 12px;background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.3);border-radius:8px;font-size:${fs(13)};color:#ff5d5d"></div>
          <div style="display:flex;gap:10px">
            <button onclick="sendGreetings(false)" id="greetSendBtn" style="flex:1;padding:${pad};background:linear-gradient(135deg,#d4af37,#9c7c1a);border:none;border-radius:8px;color:#0d1117;font-size:${fs(14)};font-weight:700;cursor:pointer;font-family:inherit">Send</button>
            <button onclick="sendGreetings(true)" id="greetSendAllBtn" style="flex:1;padding:${pad};background:#1a2230;border:1px solid #d4af37;border-radius:8px;color:#d4af37;font-size:${fs(14)};font-weight:700;cursor:pointer;font-family:inherit">Send to All</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(ov);
  }

  document.getElementById('greetStep1').style.display = 'block';
  document.getElementById('greetStep2').style.display = 'none';
  document.getElementById('greetMsg').value = '';
  document.getElementById('greetErr1').style.display = 'none';

  const mob2 = window.innerWidth <= 1024 || ('ontouchstart' in window);
  document.getElementById('greetOverlay').style.cssText = mob2
    ? 'display:flex;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)'
    : 'display:flex;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;align-items:center;justify-content:center;padding:20px';
}

function closeGreetingsModal() {
  const o = document.getElementById('greetOverlay');
  if (o) o.style.display = 'none';
}

function greetingsBack() {
  document.getElementById('greetStep1').style.display = 'block';
  document.getElementById('greetStep2').style.display = 'none';
  document.getElementById('greetErr2').style.display = 'none';
}

async function greetingsShowRecipients() {
  const msg  = document.getElementById('greetMsg').value.trim();
  const err1 = document.getElementById('greetErr1');
  if (!msg) { err1.textContent = 'Please enter a message.'; err1.style.display = 'block'; return; }
  err1.style.display = 'none';

  document.getElementById('greetStep1').style.display = 'none';
  document.getElementById('greetStep2').style.display = 'block';

  const list = document.getElementById('greetEmpList');
  list.innerHTML = '<span style="color:#8b98a8;font-size:13px">Loading…</span>';
  try {
    const r    = await fetch('/api/push/subscribed-employees');
    const emps = await r.json();
    if (!emps.length) { list.innerHTML = '<span style="color:#8b98a8;font-size:13px">No employees have notifications enabled yet.</span>'; return; }
    list.innerHTML = emps.map(name => `
      <label style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#1a2230;border-radius:8px;cursor:pointer;border:1px solid #222d3d">
        <input type="checkbox" value="${name}" checked style="width:16px;height:16px;accent-color:#d4af37;cursor:pointer;flex-shrink:0">
        <span style="color:#e6edf3;font-size:14px;font-weight:500">${name}</span>
      </label>`).join('');
  } catch { list.innerHTML = '<span style="color:#ff5d5d;font-size:13px">Failed to load employees.</span>'; }
}

async function sendGreetings(sendAll) {
  const msg  = document.getElementById('greetMsg').value.trim();
  const err2 = document.getElementById('greetErr2');
  const checkboxes = document.querySelectorAll('#greetEmpList input[type=checkbox]');
  const employees  = Array.from(sendAll ? checkboxes : document.querySelectorAll('#greetEmpList input[type=checkbox]:checked')).map(cb => cb.value);

  if (!employees.length) { err2.textContent = 'Please select at least one employee.'; err2.style.display = 'block'; return; }
  err2.style.display = 'none';

  const btnId = sendAll ? 'greetSendAllBtn' : 'greetSendBtn';
  const btn   = document.getElementById(btnId);
  const orig  = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sending…';

  try {
    const r = await fetch('/api/push/greet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, employees }),
    });
    const d = await r.json();
    if (r.ok) {
      closeGreetingsModal();
      toast(`Greeting sent to ${employees.length} employee${employees.length !== 1 ? 's' : ''}`, 'success');
    } else {
      err2.textContent = d.error || 'Failed to send. Please try again.';
      err2.style.display = 'block';
    }
  } catch { err2.textContent = 'Network error. Please try again.'; err2.style.display = 'block'; }
  btn.disabled = false; btn.textContent = orig;
}
</script>

<style>

}

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);

  function animate(duration, onFrame, onDone) {
    const start = performance.now();
    (function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      onFrame(t);
      if (t < 1) requestAnimationFrame(frame);
      else onDone && onDone();
    })(start);
  }

  // Keep butterflies out of the sidebar / mobile header / mobile bottom-nav
  // regions entirely, so a tap that narrowly misses the (small, moving)
  // butterfly never lands on a nav link sitting underneath it instead.
  const isVisible = el => !!el && getComputedStyle(el).display !== 'none';
  function getBounds() {
    let minX = 24, maxX = window.innerWidth - 24;
    let minY = 80, maxY = window.innerHeight - 24;
    const sidebar = document.querySelector('.sidebar');
    const header  = document.querySelector('.mobile-header');
    const navbar  = document.querySelector('.mobile-nav');
    if (isVisible(sidebar)) minX = Math.max(minX, sidebar.getBoundingClientRect().right + 16);
    if (isVisible(header))  minY = Math.max(minY, header.getBoundingClientRect().bottom + 12);
    if (isVisible(navbar))  maxY = Math.min(maxY, navbar.getBoundingClientRect().top - 12);
    if (maxX <= minX) maxX = minX + 40;
    if (maxY <= minY) maxY = minY + 40;
    return { minX, maxX, minY, maxY };
  }

  function makeButterfly(el, startOff) {
    let b = getBounds();
    let x = rand(b.minX, b.maxX);
    let y = rand(b.minY, b.maxY);
    let scale = 1;
    // Bumped whenever a new flight starts, so a click mid-flight can cancel
    // whatever animate() loop is already running instead of racing against
    // it — without this, the background wander and a click-triggered dart
    // would both keep writing to x/y, and the butterfly would visibly snap
    // back to the old flight's path once it finished (looked like a bug
    // teleporting back to the touched spot).
    let flightId = 0;
    let paused = !!startOff;
    let pendingTimeout = null;

    const apply = (angle) => { el.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${scale})`; };
    apply(0);

    function flyToRandom() {
      if (paused) return;
      b = getBounds();
      const tx = rand(b.minX, b.maxX);
      const ty = rand(b.minY, b.maxY);
      flyTo(tx, ty, rand(2000, 4400) + Math.hypot(tx - x, ty - y) * rand(9, 14), () => {
        pendingTimeout = setTimeout(flyToRandom, rand(300, 1400));
      });
    }

    // Flies toward (tx,ty) with a wavy, fluttering path instead of a straight
    // line. `startle` adds a quick shy "gasp" scale-pop that settles back to
    // normal size early in the flight, used only for the click-away reaction.
    function flyTo(tx, ty, duration, onDone, startle) {
      const myFlight = ++flightId;
      const fromX = x, fromY = y;
      const dx = tx - fromX, dy = ty - fromY;
      const baseAngle = Math.atan2(dy, dx);
      const perp = baseAngle + Math.PI / 2;
      const wobbleAmp  = rand(14, 30);
      const wobbleFreq = rand(2, 4);
      animate(duration, t => {
        if (myFlight !== flightId || paused) return; // superseded, or turned off mid-flight
        const taper = 1 - t * 0.4;
        const wob = Math.sin(t * Math.PI * wobbleFreq) * wobbleAmp * taper;
        x = fromX + dx * t + Math.cos(perp) * wob;
        y = fromY + dy * t + Math.sin(perp) * wob;
        const heading = baseAngle * 180 / Math.PI + Math.sin(t * Math.PI * wobbleFreq) * 22;
        if (startle) scale = 1 + 0.4 * Math.max(0, 1 - t * 5);
        apply(heading);
      }, () => {
        if (myFlight !== flightId || paused) return;
        x = tx; y = ty; scale = 1;
        apply(baseAngle * 180 / Math.PI);
        onDone && onDone();
      });
    }

    if (paused) el.style.display = 'none';
    else if (!reduceMotion) flyToRandom();

    // Tap/click: shy away — quick startled flutter-flap and a bigger, more
    // decisive dart off in a random new direction, then resume wandering.
    el.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      if (reduceMotion || paused) return;
      b = getBounds();
      const angle = rand(0, Math.PI * 2);
      const dist  = rand(170, 320);
      const tx = Math.min(Math.max(x + Math.cos(angle) * dist, b.minX), b.maxX);
      const ty = Math.min(Math.max(y + Math.sin(angle) * dist, b.minY), b.maxY);
      el.classList.add('bfly-shy');
      flyTo(tx, ty, rand(420, 650), () => {
        el.classList.remove('bfly-shy');
        pendingTimeout = setTimeout(flyToRandom, rand(300, 1400));
      }, true);
    });

    return {
      pause() {
        paused = true;
        flightId++; // cancels whatever animate() loop is mid-flight
        if (pendingTimeout) { clearTimeout(pendingTimeout); pendingTimeout = null; }
        el.style.display = 'none';
      },
      resume() {
        paused = false;
        el.style.display = '';
        flyToRandom();
      },
    };
  }

  // On/off preference persists across visits — butterflies are on by default.
  const BFLY_KEY = 'appachi_butterflies_off';
  const startOff = localStorage.getItem(BFLY_KEY) === '1';

  const controllers = ['bfly-1', 'bfly-2', 'bfly-3']
    .map(id => document.getElementById(id))
    .filter(Boolean)
    .map(el => makeButterfly(el, startOff));

  function updateToggleButtons(off) {
    const icon = off ? '🛑' : '🦋';
    const title = off ? 'Turn butterflies on' : 'Turn butterflies off';
    const mobileBtn = document.getElementById('bflyToggleMobile');
    if (mobileBtn) { mobileBtn.textContent = icon; mobileBtn.title = title; mobileBtn.setAttribute('aria-label', title); }
    const deskBtn  = document.getElementById('bflyToggleDesktop');
    const deskIcon = document.getElementById('bflyToggleIconDesktop');
    if (deskBtn)  deskBtn.title = title;
    if (deskIcon) deskIcon.textContent = icon;
  }
  updateToggleButtons(startOff);

  window.toggleButterflyPref = function () {
    const off = localStorage.getItem(BFLY_KEY) === '1';
    const next = !off;
    localStorage.setItem(BFLY_KEY, next ? '1' : '0');
    controllers.forEach(c => next ? c.pause() : c.resume());
    updateToggleButtons(next);
  };
})();
</script>
</body>
</html>
