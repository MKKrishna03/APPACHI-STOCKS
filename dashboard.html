<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0d1117"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Dashboard · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
:root {
  --accent2:#9c7c1a; --up:#2ecc71; --down:#ff5d5d;
  --sidebar-w:240px; --nav-h:64px;
}
[data-theme="light"] {
  --accent2:#9c7c1a; --up:#16a34a; --down:#dc2626;
}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--text-dim);cursor:pointer;transition:all .15s;flex-shrink:0}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-y:scroll;font-size:clamp(14px,1.6vw,16px)}
body{min-height:100%;width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

/* ═══════════════════════════════════════
   DESKTOP LAYOUT
═══════════════════════════════════════ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* ── Desktop Sidebar ── */
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:24px 18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px 6px;border-bottom:1px solid var(--border);text-decoration:none}
.brand-mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:800;color:#0d1117;flex-shrink:0}
.brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:.3px;color:var(--text)}
.nav-section{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-dim);text-decoration:none;transition:background .15s,color .15s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--panel-elev);color:var(--text)}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item:hover svg{opacity:1}
.sidebar-footer{margin-top:auto;font-size:11px;color:var(--text-dim);padding:10px;border-top:1px solid var(--border)}

/* ── Desktop topbar ── */
.main{display:flex;flex-direction:column;min-height:100vh}
.desktop-topbar{height:64px;border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);flex-shrink:0}
.page-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.topbar-meta{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--text-dim)}

/* ── Content area ── */
.content{flex:1;padding:24px 28px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}

/* ── Blocks ── */
.dash-block{display:flex;flex-direction:column;gap:12px}
.block-header{display:flex;align-items:center;justify-content:space-between}
.block-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim)}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text-dim);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.refresh-btn svg{transition:transform .4s}
.refresh-btn.spinning svg{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Day grid (desktop = 2col, mobile = 1col) ── */
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.day-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.day-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.day-card-title{font-family:'Fraunces',serif;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:0}
.print-btns{display:flex;gap:6px}
.print-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text-dim);font-size:11px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.print-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-list{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;flex-direction:column;gap:2px;padding:8px 12px;background:var(--panel-elev);border-radius:8px;font-size:13px;font-weight:500;color:var(--text);border-left:3px solid var(--accent);line-height:1.3}
.chip-label{font-weight:600}
.chip-hint{font-size:11px;font-weight:400;color:var(--text-dim)}
.chip-none{font-size:12px;color:var(--text-dim);font-style:italic;padding:4px 2px}

/* ── Streak bar ── */
.streak-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.streak-track{flex:1;height:8px;border-radius:999px;background:var(--panel-elev);overflow:hidden}
.streak-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--up));border-radius:999px;transition:width .35s ease}
.streak-count{font-size:12px;font-weight:800;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── Done-markable chip (My Today only) ── */
.chip-markable{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.chip-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip-done-btn{flex-shrink:0;font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'Inter',sans-serif}
.chip-done-btn:hover{border-color:var(--up);color:var(--up)}
.chip-done-btn.is-done{background:var(--up);border-color:var(--up);color:#fff}

/* Briefly highlights the chip deep-linked to from a stock-reminder push */
.chip-highlight{animation:chipHighlightPulse 2.4s ease-out 1}
@keyframes chipHighlightPulse{
  0%{box-shadow:0 0 0 0 rgba(212,174,86,.55);border-color:var(--accent)}
  70%{box-shadow:0 0 0 10px rgba(212,174,86,0);border-color:var(--accent)}
  100%{box-shadow:0 0 0 0 rgba(212,174,86,0)}
}

/* ── Celebration overlay ── */
.celebrate-overlay{position:fixed;inset:0;z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.55);pointer-events:none;animation:celebrateFade 4s ease forwards}
.celebrate-emoji{font-size:64px;animation:celebrateBounce .6s ease infinite alternate}
.celebrate-text{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);text-align:center;padding:0 20px}
.confetti-piece{position:absolute;top:-20px;width:8px;height:14px;opacity:.9;animation:confettiFall linear forwards}
@keyframes celebrateFade{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes celebrateBounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-14px) scale(1.08)}}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

/* ── Team rows ── */
.team-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8px 10px;border-radius:7px;font-size:12px;gap:6px}
.team-row:nth-child(odd){background:var(--panel-elev)}
.team-stock{color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.team-names{color:var(--text);font-weight:600;text-align:right;word-break:break-word}

/* ── Last Done rows — stock+date on their own line, staff names get the
   full row width below instead of being squeezed into a narrow column
   (which forced ugly mid-word breaks when a stock had several people). ── */
.lastdone-row{padding:9px 10px;border-radius:7px}
.lastdone-row:nth-child(odd){background:var(--panel-elev)}
.lastdone-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lastdone-stock{color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.lastdone-date{font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums;font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--accent);background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);padding:2px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.lastdone-staff{margin-top:5px;font-size:12px;color:var(--text);font-weight:600;line-height:1.45}
.lastdone-never{font-size:11px;font-weight:700;color:var(--down);background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.25);padding:3px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}

/* ── Tabs (team section on mobile) ── */
.team-tabs{display:none;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.team-tab{padding:7px 16px;background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.team-tab.active{background:var(--panel-elev);color:var(--accent)}
.team-panel{display:block}

/* Last Done, web/desktop: a single button opening a modal instead of a
   permanent grid card — the full inline card + tab (above) is app/mobile
   only, shown within the mobile breakpoint below instead. */
.lastdone-web-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.lastdone-web-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── Leave banner ── */
.leave-banner{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.25);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;color:var(--accent);display:none;align-items:center;gap:10px}
.leave-banner.show{display:flex}

/* ── Notification prompt banner ── */
.notif-prompt{display:none;align-items:center;gap:12px;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;margin-bottom:0}
.notif-prompt.show{display:flex}
.notif-prompt.state-ask{background:rgba(56,139,253,.10);border:1px solid rgba(56,139,253,.30);color:#58a6ff}
.notif-prompt.state-blocked{background:rgba(255,93,93,.09);border:1px solid rgba(255,93,93,.28);color:#ff7b72}
.notif-prompt-btn{margin-left:auto;flex-shrink:0;padding:5px 13px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em}
.state-ask .notif-prompt-btn{background:#58a6ff;color:#0d1117}
.state-blocked .notif-prompt-btn{background:#ff7b72;color:#0d1117}

/* ── Skeleton loader ── */
.skel{background:linear-gradient(90deg,var(--panel-elev) 25%,var(--border) 50%,var(--panel-elev) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;height:34px;margin-bottom:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ═══════════════════════════════════════
   MOBILE HEADER (hidden on desktop)
═══════════════════════════════════════ */
.mobile-header{display:none;background:var(--panel);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;flex-direction:column;gap:2px;position:sticky;top:0;z-index:100}
.mh-top{display:flex;align-items:center;justify-content:space-between}
.mh-brand{font-family:'Fraunces',serif;font-weight:800;font-size:17px;color:var(--accent);letter-spacing:.04em}
.mh-actions{display:flex;align-items:center;gap:8px}
.mh-icon-btn{background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--text-dim);cursor:pointer;transition:all .15s;flex-shrink:0}
.mh-icon-btn:hover,.mh-icon-btn:active{border-color:var(--accent);color:var(--accent)}
.mh-name{font-size:13px;font-weight:600;color:var(--text)}
.mh-date{font-size:12px;color:var(--text-dim);font-family:'Space Grotesk',monospace}

/* ── Greeting card (mobile) ── */
.greeting-card{display:none;background:linear-gradient(135deg,var(--panel) 0%,var(--panel-elev) 100%);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.greet-text{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--text);margin-bottom:2px}
.greet-sub{font-size:13px;color:var(--text-dim)}

/* ═══════════════════════════════════════
   MOBILE BOTTOM NAV (hidden on desktop)
═══════════════════════════════════════ */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--panel);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.4)}
.mnav-inner{display:flex;justify-content:space-around;align-items:center}
.mnav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;cursor:pointer;color:var(--text-dim);transition:color .15s;-webkit-tap-highlight-color:transparent;min-width:60px}
.mnav-btn:active{opacity:.7}
.mnav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mnav-btn span{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mnav-btn.danger{color:var(--down);opacity:.7}
.mnav-btn.accent-btn{color:var(--accent)}

/* ── Mobile content spacing ── */
.mobile-scroll-pad{display:none;height:80px;flex-shrink:0}

/* ── Mobile top section toggle (Stocks / Salary) ── */
.section-toggle{display:none;padding:14px 18px 0}
.section-toggle-pill{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel-elev)}
.section-toggle-btn{flex:1;padding:12px 0;text-align:center;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.03em;background:none;color:var(--text-dim);border:none;cursor:pointer;transition:all .15s}
.section-toggle-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1117}

/* ── Salary section ── */
.salary-section{display:none;padding:18px 18px calc(100px + env(safe-area-inset-bottom,0px))}
.sal-search-wrap{position:relative;margin-bottom:16px}
.sal-search-input{width:100%;padding:12px 14px;background:var(--panel-elev);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.sal-search-input:focus{border-color:var(--accent)}
.sal-search-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow-y:auto;background:var(--panel-elev);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:50}
.sal-search-dropdown.open{display:block}
.sal-search-option{padding:10px 14px;font-size:13px;color:var(--text);cursor:pointer}
.sal-search-option:hover{background:var(--panel)}
.sal-section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.sal-section-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sal-tile{background:var(--panel-elev);border-radius:10px;padding:12px 14px}
.sal-tile-lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.sal-tile-val{font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--text);font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums}
.sal-tile-val.accent{color:var(--accent)}
.sal-tile-val.green{color:var(--up)}
.sal-tile-val.red{color:var(--down)}
.sal-empty{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13px}
.sal-asof{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent);background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);border-radius:999px;padding:5px 12px;margin-bottom:14px}
.sal-leave-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;padding-right:4px}
.sal-leave-list::-webkit-scrollbar{width:6px}
.sal-leave-list::-webkit-scrollbar-track{background:transparent}
.sal-leave-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sal-leave-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-elev);border-radius:10px;padding:10px 14px;flex-shrink:0}
.sal-leave-date{font-size:13px;font-weight:700;color:var(--text)}
.sal-leave-badge{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
/* Full Day + Reserved: best case */
.sal-leave-badge.reserved{background:rgba(46,204,113,.15);color:var(--up);border:1px solid rgba(46,204,113,.3)}
/* Half Day + Reserved */
.sal-leave-badge.half-reserved{background:rgba(212,175,55,.15);color:var(--accent);border:1px solid rgba(212,175,55,.35)}
/* Half Day + Unreserved */
.sal-leave-badge.half-unreserved{background:rgba(255,159,67,.15);color:#ff9f43;border:1px solid rgba(255,159,67,.35)}
/* Full Day + Unreserved: worst case */
.sal-leave-badge.unreserved{background:rgba(255,93,93,.12);color:var(--down);border:1px solid rgba(255,93,93,.3)}

/* ── Sales tab ── */
.sales-person{background:var(--panel-elev);border-radius:10px;margin-bottom:8px;overflow:hidden}
.sales-person-row{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;cursor:pointer}
.sales-person-name{flex:1;min-width:0;font-weight:700;color:var(--text);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sales-caret{color:var(--text-dim);font-size:10px;transition:transform .2s;flex-shrink:0}
.sales-person.open .sales-caret{transform:rotate(90deg)}
.sales-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 14px 12px;cursor:pointer}
.sales-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 4px;border-radius:8px;background:var(--panel);border:1px solid var(--border);min-width:0}
.sales-stat-label{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.sales-stat-value{font-size:12px;font-weight:700;font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--text)}
.sales-stat.gold .sales-stat-value{color:var(--accent)}
.sales-stat.silver .sales-stat-value{color:#cbd5e1}
@media(max-width:420px){
  .sales-stats{grid-template-columns:repeat(2,1fr)}
}
.sales-detail{display:none;padding:0 14px 12px;overflow-x:auto}
.sales-person.open .sales-detail{display:block}
.sales-detail table{width:100%;border-collapse:collapse;font-size:11px}
.sales-detail th{text-align:left;padding:6px 8px;color:var(--text-dim);font-size:9px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.sales-detail td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap}
.sales-sort-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sales-sort-btn{font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.03em;padding:6px 12px;background:var(--panel-elev);color:var(--text-dim);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:all .15s}
.sales-sort-btn:hover{border-color:var(--accent)}
.sales-sort-btn.active{background:rgba(212,175,55,.15);color:var(--accent);border-color:rgba(212,175,55,.4)}

/* ═══════════════════════════════════════
   MOBILE BREAKPOINT
═══════════════════════════════════════ */
@media(max-width:1024px){
  .app{display:block;min-height:100vh}
  .sidebar{display:none!important}
  .main{min-height:100dvh;display:flex;flex-direction:column}
  .desktop-topbar{display:none}
  /* ── Mobile header ── */
  .mobile-header{display:flex;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px}
  /* ── Section toggle ── */
  .section-toggle{display:block}
  /* Refresh/Butterflies already live in the mobile header above — don't duplicate them here */
  .desktop-refresh-row{display:none!important}
  .mh-brand{font-size:22px}
  .mh-name{font-size:17px;margin-top:4px}
  .mh-date{font-size:14px;margin-top:2px}
  .mh-icon-btn{width:42px;height:42px;border-radius:10px}
  /* ── Greeting ── */
  .greeting-card{display:block;padding:22px 20px;border-radius:16px}
  .greet-text{font-size:24px}
  .greet-sub{font-size:15px}
  /* ── Content ── */
  .content{padding:18px;gap:20px;overflow-y:visible}
  .block-title{font-size:13px;letter-spacing:1.4px}
  /* ── Day cards ── */
  .day-grid{grid-template-columns:1fr}
  .day-card{border-radius:16px;padding:18px 20px}
  .day-card-title{font-size:16px;margin-bottom:14px}
  .chip{font-size:16px;padding:13px 16px;border-radius:10px}
  .chip-none{font-size:15px}
  /* ── Team rows ── */
  .team-tabs{display:flex}
  .lastdone-web-btn{display:none!important}
  .team-row{font-size:15px;padding:14px 16px;border-radius:9px;gap:10px}
  .team-stock{font-size:14px;letter-spacing:.4px}
  .team-names{font-size:15px}
  .lastdone-row{padding:14px 16px;border-radius:9px}
  .lastdone-top{gap:10px}
  .lastdone-stock{font-size:14px;letter-spacing:.4px}
  .lastdone-date{font-size:13px;padding:4px 12px}
  .lastdone-staff{font-size:15px;margin-top:8px}
  .lastdone-never{font-size:13px;padding:4px 12px}
  /* ── Leave banner ── */
  .leave-banner{font-size:15px;padding:16px 18px;border-radius:14px}
  .notif-prompt{font-size:14px;padding:14px 16px;border-radius:12px}
  /* ── Bottom nav ── */
  .mobile-nav{display:block;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
  .mnav-btn{min-width:54px;padding:6px 10px;gap:5px}
  .mnav-btn svg{width:26px;height:26px;stroke-width:1.6}
  .mnav-btn span{font-size:11px;letter-spacing:.05em}
  .mobile-scroll-pad{display:block;height:90px}
}

/* Extra safety: force-hide sidebar on any touch device regardless of viewport */
@media(hover:none) and (pointer:coarse){
  .sidebar{display:none!important}
  .app{display:block}
  .desktop-topbar{display:none}
  .mobile-header{display:flex}
  .section-toggle{display:block}
  .mobile-nav{display:block}
  .mobile-scroll-pad{display:block}
}

/* ── Print Area (hidden on screen, A4 layout on print) — matches auto-assign.html's print format exactly ── */
#printArea{display:none}
#gentsPrintArea{display:none}

@media print {
  @page { size:A4 portrait; margin:10mm }

  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }

  html,body { margin:0 !important; padding:0 !important; height:auto !important; background:#fff !important; font-family:'Segoe UI',Arial,sans-serif; }

  body > *:not(#printArea):not(#gentsPrintArea) { display:none !important; }

  #printArea { display:block !important; page-break-inside:avoid !important; break-inside:avoid !important; }

  /* Gents print mode — swap which area shows */
  body.gents-print #printArea      { display:none !important; }
  body.gents-print #gentsPrintArea { display:inline-block !important; }

  /* Gents print: date top-left */
  .gents-pr-date {
    text-align:left;
    font-size:13pt; font-weight:800;
    color:#111;
    margin:0 0 3.5mm 0;
    letter-spacing:.04em;
    padding-bottom:2mm;
    border-bottom:1.5px solid #111;
  }

  /* Two cards stacked vertically, anchored top-left */
  .gents-pr-stack {
    display:flex;
    flex-direction:column;
    gap:3mm;
    width:fit-content;
  }

  .gents-pr-card {
    width: max-content;
    min-width: 46mm;
  }

  .gents-pr-card .pr-card-name {
    white-space: nowrap;
    padding-right: 8mm;
  }

  /* Date — centred, bold, clean rule underneath */
  .pr-date {
    text-align:center;
    font-size:15pt; font-weight:800;
    color:#111;
    margin:0 0 4mm 0;
    letter-spacing:.06em;
    padding-bottom:2mm;
    border-bottom:1.5px solid #111;
  }

  /* 3-column grid — cards sit at natural height (align-items:start) */
  .pr-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3mm;
    align-items:start;
  }

  /* Card border */
  .pr-card { border:1px solid #222; border-radius:2mm; overflow:hidden; }

  /* ── UNIFORM SIZING: every header = 5.5mm, every row = 6mm ── */
  .pr-card-head {
    height:5.5mm;
    display:flex; align-items:center; justify-content:center;
    background:#e3e3e3 !important;
    font-size:7.6pt; font-weight:800;
    text-transform:uppercase; letter-spacing:.06em;
    color:#111;
    border-bottom:1px solid #222;
    padding:0 2mm;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .pr-card-row {
    height:6mm;          /* FIXED — identical on every card everywhere */
    display:flex;
    align-items:center;
    border-bottom:1px solid #ddd;
    box-sizing:border-box;
    padding:0 3mm;
  }
  .pr-card-row:last-child { border-bottom:none; }
  .pr-card-row:nth-child(even) { background:#f7f7f7 !important; }

  .pr-card-name {
    flex:1;
    height:100%;
    display:flex; align-items:center;
    font-size:8.6pt; font-weight:700;
    color:#111;
    box-sizing:border-box;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
}
</style>

<script>
const istFmt  = d => new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Kolkata' }).format(d);
const dayFmt  = s => new Date(s+'T12:00:00').toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short' });
const shortFmt= s => new Date(s+'T12:00:00').toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });

let _today, _tomorrow, _me;
let _teamTodayData = null, _teamTomorrowData = null;
let _stocksLastDoneData = null;

const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Same stock ordering used by auto-assign.html's print, kept identical so both
// pages produce the same card layout.
const PRINT_ORDER = [
  'morning_cleaning', 'shop_opening',    'shop_closing',
  'tea',              'collection',       'metty_mookuthi',
  'chain_stock',      'drops_stock',      'ring_stock',
  'chain_arrange',    'drops_arrange',    'tray_arrange',
  'dustbin_checking', 'evening_cleaning', 'dustbin_cleaning',
  'purse_bag_stock',  'fan_cleaning',     'maadi_cleaning',
  'silver_arrange',   'pathiram_sl_box',  'kolusu_stock',
  'sl_stock',         'pathiram_stock',
];

function _prCard(row) {
  const staffRows = (row.aliases || []).map(alias => `
    <div class="pr-card-row">
      <div class="pr-card-name">${escHtml(alias)}</div>
    </div>`).join('');
  return `
    <div class="pr-card">
      <div class="pr-card-head">${escHtml(row.label)}</div>
      ${staffRows}
    </div>`;
}

// Owner-only, website-only: builds the same card-per-stock A4 print layout as
// auto-assign.html's Print button, for whichever day's data is already loaded.
function printAssignments(day) {
  const data = day === 'today' ? _teamTodayData : _teamTomorrowData;
  if (!data || !data.length) { toast('No assignments saved yet for this date.', 'info'); return; }

  const date = day === 'today' ? _today : _tomorrow;
  const printDateFmt = new Date(date + 'T12:00:00').toLocaleDateString('en-GB'); // DD/MM/YYYY

  const dataMap = new Map(data.map(r => [r.stock_id, r]));
  const orderedData = [
    ...PRINT_ORDER.map(sid => dataMap.get(sid)).filter(Boolean),
    ...data.filter(r => !PRINT_ORDER.includes(r.stock_id)), // custom stocks at end
  ];
  const printCards = orderedData.map(_prCard).join('');

  document.body.classList.remove('gents-print');
  document.getElementById('printArea').innerHTML = `
    <div class="pr-date">${printDateFmt}</div>
    <div class="pr-grid">${printCards}</div>`;
  window.print();
}

// Gents Print — SHOP OPENING + SHOP CLOSING only, top-left stacked layout,
// identical to auto-assign.html's printGents().
function printGentsAssignments(day) {
  const GENTS_ORDER = ['shop_opening', 'shop_closing'];
  const data = day === 'today' ? _teamTodayData : _teamTomorrowData;
  if (!data || !data.length) { toast('No assignments saved yet for this date.', 'info'); return; }

  const gentsRows = GENTS_ORDER.map(sid => data.find(r => r.stock_id === sid)).filter(Boolean);
  if (!gentsRows.length) { toast('No Shop Opening / Shop Closing assignments saved for this date.', 'info'); return; }

  const date = day === 'today' ? _today : _tomorrow;
  const printDateFmt = new Date(date + 'T12:00:00').toLocaleDateString('en-GB');

  const cards = gentsRows.map(row => {
    const staffRows = (row.aliases || []).map(alias => `
      <div class="pr-card-row">
        <div class="pr-card-name">${escHtml(alias)}</div>
      </div>`).join('');
    return `
      <div class="pr-card gents-pr-card">
        <div class="pr-card-head">${escHtml(row.label)}</div>
        ${staffRows}
      </div>`;
  }).join('');

  document.getElementById('gentsPrintArea').innerHTML = `
    <div class="gents-pr-date">${printDateFmt}</div>
    <div class="gents-pr-stack">${cards}</div>`;

  document.body.classList.add('gents-print');
  window.print();
}

// Force single-page print, preferring half a page to save paper — same math
// auto-assign.html uses to shrink the grid to fit.
window.addEventListener('beforeprint', function () {
  const area = document.getElementById('printArea');
  if (!area || !area.innerHTML.trim()) return;
  area.style.zoom = '';

  const HEAD_MM = 5.5, ROW_MM = 6, GAP_MM = 3, DATE_MM = 11, FULL_MM = 277, HALF_MM = 134, COLS = 3, MIN_ZOOM = 0.62;
  const cards = [...area.querySelectorAll('.pr-card')];
  if (!cards.length) return;

  const heights = cards.map(c => HEAD_MM + c.querySelectorAll('.pr-card-row').length * ROW_MM);

  let totalMM = DATE_MM;
  for (let i = 0; i < heights.length; i += COLS) {
    totalMM += Math.max(...heights.slice(i, i + COLS));
    if (i > 0) totalMM += GAP_MM;
  }

  // Prefer shrinking to fit within half a page (saves paper); only fall back
  // to filling the full page if that shrink would make text too small to read.
  const halfZoom = HALF_MM / totalMM;
  if (halfZoom >= MIN_ZOOM) {
    area.style.zoom = halfZoom.toFixed(5);
  } else if (totalMM > FULL_MM) {
    area.style.zoom = (FULL_MM / totalMM).toFixed(5);
  }
});
window.addEventListener('afterprint', function () {
  const area = document.getElementById('printArea');
  if (area) area.style.zoom = '';
  document.body.classList.remove('gents-print');
});

// Team tab state (mobile only)
function switchDashSection(section) {
  document.getElementById('secToggleStocks').classList.toggle('active', section === 'stocks');
  document.getElementById('secToggleSalary').classList.toggle('active', section === 'salary');
  document.getElementById('secToggleSales').classList.toggle('active', section === 'sales');
  document.getElementById('stocksSection').style.display = section === 'stocks' ? '' : 'none';
  document.getElementById('salarySection').style.display = section === 'salary' ? 'block' : 'none';
  document.getElementById('salesSection').style.display  = section === 'sales'  ? 'block' : 'none';
  if (section === 'salary') {
    // Payroll is a separate free-tier Render service that sleeps when idle —
    // ping it the instant the tab opens so its dyno starts waking up right
    // away, same as this app waking up simply from being opened.
    fetch('/api/salary-wake').catch(() => {});
    initSalaryTab();
  }
  if (section === 'sales') initSalesTab();
}

/* ── Salary tab (Payroll app integration) ──
   Everyone sees their own salary automatically on open. OWNER additionally
   gets a search box to look up any employee, mirroring the Payroll app's own
   Staff Data page — everyone else stays locked to their own ID, enforced
   server-side in /api/salary/:employeeId, not just hidden here. ── */
let _salLoadedOnce  = false;
let _salOwnLoadOk   = false;
let _salEmployees   = null;

function fmtSalMoney(n) {
  return '₹' + (parseFloat(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

function fmtSalLeaveDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
}

function salTile(label, val, cls) {
  return `<div class="sal-tile"><div class="sal-tile-lbl">${label}</div><div class="sal-tile-val${cls ? ' ' + cls : ''}">${val}</div></div>`;
}

function renderSalaryData(d) {
  const body = document.getElementById('salBody');
  body.className = '';
  const pt = d.permission_timing || {};
  const isCash = (d.mop || '').toUpperCase() === 'CASH';

  const asOfHtml = d.last_filled_date ? (() => {
    const [y, m, dd] = d.last_filled_date.split('-');
    return `<div class="sal-asof" title="Last date attendance was filled in for this employee this month">&#128197; As of ${dd}/${m}/${y}</div>`;
  })() : '';

  const lopLabel   = `LOP (${d.lop_days || 0} days)`;
  const grossMinusLop = (parseFloat(d.gross_pay) || 0) - (parseFloat(d.lop_amount) || 0);

  // Full waterfall for everyone: Gross Pay, LOP, what's left after LOP, then
  // (non-cash only) the statutory deductions, down to the final take-home
  // figure. Cash pay has no PF/ESIC/L.A. since those don't apply to cash
  // workers, but it does have its own Gross Pay the same as non-cash.
  const salaryTiles = isCash
    ? `${salTile('Gross Pay', fmtSalMoney(d.gross_pay), 'accent')}
       ${salTile(lopLabel, fmtSalMoney(d.lop_amount), 'red')}
       ${salTile('Gross - LOP', fmtSalMoney(grossMinusLop))}
       ${salTile('Salary', fmtSalMoney(d.net_salary), 'green')}`
    : `${salTile('Gross Pay', fmtSalMoney(d.gross_pay), 'accent')}
       ${salTile(lopLabel, fmtSalMoney(d.lop_amount), 'red')}
       ${salTile('Gross - LOP', fmtSalMoney(grossMinusLop))}
       ${salTile('PF', fmtSalMoney(d.pf_ee))}
       ${salTile('ESIC', fmtSalMoney(d.esic_ip))}
       ${salTile('L.A.', fmtSalMoney(d.labour_act))}
       ${salTile('Net Pay', fmtSalMoney(d.net_salary), 'green')}`;

  const allowanceSection = d.has_allowance ? `
    <div class="sal-section">
      <div class="sal-section-title">&#127873; Allowance</div>
      <div class="sal-grid">
        ${salTile('Allowance', fmtSalMoney(d.allowance), 'accent')}
        ${salTile('Allowance Deduction (LOP)', fmtSalMoney(d.allowance_deduction), 'red')}
      </div>
    </div>` : '';

  const leaveDates = d.leave_dates || [];
  const leaveSection = `
    <div class="sal-section">
      <div class="sal-section-title">&#128198; Leave Days This Month</div>
      ${leaveDates.length ? `
        <div class="sal-leave-list">
          ${leaveDates.map(ld => {
            const isHalf = ld.status === 'H';
            const isReserved = ld.remark === 'Reserved';
            const badgeCls = isHalf
              ? (isReserved ? 'half-reserved' : 'half-unreserved')
              : (isReserved ? 'reserved' : 'unreserved');
            return `
            <div class="sal-leave-row">
              <span class="sal-leave-date">${fmtSalLeaveDate(ld.date)}</span>
              <span class="sal-leave-badge ${badgeCls}">
                ${isHalf ? 'Half Day' : 'Full Day'} &middot; ${ld.remark}
              </span>
            </div>`;
          }).join('')}
        </div>` : `<div class="sal-empty" style="padding:6px 0">No leave taken this month.</div>`}
    </div>`;

  body.innerHTML = `
    ${asOfHtml}
    <div class="sal-section">
      <div class="sal-section-title">&#128176; Salary Summary</div>
      <div class="sal-grid">
        ${salTile('Employee ID', d.employee_id)}
        ${salTile('Name', d.alias_name || d.employee_name)}
        ${salaryTiles}
        ${salTile('Advance', fmtSalMoney(d.advance))}
        ${salTile('Available Salary', fmtSalMoney(d.available_salary), 'green')}
      </div>
    </div>
    ${allowanceSection}
    <div class="sal-section">
      <div class="sal-section-title">&#128197; Attendance &amp; Incentives</div>
      <div class="sal-grid">
        ${salTile('Present Days', d.present_days)}
        ${salTile('Absent Days', d.absent_days)}
        ${salTile('Permission Days Debited', d.permission_days_debited)}
        ${salTile('Permission Incentive', `${d.permission_incentive_days || 0}d &middot; ${fmtSalMoney(d.permission_incentive_amount)}`)}
        ${salTile('Leave Incentive', `${d.leave_incentive_days || 0}d &middot; ${fmtSalMoney(d.leave_incentive_amount)}`)}
      </div>
    </div>
    <div class="sal-section">
      <div class="sal-section-title">&#128336; Permission Timing</div>
      <div class="sal-grid">
        ${salTile('Total Permission', pt.total_perm_fmt || '0:00')}
        ${salTile('Free Permission', pt.free_perm_fmt || '0:00')}
        ${salTile('Net Permission', pt.net_perm_fmt || '0:00')}
        ${salTile('Earned Days', pt.earned_days || 0)}
        ${salTile('Debited Days', pt.debited_days || 0)}
      </div>
    </div>
    ${leaveSection}`;
}

function _renderSalRetry(body, message, employeeId, isOwnLoad) {
  body.textContent = message + ' ';
  const link = document.createElement('a');
  link.href = '#';
  link.textContent = 'Retry';
  link.style.color = 'var(--accent)';
  link.onclick = ev => { ev.preventDefault(); loadSalaryFor(employeeId, isOwnLoad); };
  body.appendChild(link);
}

async function loadSalaryFor(employeeId, isOwnLoad) {
  const body = document.getElementById('salBody');
  body.className = 'sal-empty';
  body.innerHTML = 'Loading&hellip;';
  const wakingTimer = setTimeout(() => {
    if (body.innerHTML === 'Loading&hellip;') body.innerHTML = 'Waking up the payroll service&hellip; this can take up to a minute.';
  }, 4000);
  try {
    const r = await fetch(`/api/salary/${encodeURIComponent(employeeId)}`);
    const d = await r.json();
    clearTimeout(wakingTimer);
    if (!r.ok) {
      // Payroll app is a separate free-tier service that can be asleep —
      // give a retry instead of leaving the tab stuck on a dead-end error.
      if (isOwnLoad) _salOwnLoadOk = false;
      _renderSalRetry(body, d.error || 'Failed to load salary data.', employeeId, isOwnLoad);
      return;
    }
    if (isOwnLoad) _salOwnLoadOk = true;
    renderSalaryData(d);
  } catch {
    clearTimeout(wakingTimer);
    if (isOwnLoad) _salOwnLoadOk = false;
    _renderSalRetry(body, 'Network error.', employeeId, isOwnLoad);
  }
}

function initSalaryTab() {
  const me = window._authUser;
  // Retry the user's own salary card if it previously failed (e.g. the
  // payroll service was asleep) — otherwise this stays a dead end until a
  // full page reload, since the dashboard's own refresh button doesn't
  // touch this tab.
  if (!_salOwnLoadOk && me?.id) loadSalaryFor(me.id, true);

  if (_salLoadedOnce) return;
  _salLoadedOnce = true;

  if (me?.role !== 'OWNER') return;

  const searchInput = document.getElementById('salSearchInput');
  const dropdown     = document.getElementById('salSearchDropdown');

  async function ensureEmployees() {
    if (_salEmployees) return _salEmployees;
    const r = await fetch('/api/employees');
    _salEmployees = await r.json();
    return _salEmployees;
  }

  function renderOptions(list) {
    if (!list.length) { dropdown.innerHTML = '<div class="sal-search-option" style="color:var(--text-dim)">No match found</div>'; return; }
    dropdown.innerHTML = list.map(e =>
      `<div class="sal-search-option" data-id="${e.id}">${e.id} &mdash; ${e.alias_name || e.name}</div>`
    ).join('');
    dropdown.querySelectorAll('.sal-search-option[data-id]').forEach(el => {
      el.onmousedown = ev => {
        ev.preventDefault();
        searchInput.value = el.textContent;
        dropdown.classList.remove('open');
        loadSalaryFor(el.dataset.id);
      };
    });
  }

  searchInput.addEventListener('focus', async () => {
    const list = await ensureEmployees();
    renderOptions(list);
    searchInput.select();
    dropdown.classList.add('open');
  });
  searchInput.addEventListener('input', async () => {
    const list = await ensureEmployees();
    const q = searchInput.value.toLowerCase();
    const filtered = q ? list.filter(e => String(e.id).includes(q) || (e.alias_name || e.name || '').toLowerCase().includes(q)) : list;
    renderOptions(filtered);
    dropdown.classList.add('open');
  });
  searchInput.addEventListener('blur', () => setTimeout(() => dropdown.classList.remove('open'), 160));
}

/* ── Sales tab (appachi-sales Firestore, read-only) ──
   Mirrors the separate Sales app's own saved-report data, but always shows
   only today's activity — no date picker. "Today" is the majority activity
   date recorded inside a report (same rule the Sales app itself uses to
   figure out what business day a report is for), not when it was uploaded.
   If more than one report was saved for today, the latest one wins — a
   re-upload is treated as replacing the earlier one, not adding to it. ── */
const SALES_FIREBASE_CONFIG = {
  apiKey: "AIzaSyAgv0fGfMJEvUQ7sBfLze3hI5AU01iuoaQ",
  authDomain: "appachi-sales.firebaseapp.com",
  projectId: "appachi-sales",
  storageBucket: "appachi-sales.firebasestorage.app",
  messagingSenderId: "63258854157",
  appId: "1:63258854157:web:947ab767218d6b2461a644"
};
let _salesDb = null;

function _salesGetDb() {
  if (!_salesDb) {
    const app = firebase.initializeApp(SALES_FIREBASE_CONFIG, 'salesApp');
    _salesDb = app.firestore();
  }
  return _salesDb;
}

// Same majority-date logic as the Sales app's own getReportDate().
function _salesReportDate(grouped) {
  const counts = {};
  for (const name in grouped) {
    for (const e of grouped[name]) {
      if (!e.date) continue;
      counts[e.date] = (counts[e.date] || 0) + 1;
    }
  }
  let best = null, bestCount = 0;
  for (const d in counts) {
    if (counts[d] > bestCount) { best = d; bestCount = counts[d]; }
  }
  return best;
}

// DD/MM/YYYY in IST, matching the date format the Sales app stores per activity.
function _salesTodayDDMMYYYY() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  return `${get('day')}/${get('month')}/${get('year')}`;
}

function _salesWeightTotals(entries) {
  let gold = 0, silver = 0;
  for (const e of entries) {
    if (e.isReturn) continue;
    gold += e.goldWeight || 0;
    silver += e.silverWeight || 0;
  }
  return { gold, silver };
}

function _salesActivityCount(entries) {
  return entries.filter(e => !e.isReturn && !e.isGoldPartialWeight).length;
}

// Same rule as the Sales app's own lastRealActivity() — entries are already
// stored oldest-first (by sortKey), so walk back from the end and skip the
// synthetic "gold partial weight" pseudo-activity rows.
function _salesLastRealActivity(entries) {
  for (let i = entries.length - 1; i >= 0; i--) {
    if (!entries[i].isGoldPartialWeight) return entries[i];
  }
  return entries[entries.length - 1] || null;
}

function _salesLastTimeLabel(entries) {
  const last = _salesLastRealActivity(entries);
  if (!last) return '—';
  return last.hasTime ? (last.time || '—') : 'No time';
}

// Strips spaces/hyphens/underscores/periods so "RAJI-2" (Firestore employee
// roster) and "RAJI 2" (this app's own employees table) compare equal.
function _salesNormName(s) {
  return String(s || '').trim().toLowerCase().replace(/[\s\-_.]+/g, '');
}

// The New/Old Staff classification lives only in the Sales app's own
// Employees page (appData/employees in the same Firestore project) — this
// app's employees table has no such column.
async function _salesGetStaffRoster() {
  try {
    const doc = await _salesGetDb().collection('appData').doc('employees').get();
    const list = doc.exists && Array.isArray(doc.data().list) ? doc.data().list : [];
    return list.filter(e => e && e.name);
  } catch { return []; }
}

// Same "Female-only" roster rule as the Next to Attend queue below, applied
// to the main Sales list itself — a male staff member's activity rows can
// still be in the uploaded report, but they shouldn't appear in this list.
let _salesExcludedNormSetCache = null;
async function _salesGetExcludedNormSet() {
  if (_salesExcludedNormSetCache) return _salesExcludedNormSetCache;
  const roster = await _salesGetStaffRoster();
  _salesExcludedNormSetCache = new Set(
    roster.filter(e => e.gender !== 'Female').map(e => _salesNormName(e.name))
  );
  return _salesExcludedNormSetCache;
}

let _salesAliasMapCache = null;
async function _salesGetAliasMap() {
  if (_salesAliasMapCache) return _salesAliasMapCache;
  try {
    const list = await fetch('/api/employees').then(r => r.json());
    const map = {};
    for (const e of list) map[_salesNormName(e.alias_name || e.name)] = e.alias_name || e.name;
    _salesAliasMapCache = map;
  } catch { _salesAliasMapCache = {}; }
  return _salesAliasMapCache;
}

// Aliases booked on leave (any type — full or half day) for today specifically,
// not the two-week window /api/team-leaves normally returns.
async function _salesGetLeaveAliasesToday() {
  try {
    const todayISO = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
    const rows = await fetch('/api/team-leaves').then(r => r.json());
    return new Set(Array.isArray(rows) ? rows.filter(r => r.date === todayISO).map(r => r.emp_alias) : []);
  } catch { return new Set(); }
}

// No activity today at all ranks as more overdue than any actual sale time,
// however early — an employee who hasn't attended a single customer yet
// today is next in line before someone who sold something this morning.
function _salesDelayKey(entries) {
  if (!entries || !entries.length) return -Infinity;
  return _salesLastRealActivity(entries)?.sortKey ?? -Infinity;
}

// Ranks each staff-type group by longest-overdue-first and returns the top 3
// of each, for the pinned "Next to Attend" queue.
async function _salesComputeNextToAttend(grouped) {
  const [roster, aliasMap, leaveToday] = await Promise.all([
    _salesGetStaffRoster(), _salesGetAliasMap(), _salesGetLeaveAliasesToday(),
  ]);
  const namesByNorm = {};
  for (const n in grouped) namesByNorm[_salesNormName(n)] = n;

  const byGroup = { 'New Staff': [], 'Old Staff': [] };
  for (const emp of roster) {
    if (emp.gender !== 'Female') continue;
    if (String(emp.designation || '').trim().toLowerCase() !== 'sales') continue;
    if (emp.staffType !== 'New Staff' && emp.staffType !== 'Old Staff') continue;
    const norm = _salesNormName(emp.name);
    // /api/employees only returns active (non-disabled) employees, so a
    // missing alias here means they're disabled in the Stocks app.
    const alias = aliasMap[norm];
    if (!alias) continue;
    if (leaveToday.has(alias)) continue;
    const entries = grouped[namesByNorm[norm]] || [];
    byGroup[emp.staffType].push({ name: emp.name, alias, delay: _salesDelayKey(entries) });
  }

  const result = {};
  for (const group of ['New Staff', 'Old Staff']) {
    result[group] = byGroup[group].slice().sort((a, b) => a.delay - b.delay).slice(0, 3);
  }
  return result;
}

// Fire-and-forget: the server is the source of truth for who was already in
// each queue, so it only pushes a notification to whoever is genuinely new
// to their staff-type's top 3 this time around.
function _salesSyncNextToAttend(nextToAttend) {
  const newStaff = (nextToAttend['New Staff'] || []).map(e => e.alias);
  const oldStaff = (nextToAttend['Old Staff'] || []).map(e => e.alias);
  if (!newStaff.length && !oldStaff.length) return;
  fetch('/api/next-to-attend/sync', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ newStaff, oldStaff }),
  }).catch(() => {});
}

// State for the OWNER-only search + sortable columns. Rebuilt into
// #salesListWrap only (not the whole tab) so the search input never loses
// focus while typing.
let _salesCurrentGrouped = null;
let _salesCurrentToday   = '';
let _salesSearchQuery    = '';
let _salesSortState      = { key: 'last', dir: 1 };
let _salesExcludedNorm   = new Set();

const SALES_SORT_COLUMNS = [
  { key: 'name',   label: 'Name' },
  { key: 'gold',   label: 'Gold' },
  { key: 'silver', label: 'Silver' },
  { key: 'last',   label: 'Last Sale' },
];

function _salesSortValue(key, name, entries) {
  if (key === 'name') return name.toLowerCase();
  if (key === 'gold') return _salesWeightTotals(entries).gold;
  if (key === 'silver') return _salesWeightTotals(entries).silver;
  return _salesLastRealActivity(entries)?.sortKey ?? 0;
}

// Most recent activity across every employee, for the pinned "Last bill"
// summary at the top of the tab — so it's visible without expanding or
// sorting anything.
function _salesOverallLastActivity(grouped) {
  let best = null;
  for (const name in grouped) {
    const last = _salesLastRealActivity(grouped[name]);
    if (last && (!best || (last.sortKey ?? 0) > (best.sortKey ?? 0))) best = last;
  }
  return best;
}

function _salesSortedFilteredNames() {
  const grouped = _salesCurrentGrouped || {};
  let names = Object.keys(grouped).filter(n => !_salesExcludedNorm.has(_salesNormName(n)));
  if (_salesSearchQuery) {
    const q = _salesSearchQuery.toLowerCase();
    names = names.filter(n => n.toLowerCase().includes(q));
  }
  const { key, dir } = _salesSortState;
  names.sort((a, b) => {
    const av = _salesSortValue(key, a, grouped[a]);
    const bv = _salesSortValue(key, b, grouped[b]);
    if (typeof av === 'string') return dir * av.localeCompare(bv);
    return dir * (av - bv);
  });
  return names;
}

function _salesSetSort(key) {
  _salesSortState.dir = _salesSortState.key === key ? -_salesSortState.dir : (key === 'gold' || key === 'silver' ? -1 : 1);
  _salesSortState.key = key;
  _salesRenderSort();
  _salesRenderList();
}

function _salesOnSearchInput(value) {
  _salesSearchQuery = value;
  _salesRenderList();
}

function _salesRenderSort() {
  const wrap = document.getElementById('salesSortWrap');
  if (!wrap) return;
  wrap.innerHTML = SALES_SORT_COLUMNS.map(col => {
    const active = _salesSortState.key === col.key;
    const arrow = active ? (_salesSortState.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
    return `<button type="button" class="sales-sort-btn${active ? ' active' : ''}" onclick="_salesSetSort('${col.key}')">${col.label}${arrow}</button>`;
  }).join('');
}

function _salesRenderList() {
  const listWrap = document.getElementById('salesListWrap');
  if (!listWrap) return;
  const grouped = _salesCurrentGrouped || {};
  const names = _salesSortedFilteredNames();

  if (!names.length) {
    listWrap.innerHTML = '<div class="sal-empty" style="padding:24px 0">No matching employees.</div>';
    return;
  }

  listWrap.innerHTML = names.map((name, i) => {
    const entries = grouped[name];
    const { gold, silver } = _salesWeightTotals(entries);
    const count = _salesActivityCount(entries);
    const lastTime = _salesLastTimeLabel(entries);
    const detailRows = entries.map(e => `
      <tr>
        <td>${escHtml(e.date || '—')}</td>
        <td>${e.hasTime ? escHtml(e.time || '—') : '(no time)'}</td>
        <td>${e.goldWeight ? e.goldWeight.toFixed(2) + 'g' : '—'}</td>
        <td>${e.silverWeight ? e.silverWeight.toFixed(2) + 'g' : '—'}</td>
        <td>${escHtml(e.actionText || '—')}</td>
        <td>${escHtml(e.billNo || '—')}</td>
      </tr>`).join('');
    return `
      <div class="sales-person" id="salesPerson${i}">
        <div class="sales-person-row" onclick="document.getElementById('salesPerson${i}').classList.toggle('open')">
          <span class="sales-caret">&#9654;</span>
          <span class="sales-person-name">${escHtml(name)}</span>
        </div>
        <div class="sales-stats" onclick="document.getElementById('salesPerson${i}').classList.toggle('open')">
          <div class="sales-stat time"><span class="sales-stat-label">Last Sale</span><span class="sales-stat-value">${escHtml(lastTime)}</span></div>
          <div class="sales-stat gold"><span class="sales-stat-label">Gold</span><span class="sales-stat-value">${gold.toFixed(2)}g</span></div>
          <div class="sales-stat silver"><span class="sales-stat-label">Silver</span><span class="sales-stat-value">${silver.toFixed(2)}g</span></div>
          <div class="sales-stat count"><span class="sales-stat-label">Activities</span><span class="sales-stat-value">${count}</span></div>
        </div>
        <div class="sales-detail">
          <table>
            <thead><tr><th>Date</th><th>Time</th><th>Gold</th><th>Silver</th><th>Activity</th><th>Bill/Ref</th></tr></thead>
            <tbody>${detailRows}</tbody>
          </table>
        </div>
      </div>`;
  }).join('');
}

function _salesRenderNextToAttend(nextToAttend) {
  if (!nextToAttend) return '';
  const rows = ['New Staff', 'Old Staff'].map(group => {
    const entries = nextToAttend[group] || [];
    if (!entries.length) return '';
    const names = entries.map((e, i) => i === 0 ? `<span class="first">${escHtml(e.name)}</span>` : escHtml(e.name)).join(' &#8594; ');
    return `<div class="next-attend-row"><span class="next-attend-tag">${group}</span><span class="next-attend-names">${names}</span></div>`;
  }).filter(Boolean).join('');
  return rows ? `<div class="next-attend-box">${rows}</div>` : '';
}

function renderSalesToday(grouped, today, nextToAttend) {
  const body = document.getElementById('salesBody');
  body.className = '';
  _salesCurrentGrouped = grouped;
  _salesCurrentToday   = today;
  _salesSearchQuery    = '';
  _salesSortState      = { key: 'last', dir: 1 };

  const isOwner  = window._authUser?.role === 'OWNER';
  const multiple = Object.keys(grouped).length > 1;

  const overallLast = _salesOverallLastActivity(grouped);
  const lastBillLabel = overallLast ? (overallLast.hasTime ? (overallLast.time || '—') : 'No time') : '—';

  const searchBox = (isOwner && multiple)
    ? `<input type="text" id="salesSearchInput" class="sal-search-input" placeholder="Search employee name…" oninput="_salesOnSearchInput(this.value)" style="margin-bottom:12px">`
    : '';
  const sortWrap = (isOwner && multiple) ? `<div class="sales-sort-row" id="salesSortWrap"></div>` : '';

  body.innerHTML = `
    ${_salesRenderNextToAttend(nextToAttend)}
    <div class="last-bill-pin">
      <span class="last-bill-dot"></span>
      <div>
        <div class="last-bill-label">Last Bill</div>
        <div class="last-bill-time">${escHtml(lastBillLabel)}</div>
      </div>
    </div>
    <div class="sal-asof">&#128203; ${escHtml(today)}</div>
    ${searchBox}
    ${sortWrap}
    <div id="salesListWrap"></div>`;

  if (sortWrap) _salesRenderSort();
  _salesRenderList();
}

async function loadSalesTab() {
  const body = document.getElementById('salesBody');
  body.className = 'sal-empty';
  body.innerHTML = 'Loading&hellip;';
  try {
    const db = _salesGetDb();
    const snapshot = await db.collection('savedReports').orderBy('savedAt', 'desc').limit(50).get();
    const today = _salesTodayDDMMYYYY();
    let matchGrouped = null;
    for (const doc of snapshot.docs) {
      let grouped = {};
      try { grouped = JSON.parse(doc.data().groupedJson || '{}'); } catch (_) { /* skip malformed report */ }
      if (_salesReportDate(grouped) === today) { matchGrouped = grouped; break; }
    }
    if (!matchGrouped || !Object.keys(matchGrouped).length) {
      body.className = 'sal-empty';
      body.innerHTML = 'No sales activity saved for today yet.';
      return;
    }

    const [nextToAttend, excludedNorm] = await Promise.all([
      _salesComputeNextToAttend(matchGrouped),
      _salesGetExcludedNormSet(),
    ]);
    _salesExcludedNorm = excludedNorm;
    renderSalesToday(matchGrouped, today, nextToAttend);
    _salesSyncNextToAttend(nextToAttend);
  } catch (err) {
    body.className = 'sal-empty';
    body.innerHTML = `Could not load sales data. <a href="#" onclick="loadSalesTab();return false;" style="color:var(--accent)">Retry</a>`;
  }
}

function initSalesTab() {
  loadSalesTab();
}

function switchTeam(day) {
  document.getElementById('tabLastDone').classList.toggle('active', day==='lastdone');
  document.getElementById('tabToday').classList.toggle('active', day==='today');
  document.getElementById('tabTomorrow').classList.toggle('active', day==='tomorrow');
  document.getElementById('teamLastDoneCard').style.display = day==='lastdone' ? '' : 'none';
  document.getElementById('teamTodayCard').style.display    = day==='today' ? '' : 'none';
  document.getElementById('teamTomorrowCard').style.display = day==='tomorrow' ? '' : 'none';
}

// Only activate tab mode on mobile
function initTeamTabs() {
  // teamLastDoneCard already starts hidden (display:none in the HTML) on
  // every platform — only switchTeam('lastdone') or the desktop modal reveal it.
  if (window.innerWidth <= 720) {
    document.getElementById('teamTomorrowCard').style.display = 'none';
    document.getElementById('tabToday').classList.add('active');
  }
}

function greeting() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return 'Good morning';
  if (h >= 12 && h < 17) return 'Good afternoon';
  if (h >= 17 && h < 21) return 'Good evening';
  return 'Good night';
}

function setSpinner(on) {
  ['refreshIconMobile','refreshIconDesktop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.animation = on ? 'spin .6s linear infinite' : '';
  });
}

async function loadDashboard(forceRefresh) {
  if (!_me) return;
  setSpinner(true);

  _today    = istFmt(new Date());
  _tomorrow = istFmt(new Date(Date.now() + 86400000));

  // Update titles
  document.getElementById('dashDate').textContent         = dayFmt(_today);
  document.getElementById('mobileDateLine').textContent   = dayFmt(_today);
  document.getElementById('myTodayTitle').textContent     = 'Today — ' + shortFmt(_today);
  document.getElementById('myTomorrowTitle').textContent  = 'Tomorrow — ' + shortFmt(_tomorrow);
  document.getElementById('teamTodayTitle').textContent   = 'Today — ' + shortFmt(_today);
  document.getElementById('teamTomorrowTitle').textContent = 'Tomorrow — ' + shortFmt(_tomorrow);

  try {
    const [[todayData, tomorrowData], myLeaves, myLastDone, stocksLastDone, myDoneMarks] = await Promise.all([
      Promise.all([
        fetch('/api/entry/all?date='+_today).then(r=>r.json()).catch(()=>[]),
        fetch('/api/entry/all?date='+_tomorrow).then(r=>r.json()).catch(()=>[]),
      ]),
      fetch('/api/my-leaves').then(r=>r.json()).catch(()=>[]),
      fetch('/api/my-last-done').then(r=>r.json()).catch(()=>({})),
      fetch('/api/stocks-last-done').then(r=>r.json()).catch(()=>[]),
      fetch('/api/my-done-marks?date='+_today).then(r=>r.json()).catch(()=>[]),
    ]);

    _doneMarks = new Set(myDoneMarks);
    renderMine('myToday',    todayData,    _me.name, myLastDone, true);
    renderMine('myTomorrow', tomorrowData, _me.name, myLastDone, false);
    updateStreakBar(todayData, _me.name);
    renderTeam('teamToday',    todayData);
    renderTeam('teamTomorrow', tomorrowData);
    renderLastDone('teamLastDone', stocksLastDone);
    _teamTodayData    = todayData;
    _teamTomorrowData = tomorrowData;
    _stocksLastDoneData = stocksLastDone;
    showLeaveBanner(myLeaves);
  } catch(e) {
    console.error(e);
  } finally {
    setSpinner(false);
  }
}

function lastDoneHint(stockId, lastDoneMap) {
  const d = (lastDoneMap || {})[stockId];
  if (!d) return 'Never done this before';
  return 'Last done ' + new Date(d + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ── Streak bar + Mark Done (Today only) ──────────────────────────────────────
let _doneMarks = new Set(); // stock_ids I've marked done for _today

function updateStreakBar(todayData, alias) {
  const bar = document.getElementById('streakBar');
  if (!bar) return;
  const mine  = (todayData||[]).filter(s => Array.isArray(s.aliases) && s.aliases.includes(alias));
  const total = mine.length;
  if (!total) { bar.style.display = 'none'; return; }
  const done = mine.filter(s => _doneMarks.has(s.stock_id)).length;
  bar.style.display = 'flex';
  document.getElementById('streakFill').style.width = Math.round((done / total) * 100) + '%';
  document.getElementById('streakCount').textContent = `${done}/${total}`;
  return { done, total };
}

async function toggleDoneMark(stockId, btn) {
  const wasDone = _doneMarks.has(stockId);
  if (wasDone) {
    const ok = await confirmModal('Unmark this stock as done? Your streak will go back down.', { confirmText: 'Unmark' });
    if (!ok) return;
  }
  btn.disabled = true;
  try {
    const r = await fetch(wasDone ? `/api/done-marks/${_today}/${stockId}` : '/api/done-marks', {
      method:  wasDone ? 'DELETE' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    wasDone ? undefined : JSON.stringify({ date: _today, stock_id: stockId }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to update', 'error'); return; }
    if (wasDone) _doneMarks.delete(stockId); else _doneMarks.add(stockId);
    btn.classList.toggle('is-done', !wasDone);
    btn.textContent = !wasDone ? '✓ Done' : 'Mark Done';
    const status = updateStreakBar(_teamTodayData, _me.name);
    if (!wasDone && status && status.done === status.total) celebrate();
  } catch {
    toast('Network error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
  }
}

function celebrate() {
  const ov = document.createElement('div');
  ov.className = 'celebrate-overlay';
  const colors = ['#d4af37','#2ecc71','#ff5d5d','#3b82f6','#e8c96a'];
  let confetti = '';
  for (let i = 0; i < 26; i++) {
    const left  = Math.random() * 100;
    const delay = (Math.random() * 0.5).toFixed(2);
    const dur   = (2.6 + Math.random() * 1.2).toFixed(2);
    const color = colors[i % colors.length];
    confetti += `<div class="confetti-piece" style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${dur}s"></div>`;
  }
  ov.innerHTML = confetti + `<div class="celebrate-emoji">🎉</div><div class="celebrate-text">Hooray! All done for today!</div>`;
  document.body.appendChild(ov);
  setTimeout(() => ov.remove(), 4000);
}

function renderMine(id, data, alias, lastDoneMap, markable) {
  const el = document.getElementById(id);
  if (!el) return;
  const mine = (data||[]).filter(s => Array.isArray(s.aliases) && s.aliases.includes(alias));
  el.innerHTML = mine.length
    ? mine.map(s => {
        if (!markable) return `<div class="chip"><span class="chip-label">${s.label}</span><span class="chip-hint">${lastDoneHint(s.stock_id, lastDoneMap)}</span></div>`;
        const done = _doneMarks.has(s.stock_id);
        return `<div class="chip chip-markable" data-stock-id="${s.stock_id}">
          <div class="chip-info"><span class="chip-label">${s.label}</span><span class="chip-hint">${lastDoneHint(s.stock_id, lastDoneMap)}</span></div>
          <button type="button" class="chip-done-btn${done ? ' is-done' : ''}" onclick="toggleDoneMark('${s.stock_id}', this)">${done ? '✓ Done' : 'Mark Done'}</button>
        </div>`;
      }).join('')
    : '<span class="chip-none">No assignments saved yet</span>';
}

function renderTeam(id, data) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!data||!data.length) { el.innerHTML='<span class="chip-none">No assignments saved yet</span>'; return; }
  el.innerHTML = data.map(s=>
    `<div class="team-row">
      <span class="team-stock">${s.label}</span>
      <span class="team-names">${(s.aliases||[]).join(', ')}</span>
    </div>`
  ).join('');
}

function renderLastDone(id, data) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!data || !data.length) { el.innerHTML = '<span class="chip-none">No entries recorded yet</span>'; return; }
  el.innerHTML = data.map(s => {
    if (!s.last_date) {
      return `<div class="lastdone-row">
        <div class="lastdone-top">
          <span class="lastdone-stock">${s.label}</span>
          <span class="lastdone-never">Never done</span>
        </div>

async function showNotifPromptBanner() {
  const banner = document.getElementById('notifPromptBanner');
  const text   = document.getElementById('notifPromptText');
  const btn    = document.getElementById('notifPromptBtn');
  if (!banner || !text || !btn) return;

  // Native Capacitor app uses FCM — web push banner not needed
  if (window.Capacitor?.isNativePlatform?.()) return;

  // Browser doesn't support push at all
  if (!('Notification' in window) || !('PushManager' in window) || !('serviceWorker' in navigator)) return;

  const perm = Notification.permission;

  if (perm === 'denied') {
    // Blocked — guide them to settings
    text.textContent = 'Notifications are blocked. Enable them in your browser or device settings to receive stock assignments.';
    btn.textContent  = 'How to Enable';
    btn.onclick = () => {
      infoModal('To enable notifications:\n\n• Chrome/Edge: Click the lock icon (🔒) in the address bar → Notifications → Allow\n• Firefox: Click the shield icon → Permissions → Allow Notifications\n• Android: Go to Settings → Apps → Browser → Notifications → Allow', { title: 'Enable notifications' });
    };
    banner.classList.add('show', 'state-blocked');
    return;
  }

  // Check if already subscribed
  try {
    const reg = window._swReg || await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (perm === 'granted' && sub) return; // Already set up — no banner needed
  } catch {}

  // Not yet subscribed (either permission not asked yet, or granted but no subscription)
  if (perm === 'default') {
    text.textContent = 'Enable notifications to receive your stock assignments directly on this device.';
    btn.textContent  = 'Enable Now';
  } else {
    text.textContent = 'Notifications are allowed but not active. Tap to re-enable and receive stock assignments.';
    btn.textContent  = 'Re-enable';
  }
  btn.onclick = async () => {
    await window.toggleNotifications();
    // Re-check after toggle and hide banner if now subscribed
    try {
      const reg = window._swReg || await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (Notification.permission === 'granted' && sub) {
        banner.classList.remove('show');
      } else if (Notification.permission === 'denied') {
        // User just denied — switch to blocked state
        banner.classList.remove('state-ask');
        banner.classList.add('state-blocked');
        text.textContent = 'Notifications are blocked. Enable them in your browser or device settings.';
        btn.textContent  = 'How to Enable';
        btn.onclick = () => infoModal('To enable notifications:\n\n• Chrome/Edge: Click the lock icon (🔒) in the address bar → Notifications → Allow\n• Firefox: Click the shield icon → Permissions → Allow Notifications\n• Android: Go to Settings → Apps → Browser → Notifications → Allow', { title: 'Enable notifications' });
      }
    } catch {}
  };
  banner.classList.add('show', 'state-ask');
}

// Boot: wait for auth.js, then load
(async () => {
  for (let i=0;i<30;i++) { if (window._authUser) break; await new Promise(r=>setTimeout(r,100)); }
  _me = window._authUser;
  if (!_me) return;

  // Hide Entry nav on native (Capacitor) app — Entry is web-only
  if (window.Capacitor?.isNativePlatform?.()) {
    document.getElementById('nav-entry-desktop')?.remove();
    document.getElementById('nav-entry-mobile')?.remove();
    // Print / Gents Print are website-only too
    document.getElementById('printBtnsToday')?.remove();
    document.getElementById('printBtnsTomorrow')?.remove();
  }

  // Mobile header
  const _role = _me.role || 'STAFF';
  document.getElementById('mobileUserName').textContent = _me.name + (_role === 'COMPUTER' ? ' · Staff' : '');

  // Greeting
  const greet = document.getElementById('greetText');
  const sub   = document.getElementById('greetSub');
  if (greet) greet.textContent = greeting() + '!';
  if (sub)   sub.textContent   = 'Here are your assignments for today and tomorrow.';

  initTeamTabs();
  await loadDashboard();
  _refreshLeaveApprovalBadge();
  _refreshFeedbackBadge();
  // Small delay to let pwa.js finish autoSubscribe before checking state
  setTimeout(showNotifPromptBanner, 1500);

  // Next to Attend only recomputes (and can only notify anyone) when a
  // browser actually runs loadSalesTab() — which otherwise only happens if
  // someone manually opens the Sales tab. Run it in the background here too,
  // and on a repeating timer, so the queue — and its notifications — stay
  // live for as long as any dashboard is open, regardless of which tab is
  // showing.
  loadSalesTab().catch(() => {});
  setInterval(() => loadSalesTab().catch(() => {}), 5 * 60 * 1000);

  // Deep-link from Settings (Change Specific Tasks / Admin Entry / Feedback Inbox /
  // Leave Approvals moved there on mobile, since those tools only exist as modals
  // here on the dashboard, and the sidebar that normally hosts Leave Approvals is
  // hidden on mobile)
  if (_me.role === 'OWNER') {
    const openParam = new URLSearchParams(location.search).get('open');
    if (openParam === 'change-task') openChangeTaskModal();
    else if (openParam === 'admin-entry') openAdminEntryModal();
    else if (openParam === 'feedback-inbox') openFeedbackInboxModal();
    else if (openParam === 'leave-approvals') openLeaveApprovalsModal();
    else if (openParam === 'stock-reassignments') openStockReassignmentsModal();
    else if (openParam === 'employee-history') openEmployeeHistoryModal();
    if (openParam) history.replaceState(null, '', location.pathname);
  }

  // Deep-link from a stock-reminder push notification — scroll to and
  // briefly highlight the chip for the stock that triggered it.
  const highlightId = new URLSearchParams(location.search).get('highlight');
  if (highlightId) {
    const chip = document.querySelector(`#myToday [data-stock-id="${CSS.escape(highlightId)}"]`);
    if (chip) { chip.scrollIntoView({ behavior: 'smooth', block: 'center' }); chip.classList.add('chip-highlight'); }
    history.replaceState(null, '', location.pathname);
  }
})();

      _loadLeaveApprovals();

      // had already caused to move — otherwise the replacement keeps them
      // permanently even though the leave itself no longer exists.
      if (action === 'approve' && d.reassignments?.length) {

    } else {
      btn.disabled = false; btn.textContent = action === 'approve' ? '✓ Approve' : '✗ Reject';

// Splits a list into Male/Female/Other groups and renders each with a
// section header, using `rowHtml` to render one entry.
function _ehGenderSections(list, genderOf, rowHtml) {
  const male   = list.filter(x => genderOf(x) === 'MALE');
  const female = list.filter(x => genderOf(x) === 'FEMALE');
  const other  = list.filter(x => !['MALE', 'FEMALE'].includes(genderOf(x)));
  const section = (label, arr) => arr.length ? `
    <div style="font-size:10px;font-weight:800;letter-spacing:.08em;color:#8b98a8;text-transform:uppercase;margin:12px 0 6px">${label}</div>
    ${arr.map(rowHtml).join('')}` : '';
  return section('Male', male) + section('Female', female) + section('Other', other);
}

function _ehRenderEmployeeList(list) {

function _ehFilterList(q) {

async function _selectStockHistory(stockId) {
  const stockMeta = (_ehStocks || []).find(s => s.id === stockId);
  document.getElementById('ehTitle').textContent = stockMeta?.label || stockId;
  const body = document.getElementById('ehBody');
  body.innerHTML = `
    <button onclick="_loadStockHistoryList()" style="background:none;border:none;color:#d4af37;cursor:pointer;font-size:12px;font-weight:700;margin-bottom:14px;padding:0;font-family:inherit">&larr; Back to stocks</button>
    <div id="ehStockPeopleList">Loading&hellip;</div>`;
  try {
    if (!_ehEmployees) {
      const r = await fetch('/api/employees');
      _ehEmployees = await r.json();
    }
    const genderByAlias = {};
    _ehEmployees.forEach(e => { genderByAlias[e.alias_name || e.name] = (e.gender || '').toUpperCase(); });

    const r = await fetch('/api/admin/fairness');
    const data = await r.json();
    let people = (data.stocks || []).find(s => s.stock_id === stockId)?.people || [];
    // Shop Opening/Closing are male-only — never list a female employee here
    if (EH_GENTS_STOCKS.has(stockId)) people = people.filter(p => genderByAlias[p.alias] === 'MALE');

    const wrap = document.getElementById('ehStockPeopleList');
    if (!people.length) { wrap.innerHTML = '<span style="color:#8b98a8">No one is on this stock&#39;s roster.</span>'; return; }

    const fmt = s2 => s2 ? new Date(s2 + 'T12:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : 'Never done';
    const rowHtml = p => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#1a2230;border-radius:8px;margin-bottom:5px">

      </div>`;
    wrap.innerHTML = _ehGenderSections(people, p => genderByAlias[p.alias] || '', rowHtml);
  } catch {
    document.getElementById('ehStockPeopleList').innerHTML = '<span style="color:#ff5d5d">Failed to load. Try again.</span>';
  }
}

    const fmt = s => new Date(s.replace(' ', 'T')).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    list.innerHTML = rows.map(row => `
      <div style="background:#1a2230;border:1px solid #222d3d;border-radius:10px;padding:14px 16px;margin-bottom:10px${row.is_read ? '' : ';border-left:3px solid #d4af37'}">

          <button onclick="fbAction(${row.id},'delete',this)" style="flex:1;padding:8px;background:rgba(255,93,93,0.12);border:1px solid rgba(255,93,93,0.3);border-radius:8px;color:#ff5d5d;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit">🗑 Dismiss</button>

      </div>`).join('');

}

async function fbAction(id, action, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = action === 'delete'
      ? await fetch(`/api/admin/feedback/${id}`, { method: 'DELETE' })
      : await fetch(`/api/admin/feedback/${id}/read`, { method: 'POST' });
    if (r.ok) {
      _loadFeedbackInbox();
      _refreshFeedbackBadge();
    } else {
      btn.disabled = false; btn.textContent = action === 'delete' ? '🗑 Dismiss' : '✓ Mark Read';
    }
  } catch { btn.disabled = false; btn.textContent = action === 'delete' ? '🗑 Dismiss' : '✓ Mark Read'; }
}
