<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<title>Bill Inbox · APPACHI</title>
<style>
  :root { --bg:#0d1117; --panel:#131922; --border:#222d3d; --text:#e6edf3; --dim:#8b98a8; --gold:#d4af37; --ok:#3fcf6e; --bad:#ff6b63; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding: 24px 16px 40px; text-align: center; }
  h1 { color: var(--gold); font-size: 22px; letter-spacing: .08em; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 22px; }
  .waiting { display: inline-block; margin-bottom: 22px; padding: 10px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: 15px; }
  .waiting b { color: var(--gold); font-size: 22px; margin-right: 4px; }
  .note { display: block; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; }
  .big { display: block; width: 100%; padding: 24px; border-radius: 14px; border: 0; background: var(--gold); color: #1a1405; font-size: 20px; font-weight: 700; margin-bottom: 12px; cursor: pointer; }
  .alt { display: block; width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; }
  input[type=file] { display: none; }
  .status { margin-top: 22px; font-size: 17px; font-weight: 700; min-height: 22px; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .back { display: inline-block; margin-top: 30px; color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
  <h1>APPACHI</h1>
  <div class="sub">Bill Inbox — snap every bill. Enter it on the computer later.</div>
  <div class="waiting" id="waiting"><b>…</b> waiting to be entered</div>
  <input class="note" id="note" placeholder="Note (optional) — e.g. Krishna hallmark" maxlength="200" />
  <label class="big" for="cam">📷 Take photo</label>
  <input type="file" id="cam" accept="image/*" capture="environment" />
  <label class="alt" for="pick">Choose from gallery / PDF</label>
  <input type="file" id="pick" accept="image/*,application/pdf" multiple />
  <div class="status" id="status"></div>
  <div class="thumbs" id="thumbs"></div>
  <a class="back" href="/home.html">← Home</a>
<script>
(function () {
  const status = document.getElementById('status');
  const setStatus = (t, cls) => { status.textContent = t; status.className = 'status ' + (cls || ''); };
  const setWaiting = (n) => { document.getElementById('waiting').innerHTML = `<b>${n}</b> waiting to be entered`; };
  fetch('/purchase-pro/api/inbox/count?firm=2', { credentials: 'same-origin' }).then(r => r.json()).then(d => setWaiting(d.n ?? 0)).catch(() => {});

  async function send(files) {
    for (const f of files) {
      setStatus('Sending…');
      const fd = new FormData();
      fd.append('firm', '2');
      fd.append('note', document.getElementById('note').value.trim());
      fd.append('photo', f);
      try {
        const r = await fetch('/purchase-pro/api/inbox', { method: 'POST', body: fd, credentials: 'same-origin' });
        if (r.status === 401) { location.href = '/login.html'; return; }
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Upload failed');
        setStatus('✓ Saved to Inbox', 'ok');
        setWaiting(d.waiting);
        if (f.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(f);
          document.getElementById('thumbs').prepend(img);
        }
      } catch (e) { setStatus('⚠ ' + e.message + ' — try again', 'bad'); }
    }
  }
  document.getElementById('cam').onchange = (e) => { send([...e.target.files]); e.target.value = ''; };
  document.getElementById('pick').onchange = (e) => { send([...e.target.files]); e.target.value = ''; };
})();
</script>
</body>
</html>
