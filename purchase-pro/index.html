<script>(function (d) { var s = null; try { s = localStorage.getItem('pp_skin'); } catch (e) {}
  if (s === 'leather') { d.dataset.theme = 'light'; d.dataset.skin = 'leather'; } else d.dataset.theme = localStorage.getItem('aj_theme') || 'dark';
})(document.documentElement);</script>

    </a>
    <a class="home-link" href="/home.html" title="Back to Home"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="nav-t">Back to Home</span></a>

      <div>
        <h1 class="page-title" id="pageTitle">Purchase</h1>

      <div class="firm-switch" id="firmSwitch" role="tablist" aria-label="Firm"></div>

<script>
// small screens: the menu slides in from the left; picking a page closes it
(function () {
  var b = document.body, close = function () { b.classList.remove('side-open'); };
  document.getElementById('menuBtn').onclick = function () { b.classList.toggle('side-open'); };
  document.getElementById('sideBackdrop').onclick = close;
  document.querySelector('.side').addEventListener('click', function (e) { if (e.target.closest('a')) close(); });
  window.addEventListener('hashchange', close);
})();
</script>
