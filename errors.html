<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="/icons/favicon-32.png"/>
<title>App Errors · APPACHI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 40px; }
  .back { color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-block; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 24px; color: var(--accent); }
  .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .sum { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .stat { min-width: 120px; padding: 12px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); }
  .stat b { display: block; font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .stat span { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-elev); color: var(--text); font: 700 13px 'Inter', system-ui, sans-serif; cursor: pointer; }
  .btn.red { color: var(--down, #ff5d5d); }
  .err { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
  .cnt { flex-shrink: 0; min-width: 52px; text-align: center; padding: 6px 4px; border-radius: 10px; background: rgba(255,93,93,.12); color: var(--down, #ff5d5d); font-weight: 800; font-size: 20px; line-height: 1.1; }
  .cnt small { display: block; font-size: 10px; font-weight: 700; opacity: .8; }
  .body { flex: 1; min-width: 0; }
  .msg { font-size: 15px; font-weight: 700; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12.5px; color: var(--text-dim); }
  .meta b { color: var(--text); font-weight: 600; }
  .src { margin-top: 6px; font: 12px ui-monospace, Consolas, monospace; color: var(--text-dim); word-break: break-all; }
  .x { flex-shrink: 0; border: 0; background: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 6px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--text-dim); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .empty b { display: block; font-size: 32px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/home.html">← Home</a>
  <div class="head">
    <div><h1>App errors</h1><div class="sub">Problems staff phones and browsers ran into. Same error on the same page = one card with a count.</div></div>
    <div style="display:flex;gap:8px"><button class="btn" id="reload" type="button">↻ Refresh</button><button class="btn red" id="clear" type="button">Clear all</button></div>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var PAGES = { '/': 'Stocks', '/dashboard.html': 'Stocks', '/home.html': 'Home', '/leaves.html': 'Leaves', '/stock-entry.html': 'Stock Entry', '/restock.html': 'Restock', '/reorder.html': 'Reorder' };
  function when(s) {
    if (!s) return '';
    var d = new Date(s.replace(' ', 'T') + 'Z');
    return isNaN(d) ? s : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  }
  var rows = [];
  function draw() {
    var total = rows.reduce(function (a, r) { return a + Number(r.count || 0); }, 0);
    var app = rows.filter(function (r) { return /^App/.test(r.device || ''); }).length;
    $('sum').innerHTML = '<div class="stat"><b>' + rows.length + '</b><span>Different errors</span></div>' +
      '<div class="stat"><b>' + total + '</b><span>Times seen</span></div>' +
      '<div class="stat"><b>' + app + '</b><span>From the app</span></div>';
    if (!rows.length) { $('list').innerHTML = '<div class="empty"><b>✓</b>No errors reported</div>'; return; }
    $('list').innerHTML = rows.map(function (r) {
      var src = (r.src || '').replace(location.origin, '');
      return '<div class="err"><div class="cnt">' + r.count + '<small>times</small></div><div class="body">' +
        '<div class="msg">' + esc(r.msg) + '</div>' +
        '<div class="meta"><span>Page <b>' + esc(PAGES[r.page] || r.page || '—') + '</b></span><span><b>' + esc(r.device || '') + '</b></span>' +
        (r.who ? '<span>Last by <b>' + esc(r.who) + '</b></span>' : '') + '<span>Last <b>' + esc(when(r.last_at)) + '</b></span><span>First ' + esc(when(r.first_at)) + '</span></div>' +
        (src ? '<div class="src">' + esc(src) + (r.line ? ':' + r.line : '') + '</div>' : '') +
        '</div><button class="x" type="button" title="Remove" data-id="' + r.id + '">✕</button></div>';
    }).join('');
  }
  function load() {
    fetch('/api/admin/client-errors').then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
      if (!x.ok) { $('list').innerHTML = '<div class="empty">' + esc(x.d.error || 'Could not load') + '</div>'; return; }
      rows = x.d; draw();
    }).catch(function () { $('list').innerHTML = '<div class="empty">Network error</div>'; });
  }
  $('list').onclick = function (e) {
    var b = e.target.closest('[data-id]'); if (!b) return;
    fetch('/api/admin/client-errors/' + b.dataset.id, { method: 'DELETE' }).then(function (r) {
      if (r.ok) { rows = rows.filter(function (x) { return String(x.id) !== b.dataset.id; }); draw(); }
    });
  };
  $('clear').onclick = function () {
    if (!confirm('Clear all errors?')) return;
    fetch('/api/admin/client-errors', { method: 'DELETE' }).then(function (r) { if (r.ok) { rows = []; draw(); } });
  };
  $('reload').onclick = load;
  load();
</script>
<script src="/auth.js"></script>
<script src="/theme.js"></script>
</body>
</html>
