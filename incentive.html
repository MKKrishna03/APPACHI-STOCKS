<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monthly Incentive · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  #app { display: none; }
  #app.ready { display: block; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .back { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--accent); color: var(--accent); font: 700 13px 'Inter', sans-serif; text-decoration: none; }
  .back:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .title { font-family: 'Fraunces', serif; font-weight: 800; font-size: 22px; letter-spacing: .03em; margin-right: auto; }
  .title small { display: block; font: 500 12px 'Inter', sans-serif; color: var(--text-dim); letter-spacing: 0; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 28px 60px; }
  .menu { display: flex; flex-wrap: wrap; gap: 14px; }
  .tile { display: inline-flex; align-items: center; gap: 12px; padding: 18px 22px; min-width: 220px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: 800 15px 'Inter', sans-serif; letter-spacing: .03em; cursor: pointer; }
  .tile:hover, .tile.on { border-color: var(--accent); color: var(--accent); }
  .tile small { display: block; font: 500 12px 'Inter', sans-serif; color: var(--text-dim); letter-spacing: 0; margin-top: 3px; }
  #staffBox { margin-top: 22px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .search { height: 40px; width: 280px; max-width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
  .count { margin-left: auto; font-size: 13px; color: var(--text-dim); }
  .count b { color: var(--text); font-size: 16px; }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
  tr:last-child td { border-bottom: 0; }
  tr.off td { opacity: .5; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); }
  .tag.ACTIVE { color: #2fbf71; border-color: color-mix(in srgb, #2fbf71 50%, var(--border)); }
  .tag.INACTIVE { color: #ff5d5d; border-color: color-mix(in srgb, #ff5d5d 50%, var(--border)); }
  .msg { padding: 30px; text-align: center; color: var(--text-dim); }
  @media (max-width: 600px) { .topbar { padding: 12px 16px; } .wrap { padding: 18px 16px 40px; } .tile { width: 100%; } .count { margin-left: 0; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back" href="/home.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Back to Home</a>
    <div class="title">Monthly Incentive<small>Staff incentive for the month</small></div>
  </header>
  <main class="wrap">
    <div class="menu">
      <button type="button" class="tile" id="staffBtn">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>
        <span>STAFF LIST<small>Staff from Payroll</small></span>
      </button>
    </div>

    <section id="staffBox" hidden>
      <div class="bar">
        <input class="search" id="q" type="search" placeholder="Search name or ID…" autocomplete="off">
        <label class="chk"><input type="checkbox" id="showOff"> Show inactive</label>
        <span class="count" id="count"></span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>#</th><th>Emp ID</th><th>Name</th></tr></thead>
          <tbody id="rows"><tr><td colspan="3" class="msg">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let staff = null;

function render() {
  const q = $('q').value.trim().toLowerCase();
  const showOff = $('showOff').checked;
  const list = staff.filter(e => (showOff || e.status === 'ACTIVE') &&
    (!q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q)));
  $('count').innerHTML = `<b>${list.length}</b> staff`;
  $('rows').innerHTML = list.length ? list.map((e, i) => `
    <tr class="${e.status === 'ACTIVE' ? '' : 'off'}">
      <td>${i + 1}</td><td>${esc(e.id)}</td><td><b>${esc(e.name)}</b></td>
    </tr>`).join('') : '<tr><td colspan="3" class="msg">No staff match.</td></tr>';
}

async function loadStaff() {
  try {
    const r = await fetch('/payroll/api/employees', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    staff = data.map(e => ({
      id: String(e.employee_id ?? '').trim(),
      name: String(e.employee_name ?? '').trim(),
      designation: String(e.designation ?? '').trim(),
      type: String(e.type ?? '').trim(),
      status: String(e.status ?? '').trim().toUpperCase(),
    })).sort((a, b) => a.name.localeCompare(b.name));
    render();
  } catch (err) {
    staff = null;
    $('rows').innerHTML = `<tr><td colspan="3" class="msg">Could not load staff (${esc(err.message)}). Try again.</td></tr>`;
  }
}

$('staffBtn').onclick = () => {
  const box = $('staffBox');
  box.hidden = !box.hidden;
  $('staffBtn').classList.toggle('on', !box.hidden);
  if (!box.hidden && !staff) loadStaff();
};
$('q').oninput = () => staff && render();
$('showOff').onchange = () => staff && render();

(async () => {
  try {
    const r = await fetch('/api/me', { credentials: 'same-origin' });
    if (!r.ok) return location.replace('/login.html');
    const me = await r.json();
    if (me.role !== 'OWNER') return location.replace('/home.html');
  } catch { return location.replace('/login.html'); }
  document.getElementById('app').classList.add('ready');
})();
</script>
<script src="/idle.js" defer></script>
</body>
</html>
