<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b8973a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="APPACHI"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Availability Checking · APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(14px, 1.6vw, 16px); }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  :root { --grp-head: #3d9be9; --prd-head: #1fbfb8; --head-text: #fff; }

  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { min-height: calc(64px + env(safe-area-inset-top, 0px)); height: auto; flex-shrink: 0; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top, 0px) 28px 0; display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .page-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .theme-btn, .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-dim); cursor: pointer; transition: all .15s; flex-shrink: 0; text-decoration: none; }
  .theme-btn:hover, .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-left { display: flex; align-items: center; gap: 12px; }

  .layout { flex: 1; display: flex; min-height: 0; }

  /* ── Side list of uploads ── */
  .side { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side-actions { display: flex; gap: 8px; padding: 16px 16px 4px; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .side-head h2 { font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
  .upload-link { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font: 500 12px 'Inter', sans-serif; color: var(--text-dim); cursor: pointer; transition: all .15s; text-decoration: none; }
  .upload-link:hover { border-color: var(--accent); color: var(--accent); }
  .upload-link:disabled { opacity: .5; cursor: wait; }
  .side-status { padding: 0 16px; font-size: 12px; line-height: 1.4; }
  .side-status:not(:empty) { padding-bottom: 10px; }
  .side-status.ok { color: var(--accent); }
  .side-status.err { color: #e5534b; }
  .file-list { list-style: none; overflow-y: auto; flex: 1; padding: 0 8px 12px; }
  .file-item { position: relative; padding: 10px 34px 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
  .file-item:hover { background: var(--panel-elev); }
  .file-item.active { background: var(--panel-elev); border-color: var(--accent); }
  .file-name { font-size: 13px; font-weight: 500; word-break: break-word; }
  .file-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .file-del { position: absolute; top: 8px; right: 6px; width: 24px; height: 24px; border: none; background: none; color: var(--text-dim); cursor: pointer; border-radius: 6px; font-size: 16px; line-height: 1; opacity: 0; transition: opacity .15s; }
  .file-item:hover .file-del, .file-item.active .file-del { opacity: 1; }
  .file-del:hover { color: #e5534b; background: rgba(229,83,75,.1); }
  .side-empty { padding: 24px 16px; font-size: 13px; color: var(--text-dim); text-align: center; line-height: 1.6; }

  /* ── Report ── */
  .content { flex: 1; min-width: 0; overflow: auto; padding: 24px 28px; }
  .report-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .report-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; word-break: break-word; }
  .report-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .report-tools { display: flex; gap: 8px; }
  .tool-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; font: 500 12px 'Inter', sans-serif; color: var(--text); cursor: pointer; }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .placeholder { margin: 80px auto; text-align: center; color: var(--text-dim); font-size: 14px; }

  table.rpt { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
  table.rpt th { background: var(--grp-head); color: var(--head-text); font-weight: 600; padding: 9px 10px; text-align: left; white-space: nowrap; border-right: 1px solid rgba(255,255,255,.25); }
  table.rpt td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.rpt .num { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  table.rpt th.num { font-family: 'Inter', sans-serif; }
  .grp-table > thead th { position: sticky; top: -24px; z-index: 2; }
  .grp-row.even td { background: var(--panel-elev); }
  .grp-row { cursor: pointer; }
  .grp-row:hover td { background: color-mix(in srgb, var(--grp-head) 10%, var(--panel)); }
  .tog { width: 40px; text-align: center !important; font-size: 18px; font-weight: 600; color: var(--text-dim); user-select: none; }
  .grp-name { font-weight: 500; }
  .detail-row > td { padding: 6px 0 14px 40px; background: var(--panel); }
  .total-row td { background: var(--grp-head) !important; color: var(--head-text); font-weight: 700; font-size: 14px; position: sticky; bottom: -24px; }
  .total-row td.lbl { background: var(--panel-elev) !important; color: var(--text); }

  table.prd { border: 1px solid var(--border); }
  table.prd th { background: var(--prd-head); }
  table.prd tbody tr.odd > td { background: var(--panel-elev); }
  .prd-link { color: var(--grp-head); cursor: pointer; text-decoration: none; }
  .prd-link:hover { text-decoration: underline; }
  .prd-total td { background: var(--prd-head) !important; color: var(--head-text); font-weight: 700; }
  .prd-total td.lbl { background: var(--panel-elev) !important; color: var(--text); }
  .tag-row > td { padding: 4px 0 10px 24px; }
  table.tags { width: auto; min-width: 60%; border: 1px solid var(--border); font-size: 12px; }
  table.tags th { background: var(--panel-elev); color: var(--text-dim); font-size: 12px; padding: 6px 10px; }
  table.tags td { padding: 5px 10px; }

  @media (max-width: 900px) {
    .topbar { padding: 0 16px; }
    .layout { flex-direction: column; overflow-y: auto; }
    .side { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .content { padding: 16px; overflow: visible; }
    .file-del { opacity: 1; }
    .grp-table > thead th { position: static; }
    .total-row td { position: static; }
  }
</style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/reorder.html" class="back-btn" title="Back to Reorder" aria-label="Back to Reorder">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="page-title">Availability Checking</div>
      </div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
    </header>

    <div class="layout">
      <aside class="side">
        <div class="side-actions">
          <button class="upload-link" id="uploadBtn" type="button" title="Upload Tagging Excel">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload
          </button>
          <a class="upload-link" href="/stock-check.html" title="Check which models are available in stock">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Stock Check
          </a>
          <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
        </div>
        <div class="side-head">
          <h2>Uploaded Files</h2>
        </div>
        <div class="side-status" id="sideStatus"></div>
        <ul class="file-list" id="fileList"></ul>
      </aside>

      <section class="content" id="content">
        <div class="placeholder">Select a file from the list to see its report.</div>
      </section>
    </div>
  </main>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  var MAX_BYTES = 5 * 1024 * 1024;
  // Each saved item: [tagNo, productGroup, product, qty, weight, tagDate, supplier]
  var T = { TAG: 0, GROUP: 1, PRODUCT: 2, QTY: 3, WT: 4, DATE: 5, SUPPLIER: 6 };
  var SRC = ['Tag No', 'Product Group', 'Product', 'Qty', 'Gross Wt', 'Tag Date', 'Supplier'];

  var uploadBtn = document.getElementById('uploadBtn');
  var input = document.getElementById('fileInput');
  var statusEl = document.getElementById('sideStatus');
  var listEl = document.getElementById('fileList');
  var content = document.getElementById('content');
  var files = [];
  var activeId = null;

  function setStatus(msg, ok) {
    statusEl.textContent = msg || '';
    statusEl.className = 'side-status ' + (ok ? 'ok' : 'err');
  }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function norm(v) { return String(v == null ? '' : v).trim().toLowerCase(); }
  function toNum(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function fmtWt(n) { return n.toLocaleString('en-IN', { minimumFractionDigits: 3, maximumFractionDigits: 3 }); }
  function fmtInt(n) { return n.toLocaleString('en-IN'); }
  function fmtWhen(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' +
           d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  async function api(url, opts) {
    var r = await fetch(url, opts);
    var body = await r.json().catch(function () { return null; });
    if (r.status === 401) { location.href = '/login.html'; throw new Error('Session expired'); }
    if (!r.ok) throw new Error((body && body.error) || 'HTTP ' + r.status);
    return body;
  }

  // ── Excel → items ──
  // The Tagging export has a company name and title above the headings, so
  // find the heading row instead of assuming row 1.
  function parseTagging(rows) {
    var hr = -1;
    for (var i = 0; i < Math.min(rows.length, 20); i++) {
      var cells = rows[i].map(norm);
      if (cells.indexOf('tag no') !== -1 && cells.indexOf('product group') !== -1) { hr = i; break; }
    }
    if (hr === -1) return { error: 'Not a Tagging file — "Tag No" and "Product Group" headings not found.' };
    var heads = rows[hr].map(norm);
    var idx = SRC.map(function (s) { return heads.indexOf(norm(s)); });
    var missing = SRC.filter(function (s, k) { return idx[k] === -1; });
    if (missing.length) return { error: 'Missing column(s): ' + missing.join(', ') + '.' };

    var items = [];
    for (var r = hr + 1; r < rows.length; r++) {
      var row = rows[r];
      var tag = String(row[idx[T.TAG]] || '').trim();
      if (!tag || tag.toLowerCase() === 'total') continue;   // skip the export's Total row
      items.push([
        tag,
        String(row[idx[T.GROUP]] || '').trim() || '(No group)',
        String(row[idx[T.PRODUCT]] || '').trim() || '(No product)',
        toNum(row[idx[T.QTY]]),
        toNum(row[idx[T.WT]]),
        String(row[idx[T.DATE]] || '').trim(),
        String(row[idx[T.SUPPLIER]] || '').trim()
      ]);
    }
    if (!items.length) return { error: 'No tagged items found in this file.' };
    return { items: items };
  }

  uploadBtn.addEventListener('click', function () { input.click(); });

  input.addEventListener('change', function () {
    var file = input.files[0];
    input.value = '';
    if (!file) return;
    if (!/\.(xlsx|xls)$/i.test(file.name)) return setStatus('Only .xlsx or .xls files are allowed.');
    if (file.size > MAX_BYTES) return setStatus('File is larger than 5 MB.');

    var reader = new FileReader();
    reader.onload = async function (e) {
      var parsed;
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false, defval: '', raw: false });
        parsed = parseTagging(rows);
      } catch (ex) {
        return setStatus('Could not read this file. Make sure it is a valid Excel file.');
      }
      if (parsed.error) return setStatus(parsed.error);

      uploadBtn.disabled = true;
      setStatus('Saving…', true);
      try {
        var res = await api('/api/tag-reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file_name: file.name, items: parsed.items })
        });
        setStatus('');
        await loadList();
        openReport(res.id);
      } catch (err) {
        setStatus('Upload failed: ' + err.message);
      } finally {
        uploadBtn.disabled = false;
      }
    };
    reader.onerror = function () { setStatus('Could not read this file.'); };
    reader.readAsArrayBuffer(file);
  });

  // ── Uploaded files list ──
  async function loadList() {
    try {
      files = await api('/api/tag-reports');
    } catch (err) {
      listEl.innerHTML = '<li class="side-empty">Could not load files: ' + esc(err.message) + '</li>';
      return;
    }
    renderList();
  }

  function renderList() {
    if (!files.length) {
      listEl.innerHTML = '<li class="side-empty">No files uploaded yet.<br>Use <b>Upload</b> above to add a Tagging Excel.</li>';
      return;
    }
    listEl.innerHTML = files.map(function (f) {
      return '<li class="file-item' + (f.id === activeId ? ' active' : '') + '" data-id="' + f.id + '">' +
        '<div class="file-name">' + esc(f.file_name) + '</div>' +
        '<div class="file-meta">' + esc(fmtWhen(f.uploaded_at)) + '</div>' +
        '<button class="file-del" data-del="' + f.id + '" title="Delete" aria-label="Delete">&times;</button>' +
      '</li>';
    }).join('');
  }

  listEl.addEventListener('click', async function (e) {
    var del = e.target.closest('[data-del]');
    if (del) {
      e.stopPropagation();
      var id = Number(del.dataset.del);
      var f = files.find(function (x) { return x.id === id; });
      if (!confirm('Delete "' + (f ? f.file_name : 'this file') + '"?')) return;
      try {
        await api('/api/tag-reports/' + id, { method: 'DELETE' });
        if (activeId === id) {
          activeId = null;
          content.innerHTML = '<div class="placeholder">Select a file from the list to see its report.</div>';
        }
        await loadList();
      } catch (err) { setStatus('Delete failed: ' + err.message); }
      return;
    }
    var li = e.target.closest('.file-item');
    if (li) openReport(Number(li.dataset.id));
  });

  // ── Report ──
  async function openReport(id) {
    activeId = id;
    renderList();
    content.innerHTML = '<div class="placeholder">Loading…</div>';
    try {
      var rep = await api('/api/tag-reports/' + id);
      if (activeId !== id) return;
      renderReport(rep);
    } catch (err) {
      content.innerHTML = '<div class="placeholder">Could not load report: ' + esc(err.message) + '</div>';
    }
  }

  var byNatural = function (a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); };

  // groups: [{ name, tags, qty, wt, products: [{ name, tags, qty, wt, items: [...] }] }]
  function groupItems(items) {
    var gm = {};
    items.forEach(function (it) {
      var g = gm[it[T.GROUP]] || (gm[it[T.GROUP]] = { name: it[T.GROUP], tags: 0, qty: 0, wt: 0, pm: {} });
      var p = g.pm[it[T.PRODUCT]] || (g.pm[it[T.PRODUCT]] = { name: it[T.PRODUCT], tags: 0, qty: 0, wt: 0, items: [] });
      g.tags++; g.qty += it[T.QTY]; g.wt += it[T.WT];
      p.tags++; p.qty += it[T.QTY]; p.wt += it[T.WT];
      p.items.push(it);
    });
    return Object.keys(gm).sort(byNatural).map(function (k) {
      var g = gm[k];
      g.products = Object.keys(g.pm).sort(byNatural).map(function (pk) { return g.pm[pk]; });
      delete g.pm;
      return g;
    });
  }

  var groups = [];

  function renderReport(rep) {
    groups = groupItems(rep.items);
    var tTags = 0, tQty = 0, tWt = 0;
    groups.forEach(function (g) { tTags += g.tags; tQty += g.qty; tWt += g.wt; });

    var html =
      '<div class="report-head">' +
        '<div><div class="report-title">' + esc(rep.file_name) + '</div>' +
        '<div class="report-sub">Uploaded ' + esc(fmtWhen(rep.uploaded_at)) + (rep.uploaded_by ? ' by ' + esc(rep.uploaded_by) : '') + '</div></div>' +
        '<div class="report-tools"><button class="tool-btn" data-all="open">Expand all</button><button class="tool-btn" data-all="close">Collapse all</button></div>' +
      '</div>' +
      '<table class="rpt grp-table"><thead><tr>' +
        '<th class="tog">+</th><th>Product Group</th><th class="num">Tags</th><th class="num">Qty</th><th class="num">Wt</th>' +
      '</tr></thead><tbody>';
    groups.forEach(function (g, gi) {
      html += '<tr class="grp-row' + (gi % 2 ? ' even' : '') + '" data-g="' + gi + '">' +
        '<td class="tog">+</td><td class="grp-name">' + esc(g.name) + '</td>' +
        '<td class="num">' + fmtInt(g.tags) + '</td><td class="num">' + fmtInt(g.qty) + '</td><td class="num">' + fmtWt(g.wt) + '</td></tr>';
    });
    html += '<tr class="total-row"><td class="lbl"></td><td class="lbl">Total (' + groups.length + ')</td>' +
      '<td class="num">' + fmtInt(tTags) + '</td><td class="num">' + fmtInt(tQty) + '</td><td class="num">' + fmtWt(tWt) + '</td></tr>' +
      '</tbody></table>';
    content.innerHTML = html;
  }

  function productTable(g, gi) {
    var html = '<table class="rpt prd"><thead><tr><th>Product Name</th><th class="num">Tags</th><th class="num">Qty</th><th class="num">Weight</th></tr></thead><tbody>';
    g.products.forEach(function (p, pi) {
      html += '<tr' + (pi % 2 ? ' class="odd"' : '') + '><td><a class="prd-link" data-g="' + gi + '" data-p="' + pi + '">' + esc(p.name) + '</a></td>' +
        '<td class="num">' + fmtInt(p.tags) + '</td><td class="num">' + fmtInt(p.qty) + '</td><td class="num">' + fmtWt(p.wt) + '</td></tr>';
    });
    html += '<tr class="prd-total"><td class="lbl">Total (' + g.products.length + ')</td>' +
      '<td class="num">' + fmtInt(g.tags) + '</td><td class="num">' + fmtInt(g.qty) + '</td><td class="num">' + fmtWt(g.wt) + '</td></tr>';
    return html + '</tbody></table>';
  }

  function tagTable(p) {
    var html = '<table class="rpt tags"><thead><tr><th>Tag No</th><th>Tag Date</th><th>Supplier Name</th><th class="num">Qty</th><th class="num">Weight</th></tr></thead><tbody>';
    p.items.forEach(function (it) {
      html += '<tr><td>' + esc(it[T.TAG]) + '</td><td>' + esc(it[T.DATE]) + '</td><td>' + esc(it[T.SUPPLIER]) + '</td>' +
        '<td class="num">' + fmtInt(it[T.QTY]) + '</td><td class="num">' + fmtWt(it[T.WT]) + '</td></tr>';
    });
    return html + '</tbody></table>';
  }

  function toggleGroup(row, open) {
    var gi = Number(row.dataset.g);
    var next = row.nextElementSibling;
    var isOpen = next && next.classList.contains('detail-row');
    if (open === undefined) open = !isOpen;
    if (open === isOpen) return;
    if (open) {
      var tr = document.createElement('tr');
      tr.className = 'detail-row';
      tr.innerHTML = '<td colspan="5">' + productTable(groups[gi], gi) + '</td>';
      row.after(tr);
    } else {
      next.remove();
    }
    row.querySelector('.tog').textContent = open ? '−' : '+';
  }

  content.addEventListener('click', function (e) {
    var all = e.target.closest('[data-all]');
    if (all) {
      var open = all.dataset.all === 'open';
      content.querySelectorAll('.grp-row').forEach(function (r) { toggleGroup(r, open); });
      return;
    }
    var link = e.target.closest('.prd-link');
    if (link) {
      var prow = link.closest('tr');
      var nx = prow.nextElementSibling;
      if (nx && nx.classList.contains('tag-row')) { nx.remove(); return; }
      var tr = document.createElement('tr');
      tr.className = 'tag-row';
      tr.innerHTML = '<td colspan="4">' + tagTable(groups[Number(link.dataset.g)].products[Number(link.dataset.p)]) + '</td>';
      prow.after(tr);
      return;
    }
    var grow = e.target.closest('.grp-row');
    if (grow) toggleGroup(grow);
  });

  loadList();
