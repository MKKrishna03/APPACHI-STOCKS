<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.dataset.theme = localStorage.getItem('aj_theme') || 'dark';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>APPACHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 100vh; }

  /* Hidden until we know who's here — this page only ever shows to a signed-in
     owner on the web; everyone else is redirected straight past it. */
  #chooser { display: none; width: 100%; max-width: 900px; text-align: center; }
  #chooser.ready { display: block; }

  .brand { font-family: 'Fraunces', serif; font-weight: 800; font-size: 28px; color: var(--accent); letter-spacing: .06em; margin-bottom: 6px; }
  .welcome { font-size: 14px; color: var(--text-dim); margin-bottom: 32px; }
  .welcome b { color: var(--text); font-weight: 600; }

  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .choice {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 40px 20px; border-radius: 16px; text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--border);
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,.25); outline: none; }
  .choice svg { color: var(--accent); }
  .choice-name { font-family: 'Fraunces', serif; font-weight: 800; font-size: 26px; letter-spacing: .08em; }
  .choice-sub { font-size: 12px; color: var(--text-dim); }

  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } .choice { padding: 30px 20px; } }
  /* Restocking summary — filled in after the page shows, hidden if it can't load */
  .rs-card { display: block; margin-top: 18px; padding: 18px 20px; border-radius: 16px; text-align: left; text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); transition: border-color .15s, box-shadow .15s; }
  .rs-card:hover, .rs-card:focus-visible { border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,.25); outline: none; }
  .rs-card[hidden] { display: none; }
  .rs-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .rs-title { font-family: 'Fraunces', serif; font-weight: 800; font-size: 20px; letter-spacing: .08em; }
  .rs-go { font-size: 12px; color: var(--accent); font-weight: 600; }
  .rs-row { display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .rs-ctr { font-weight: 600; font-size: 13px; letter-spacing: .08em; }
  .rs-ctr small { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 0; color: var(--text-dim); margin-top: 2px; }
  .rs-ctr small.old { color: #f0b429; }
  .rs-num { font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .rs-num.need { color: #ff6b63; }
  .rs-num.ok { color: #3fcf6e; }
  .rs-num.warn { color: #f0b429; }
  .rs-lbl { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
  @media (max-width: 620px) { .rs-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rs-ctr { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main id="chooser">
  <div class="brand">&#11041; APPACHI</div>
  <div class="welcome">Welcome, <b id="who"></b></div>

  <div class="choices">
    <a class="choice" href="/">
      <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      <span class="choice-name">STOCKS</span>
      <span class="choice-sub">Assignments, entry &amp; staff</span>
    </a>
    <a class="choice" id="billingLink" href="/billing">
      <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>
      <span class="choice-name">BILLING</span>
      <span class="choice-sub">Quotations, products &amp; scrap</span>
    </a>
    <a class="choice" href="/payroll/">
      <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
      <span class="choice-name">PAYROLL</span>
      <span class="choice-sub">Salary, attendance &amp; advances</span>
    </a>
    <a class="choice" href="/purchase/">
      <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="choice-name">PURCHASE</span>
      <span class="choice-sub">Bills, vouchers &amp; labour</span>
    </a>
    <a class="choice" href="/sales/">
      <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
      <span class="choice-name">SALES</span>
      <span class="choice-sub">Activity, quotations &amp; review</span>
    </a>
  </div>
  <a class="rs-card" id="rsCard" href="/restock.html" hidden>
    <div class="rs-head"><span class="rs-title">RESTOCKING</span><span class="rs-go">Open →</span></div>
    <div id="rsRows"></div>
  </a>
</main>

<script>
// Web only, owners only. The installed native app and non-owner staff (who
// only have Stocks) go straight to the dashboard exactly as before.
(async () => {
  if (window.Capacitor?.isNativePlatform?.()) { location.replace('/'); return; }
  let me;
  try {
    const r = await fetch('/api/me');
    if (!r.ok) { location.replace('/login.html'); return; }
    me = await r.json();
  } catch { location.replace('/login.html'); return; }
  if (me.role !== 'OWNER') { location.replace('/'); return; }

  document.getElementById('who').textContent = me.name || '';
  // Billing has no login of its own — it reads this name to stamp the sales
  // person on quotations it creates.
  document.getElementById('billingLink').href = '/billing?staff=' + encodeURIComponent(me.name || '');
  document.getElementById('chooser').classList.add('ready');
  loadRestockSummary();
})();

// Restocking at a glance, per counter: pieces still to order, ranges ordered and waiting, arrived this week, dead stock
async function loadRestockSummary() {
  let d;
  try {
    const r = await fetch('/api/restock/summary');
    if (!r.ok) return;
    d = await r.json();
  } catch { return; }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n, lbl, cls) => `<div><div class="rs-num ${n ? cls : ''}">${Number(n).toLocaleString('en-IN')}</div><div class="rs-lbl">${lbl}</div></div>`;
  const rows = (d.counters || []).filter(c => c.lastImport || c.toOrder || c.waiting);
  if (!rows.length) return;
  document.getElementById('rsRows').innerHTML = rows.map(c => {
    const days = c.lastImport ? Math.floor((Date.now() - new Date(c.lastImport).getTime()) / 86400000) : null;
    const when = days == null ? 'Never imported' : days === 0 ? 'Imported today' : days === 1 ? 'Imported yesterday' : `Imported ${days} days ago`;
    return `<div class="rs-row"><div class="rs-ctr">${esc(c.counter)}<small${days != null && days >= 2 ? ' class="old"' : ''}>${when}</small></div>` +
      num(c.toOrder, 'Pieces to order', 'need') + num(c.waiting, 'Ranges ordered · waiting', 'warn') +
      num(c.arrivedWeek, 'Arrived this week', 'ok') + num(c.dead, 'Dead stock ranges', 'warn') + '</div>';
  }).join('');
  document.getElementById('rsCard').hidden = false;
}
</script>
</body>
</html>
